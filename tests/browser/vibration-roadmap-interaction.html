<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibration roadmap interaction regression</title>
  <link rel="stylesheet" href="../../tabs/vibration-roadmap-panel.css">
  <style>
    :root { color-scheme: dark; --text-muted: #aab5c4; }
    html, body { margin: 0; min-height: 100%; background: #0b1220; color: #e5edf6; font-family: system-ui, sans-serif; }
    #host { padding: 16px; }
    .engineering-console-layout { display: grid; gap: 12px; align-items: start; }
    .mock-pane { min-height: 180px; padding: 12px; border: 1px solid #334155; border-radius: 8px; }
    .mock-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .mock-controls button { padding: 6px 8px; }
  </style>
</head>
<body>
  <main id="host">
    <div class="engineering-console-layout">
      <section class="mock-pane">Navigation</section>
      <section class="mock-pane">
        <div class="mock-controls" id="mock-controls">
          <button type="button" data-vi-workspace-tab="screening" id="workspace-screening">Screening workspace</button>
          <button type="button" data-vi-workspace-tab="identification" id="workspace-identification">Identification workspace</button>
          <button type="button" data-vi-row="row-a" id="assessment-row-a">Assessment A</button>
          <button type="button" data-vi-row="row-b" id="assessment-row-b">Assessment B</button>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import {
      createVibrationRoadmapController,
      VIBRATION_ROADMAP_STATE_EVENT,
    } from '../../tabs/vibration-roadmap-controller.js';
    import { buildVibrationRoadmapScopeChoices } from '../../tabs/vibration-roadmap-scope-selection.js';

    const host = document.querySelector('#host');
    const counters = { workspace: 0, rowA: 0, rowB: 0 };

    document.querySelector('#workspace-screening').addEventListener('click', () => { counters.workspace += 1; });
    document.querySelector('#assessment-row-a').addEventListener('click', () => { counters.rowA += 1; });
    document.querySelector('#assessment-row-b').addEventListener('click', () => { counters.rowB += 1; });

    const selectedAssessment = Object.freeze({
      schema: 'VibrationIntegrityRoadmapAssessmentContext.v1',
      authority: Object.freeze({
        purpose: 'SELECTED_REGISTER_SCOPE_WORKFLOW_CONTEXT_ONLY',
        determinesApplicability: false,
        determinesCompleteness: false,
        createsCaseIdentity: false,
        persistenceAuthority: 'NONE',
      }),
      scopeChoices: buildVibrationRoadmapScopeChoices([
        { rowKey: 'row-a', line: 'L-100', caseId: 'NORMAL', canonicalId: 'ASMT-A' },
        { rowKey: 'row-b', line: 'L-100', caseId: 'STARTUP', canonicalId: 'ASMT-B' },
      ], 'row-a'),
      lineCaseAssessmentStatus: Object.freeze({
        schema: 'VibrationLineCaseAssessmentStatus.v1',
        state: 'ASSESSMENT_INCOMPLETE',
        scope: Object.freeze({ line: 'L-100', caseId: 'NORMAL', canonicalId: 'ASMT-A' }),
        nextActionCode: 'COMPLETE_REQUIRED_ASSESSMENTS',
        completeness: Object.freeze({ state: 'INCOMPLETE' }),
        screeningEvidence: Object.freeze({ state: 'NONE' }),
        authority: Object.freeze({
          purpose: 'LINE_CASE_WORKFLOW_STATUS_PROJECTION_ONLY',
          determinesApplicability: false,
          determinesCompleteness: false,
        }),
      }),
    });

    const controller = createVibrationRoadmapController(host, {
      initialState: {
        context: { selectedAssessment },
      },
    });
    controller.render({ definition: { id: 'vibration-integrity', family: 'VIB' }, state: { familyLanding: 'VIB' } });

    globalThis.__VIBRATION_ROADMAP_BROWSER__ = {
      counters,
      dispatchState(detail = {}) {
        host.dispatchEvent(new CustomEvent(VIBRATION_ROADMAP_STATE_EVENT, { detail }));
      },
      removeWorkspaceTarget() {
        document.querySelector('#workspace-screening')?.remove();
      },
      removeAssessmentTarget(rowKey) {
        host.querySelector(`[data-vi-row="${rowKey}"]`)?.remove();
      },
      destroy() { controller.destroy(); },
    };
    globalThis.__VIBRATION_ROADMAP_BROWSER_READY__ = true;
  </script>
</body>
</html>
