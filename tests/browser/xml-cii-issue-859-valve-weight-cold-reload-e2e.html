<!doctype html>
<meta charset="utf-8">
<title>Issue 859 Valve Weight cold reload</title>
<pre id="out">RUNNING</pre>
<script type="module">
import { createMasterDatasetImportCoordinator } from '../../tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js?v=20261006-c05-4-weight-browser-1';
import { commitDatasetReadyMaster } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js?v=20261006-c05-4-weight-browser-1';
import { hydratePersistedMasterDatasets } from '../../tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js?v=20261006-c05-4-weight-browser-1';
import { materializeMasterDatasetRows } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js?v=20261006-c05-4-weight-browser-1';

const STAGE_KEY = 'xml-cii-issue-859-stage';
const EXPECTED_KEY = 'xml-cii-issue-859-expected';
const SOURCE_URL = '../../docs/Masters/wtValveweights.json';
const SOURCE_NAME = 'wtValveweights.json';

function requireValue(condition, message) {
  if (!condition) throw new Error(message);
}

function blankContext() {
  return {
    config: {},
    rawRows: {},
    mappingRows: {},
    datasetRefs: {},
    rowCounts: {},
    previewRows: {},
    sourceMetadata: {},
    appliedMappingRevision: {},
  };
}

function deleteDb(name) {
  return new Promise((resolve) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => resolve();
    request.onblocked = () => resolve();
  });
}

async function firstLoad() {
  await deleteDb('xml-cii-master-datasets-v1');
  for (const suffix of [
    'xml-cii-master-source-weight',
    'xml-cii-master-weight',
    'xml-cii-master-raw-weight',
    'xml-cii-master-workbook-weight',
  ]) localStorage.removeItem(suffix);
  localStorage.removeItem(EXPECTED_KEY);

  const coordinator = createMasterDatasetImportCoordinator();
  try {
    const response = await fetch(SOURCE_URL, { cache: 'no-store' });
    requireValue(response.ok, `Valve Weight fixture fetch failed HTTP ${response.status}`);
    const buffer = await response.arrayBuffer();
    const ready = await coordinator.openBuffer('weight', buffer, SOURCE_NAME, {
      config: {},
      currentMap: {},
    });

    requireValue(ready?.metadata?.datasetId, 'Valve Weight dataset id missing');
    requireValue(Number(ready?.metadata?.datasetRevision) > 0, 'Valve Weight worker datasetRevision missing');
    requireValue(Number(ready?.metadata?.rowCount) > 0, 'Valve Weight dataset is empty');
    requireValue(String(ready?.metadata?.masterFingerprint || ''), 'Valve Weight fingerprint missing');

    const liveRows = await coordinator.getRows('weight', 0, Math.min(3, ready.metadata.rowCount));
    requireValue((liveRows?.rows || []).length > 0, 'active-session Valve Weight rows are not readable');

    const committed = commitDatasetReadyMaster({
      context: blankContext(),
      config: {},
      key: 'weight',
      ready,
      sourceMetadata: {
        key: 'weight',
        source: SOURCE_NAME,
        sourceType: 'issue-859-browser',
        status: 'loaded',
        rowCount: Number(ready.metadata.rowCount || 0),
      },
    });

    requireValue(
      Number(committed.datasetRef?.datasetRevision) === Number(ready.metadata.datasetRevision),
      'runtime datasetRef lost Valve Weight datasetRevision',
    );
    requireValue(
      committed.datasetRef?.masterFingerprint === ready.metadata.masterFingerprint,
      'runtime datasetRef changed Valve Weight fingerprint',
    );
    requireValue(
      Number(committed.config?.weight?.masterRevision) === Number(committed.revision),
      'config.weight.masterRevision is not the applied mapping revision',
    );

    const custody = JSON.parse(localStorage.getItem('xml-cii-master-source-weight') || '{}');
    requireValue(custody.persistenceMode === 'indexeddb', 'Valve Weight restart custody is not indexeddb');
    requireValue(custody.datasetId === committed.datasetRef.datasetId, 'Valve Weight restart dataset id mismatch');
    requireValue(
      Number(custody.datasetRevision) === Number(ready.metadata.datasetRevision),
      'Valve Weight restart custody lost datasetRevision',
    );
    requireValue(
      custody.masterFingerprint === ready.metadata.masterFingerprint,
      'Valve Weight restart custody changed fingerprint',
    );
    requireValue(localStorage.getItem('xml-cii-master-weight') == null, 'normalized weight rows duplicated into localStorage');
    requireValue(localStorage.getItem('xml-cii-master-raw-weight') == null, 'raw weight rows duplicated into localStorage');

    localStorage.setItem(EXPECTED_KEY, JSON.stringify({
      datasetId: committed.datasetRef.datasetId,
      datasetRevision: committed.datasetRef.datasetRevision,
      masterFingerprint: committed.datasetRef.masterFingerprint,
      appliedRevision: committed.revision,
      rowCount: committed.datasetRef.rowCount,
      firstRow: JSON.stringify((liveRows?.rows || [])[0] || {}),
    }));
    localStorage.setItem(STAGE_KEY, 'hydrate');
    location.reload();
  } finally {
    coordinator.dispose();
  }
}

async function secondLoad() {
  const expected = JSON.parse(localStorage.getItem(EXPECTED_KEY) || '{}');
  requireValue(expected.datasetId, 'expected first-load Valve Weight custody missing');

  const stateRef = { current: { supportConfigJson: '{}', masterContext: blankContext() } };
  const changed = await hydratePersistedMasterDatasets(stateRef);
  requireValue(changed === true, 'Valve Weight cold hydration reported no change');

  const context = stateRef.current.masterContext;
  const ref = context.datasetRefs?.weight;
  requireValue(ref, 'Valve Weight datasetRef missing after cold hydration');
  requireValue(ref.datasetId === expected.datasetId, 'Valve Weight dataset id changed across reload');
  requireValue(Number(ref.datasetRevision) === Number(expected.datasetRevision), 'Valve Weight dataset revision changed across reload');
  requireValue(ref.masterFingerprint === expected.masterFingerprint, 'Valve Weight fingerprint changed across reload');
  requireValue(
    Number(context.appliedMappingRevision?.weight) === Number(expected.appliedRevision),
    'Valve Weight applied mapping revision changed across reload',
  );
  requireValue(
    Number(context.config?.weight?.masterRevision) === Number(expected.appliedRevision),
    'config.weight.masterRevision changed across reload',
  );
  requireValue(
    context.config?.weight?.masterFingerprint === expected.masterFingerprint,
    'config.weight.masterFingerprint changed across reload',
  );
  requireValue(Number(ref.rowCount) === Number(expected.rowCount), 'Valve Weight row count changed across reload');

  const materialized = await materializeMasterDatasetRows('weight', ref);
  requireValue(
    materialized.length === Number(expected.rowCount),
    `fresh worker materialized ${materialized.length}/${expected.rowCount} Valve Weight rows`,
  );
  requireValue(JSON.stringify(materialized[0] || {}) === expected.firstRow, 'first normalized Valve Weight row changed across reload');

  const result = {
    schema: 'XMLCII_ISSUE_859_VALVE_WEIGHT_COLD_RELOAD_V1',
    ok: true,
    source: SOURCE_NAME,
    datasetId: ref.datasetId,
    datasetRevision: ref.datasetRevision,
    masterFingerprint: ref.masterFingerprint,
    appliedRevision: context.appliedMappingRevision.weight,
    configMasterRevision: context.config.weight.masterRevision,
    rowCount: ref.rowCount,
    materializedRows: materialized.length,
    persistence: ref.persistence,
    assertions: {
      activeSessionReadable: true,
      compactCustody: true,
      coldReloadRestoredIdentity: true,
      coldReloadRestoredDatasetRevision: true,
      coldReloadRestoredFingerprint: true,
      coldReloadRestoredAppliedMasterRevision: true,
      freshWorkerMaterializedPersistedRows: true,
      firstNormalizedRowStable: true,
    },
  };
  localStorage.removeItem(STAGE_KEY);
  globalThis.__XML_CII_ISSUE_859_DONE__ = true;
  globalThis.__XML_CII_ISSUE_859_RESULT__ = result;
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
}

try {
  if (localStorage.getItem(STAGE_KEY) === 'hydrate') await secondLoad();
  else await firstLoad();
} catch (error) {
  localStorage.removeItem(STAGE_KEY);
  const result = {
    schema: 'XMLCII_ISSUE_859_VALVE_WEIGHT_COLD_RELOAD_V1',
    ok: false,
    error: String(error?.stack || error),
  };
  globalThis.__XML_CII_ISSUE_859_DONE__ = true;
  globalThis.__XML_CII_ISSUE_859_RESULT__ = result;
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
}
</script>
