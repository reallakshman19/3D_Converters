<!doctype html>
<meta charset="utf-8">
<title>Issue 822 master persistence cold reload</title>
<pre id="out">RUNNING</pre>
<script type="module">
import { createMasterDatasetImportCoordinator } from '../../tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js?v=20261006-p2810042-master-persistence-1';
import { commitDatasetReadyMaster } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js?v=20261006-p2810042-master-persistence-1';
import { hydratePersistedMasterDatasets } from '../../tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js?v=20261006-p2810042-master-persistence-1';
import { materializeMasterDatasetRows } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js?v=20261006-p2810042-master-persistence-1';

const STAGE_KEY = 'xml-cii-issue-822-stage';
const EXPECTED_KEY = 'xml-cii-issue-822-expected';
const MASTER_SPECS = [
  { key: 'pipingClass', url: '../../docs/Masters/Piping_class_master.json', fileName: 'Piping_class_master.json' },
  { key: 'materialMap', url: '../../docs/Masters/PCF_MAT_MAP.TXT', fileName: 'PCF_MAT_MAP.TXT' },
  { key: 'weight', url: '../../docs/Masters/wtValveweights.json', fileName: 'wtValveweights.json' },
];

function requireValue(condition, message) {
  if (!condition) throw new Error(message);
}

function blankContext() {
  return {
    config: {},
    rawRows: {},
    mappingRows: {},
    datasetRefs: {},
    rowCounts: {},
    previewRows: {},
    sourceMetadata: {},
    appliedMappingRevision: {},
  };
}

function deleteDb(name) {
  return new Promise((resolve) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => resolve();
    request.onblocked = () => resolve();
  });
}

async function firstLoad() {
  await deleteDb('xml-cii-master-datasets-v1');
  for (const spec of MASTER_SPECS) {
    localStorage.removeItem(`xml-cii-master-source-${spec.key}`);
    localStorage.removeItem(`xml-cii-master-${spec.key}`);
  }
  localStorage.removeItem(EXPECTED_KEY);

  const coordinator = createMasterDatasetImportCoordinator();
  let context = blankContext();
  let config = {};
  const expected = {};

  try {
    for (const spec of MASTER_SPECS) {
      const response = await fetch(spec.url, { cache: 'no-store' });
      requireValue(response.ok, `${spec.key}: fixture fetch failed HTTP ${response.status}`);
      const buffer = await response.arrayBuffer();
      const ready = await coordinator.openBuffer(spec.key, buffer, spec.fileName, {
        config,
        currentMap: {},
      });
      requireValue(ready?.metadata?.datasetId, `${spec.key}: dataset id missing`);
      requireValue(ready?.metadata?.persistenceMode === 'indexeddb', `${spec.key}: worker did not persist to IndexedDB`);
      requireValue(ready?.persistence?.persisted === true, `${spec.key}: persistence receipt is not successful`);

      const committed = commitDatasetReadyMaster({
        context,
        config,
        key: spec.key,
        ready,
        sourceMetadata: {
          key: spec.key,
          source: spec.fileName,
          sourceType: 'issue-822-browser',
          status: 'loaded',
          rowCount: Number(ready.metadata.rowCount || 0),
        },
      });
      requireValue(committed.persistence.indexedDbBacked === true, `${spec.key}: commit did not retain IndexedDB custody`);
      requireValue((committed.persistence.failures || []).length === 0, `${spec.key}: local custody write failed`);
      context = committed.context;
      config = committed.config;
      expected[spec.key] = {
        datasetId: committed.datasetRef.datasetId,
        datasetRevision: committed.datasetRef.datasetRevision,
        appliedRevision: committed.revision,
        rowCount: committed.datasetRef.rowCount,
      };

      const custody = JSON.parse(localStorage.getItem(`xml-cii-master-source-${spec.key}`) || '{}');
      requireValue(custody.persistenceMode === 'indexeddb', `${spec.key}: restart custody is not indexeddb`);
      requireValue(custody.datasetId === expected[spec.key].datasetId, `${spec.key}: restart dataset id mismatch before reload`);
      requireValue(Number(custody.datasetRevision) === expected[spec.key].datasetRevision, `${spec.key}: restart dataset revision mismatch before reload`);
    }
  } finally {
    coordinator.dispose();
  }

  localStorage.setItem(EXPECTED_KEY, JSON.stringify(expected));
  localStorage.setItem(STAGE_KEY, 'hydrate');
  location.reload();
}

async function secondLoad() {
  const expected = JSON.parse(localStorage.getItem(EXPECTED_KEY) || '{}');
  const stateRef = { current: { supportConfigJson: '{}', masterContext: blankContext() } };
  const changed = await hydratePersistedMasterDatasets(stateRef);
  requireValue(changed === true, 'cold hydration reported no change');

  const observed = {};
  for (const spec of MASTER_SPECS) {
    const wanted = expected[spec.key];
    const ref = stateRef.current.masterContext.datasetRefs?.[spec.key];
    requireValue(ref, `${spec.key}: datasetRef missing after cold hydration`);
    requireValue(ref.datasetId === wanted.datasetId, `${spec.key}: dataset id changed across reload`);
    requireValue(Number(ref.datasetRevision) === Number(wanted.datasetRevision), `${spec.key}: dataset revision changed across reload`);
    requireValue(Number(stateRef.current.masterContext.appliedMappingRevision?.[spec.key]) === Number(wanted.appliedRevision), `${spec.key}: applied mapping revision changed across reload`);
    requireValue(Number(ref.rowCount) === Number(wanted.rowCount), `${spec.key}: row count changed across reload`);
    const materialized = await materializeMasterDatasetRows(spec.key, ref);
    requireValue(materialized.length === Number(wanted.rowCount), `${spec.key}: fresh worker materialized ${materialized.length}/${wanted.rowCount} rows`);
    observed[spec.key] = {
      datasetId: ref.datasetId,
      datasetRevision: ref.datasetRevision,
      appliedRevision: stateRef.current.masterContext.appliedMappingRevision[spec.key],
      rowCount: ref.rowCount,
      materializedRows: materialized.length,
      persistence: ref.persistence,
    };
  }

  localStorage.removeItem(STAGE_KEY);
  const result = {
    schema: 'XMLCII_ISSUE_822_MASTER_COLD_RELOAD_V1',
    ok: true,
    status: stateRef.current.importMastersWriteBackStatus,
    masters: observed,
    assertions: {
      threeMastersPersisted: true,
      coldReloadRestoredIdentity: true,
      coldReloadRestoredDatasetRevision: true,
      coldReloadRestoredMappingRevision: true,
      freshWorkerMaterializedPersistedRows: true,
      metadataOnlyCustody: true,
    },
  };
  globalThis.__XML_CII_ISSUE_822_DONE__ = true;
  globalThis.__XML_CII_ISSUE_822_RESULT__ = result;
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
}

try {
  if (localStorage.getItem(STAGE_KEY) === 'hydrate') await secondLoad();
  else await firstLoad();
} catch (error) {
  localStorage.removeItem(STAGE_KEY);
  const result = { schema: 'XMLCII_ISSUE_822_MASTER_COLD_RELOAD_V1', ok: false, error: String(error?.stack || error) };
  globalThis.__XML_CII_ISSUE_822_DONE__ = true;
  globalThis.__XML_CII_ISSUE_822_RESULT__ = result;
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
}
</script>
