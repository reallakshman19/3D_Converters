<!doctype html>
<meta charset="utf-8">
<title>Issue 837 Mat Map cold reload</title>
<pre id="out">RUNNING</pre>
<script type="module">
import { createMasterDatasetImportCoordinator } from '../../tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js?v=20261006-c05-3-mat-1';
import { commitDatasetReadyMaster } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js?v=20261006-c05-3-mat-1';
import { hydratePersistedMasterDatasets } from '../../tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js?v=20261006-c05-3-mat-1';
import { materializeMasterDatasetRows } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js?v=20261006-c05-3-mat-1';

const STAGE_KEY = 'xml-cii-issue-837-stage';
const EXPECTED_KEY = 'xml-cii-issue-837-expected';
const SOURCE_URL = '../../docs/Masters/PCF_MAT_MAP.TXT';
const SOURCE_NAME = 'PCF_MAT_MAP.TXT';

function requireValue(condition, message) {
  if (!condition) throw new Error(message);
}

function blankContext() {
  return {
    config: {},
    rawRows: {},
    mappingRows: {},
    datasetRefs: {},
    rowCounts: {},
    previewRows: {},
    sourceMetadata: {},
    appliedMappingRevision: {},
  };
}

function deleteDb(name) {
  return new Promise((resolve) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => resolve();
    request.onblocked = () => resolve();
  });
}

async function firstLoad() {
  await deleteDb('xml-cii-master-datasets-v1');
  for (const suffix of [
    'xml-cii-master-source-materialMap',
    'xml-cii-master-materialMap',
    'xml-cii-master-raw-materialMap',
    'xml-cii-master-workbook-materialMap',
  ]) localStorage.removeItem(suffix);
  localStorage.removeItem(EXPECTED_KEY);

  const coordinator = createMasterDatasetImportCoordinator();
  try {
    const response = await fetch(SOURCE_URL, { cache: 'no-store' });
    requireValue(response.ok, `Mat_Map fixture fetch failed HTTP ${response.status}`);
    const buffer = await response.arrayBuffer();
    const ready = await coordinator.openBuffer('materialMap', buffer, SOURCE_NAME, {
      config: {},
      currentMap: {},
    });

    requireValue(ready?.metadata?.datasetId, 'Mat_Map dataset id missing');
    requireValue(Number(ready?.metadata?.datasetRevision) > 0, 'worker datasetRevision missing');
    requireValue(Number(ready?.metadata?.rowCount) > 0, 'Mat_Map dataset is empty');

    const liveRows = await coordinator.getRows('materialMap', 0, Math.min(3, ready.metadata.rowCount));
    requireValue((liveRows?.rows || []).length > 0, 'active-session Mat_Map rows are not readable');

    const committed = commitDatasetReadyMaster({
      context: blankContext(),
      config: {},
      key: 'materialMap',
      ready,
      sourceMetadata: {
        key: 'materialMap',
        source: SOURCE_NAME,
        sourceType: 'issue-837-browser',
        status: 'loaded',
        rowCount: Number(ready.metadata.rowCount || 0),
      },
    });

    requireValue(
      Number(committed.datasetRef?.datasetRevision) === Number(ready.metadata.datasetRevision),
      'runtime datasetRef lost Mat_Map datasetRevision',
    );
    const custody = JSON.parse(localStorage.getItem('xml-cii-master-source-materialMap') || '{}');
    requireValue(custody.persistenceMode === 'indexeddb', 'Mat_Map restart custody is not indexeddb');
    requireValue(custody.datasetId === committed.datasetRef.datasetId, 'Mat_Map restart dataset id mismatch');
    requireValue(
      Number(custody.datasetRevision) === Number(ready.metadata.datasetRevision),
      'Mat_Map restart custody lost datasetRevision',
    );
    requireValue(localStorage.getItem('xml-cii-master-materialMap') == null, 'normalized map rows duplicated into localStorage');
    requireValue(localStorage.getItem('xml-cii-master-raw-materialMap') == null, 'raw map rows duplicated into localStorage');

    localStorage.setItem(EXPECTED_KEY, JSON.stringify({
      datasetId: committed.datasetRef.datasetId,
      datasetRevision: committed.datasetRef.datasetRevision,
      appliedRevision: committed.revision,
      rowCount: committed.datasetRef.rowCount,
      firstRow: JSON.stringify((liveRows?.rows || [])[0] || {}),
    }));
    localStorage.setItem(STAGE_KEY, 'hydrate');
    location.reload();
  } finally {
    coordinator.dispose();
  }
}

async function secondLoad() {
  const expected = JSON.parse(localStorage.getItem(EXPECTED_KEY) || '{}');
  requireValue(expected.datasetId, 'expected first-load Mat_Map custody missing');
  const stateRef = { current: { supportConfigJson: '{}', masterContext: blankContext() } };
  const changed = await hydratePersistedMasterDatasets(stateRef);
  requireValue(changed === true, 'Mat_Map cold hydration reported no change');

  const ref = stateRef.current.masterContext.datasetRefs?.materialMap;
  requireValue(ref, 'Mat_Map datasetRef missing after cold hydration');
  requireValue(ref.datasetId === expected.datasetId, 'Mat_Map dataset id changed across reload');
  requireValue(Number(ref.datasetRevision) === Number(expected.datasetRevision), 'Mat_Map dataset revision changed across reload');
  requireValue(
    Number(stateRef.current.masterContext.appliedMappingRevision?.materialMap) === Number(expected.appliedRevision),
    'Mat_Map applied mapping revision changed across reload',
  );
  requireValue(Number(ref.rowCount) === Number(expected.rowCount), 'Mat_Map row count changed across reload');

  const materialized = await materializeMasterDatasetRows('materialMap', ref);
  requireValue(materialized.length === Number(expected.rowCount), `fresh worker materialized ${materialized.length}/${expected.rowCount} Mat_Map rows`);
  requireValue(JSON.stringify(materialized[0] || {}) === expected.firstRow, 'first parsed Mat_Map row changed across reload');

  const result = {
    schema: 'XMLCII_ISSUE_837_MAT_MAP_COLD_RELOAD_V1',
    ok: true,
    source: SOURCE_NAME,
    datasetId: ref.datasetId,
    datasetRevision: ref.datasetRevision,
    appliedRevision: stateRef.current.masterContext.appliedMappingRevision.materialMap,
    rowCount: ref.rowCount,
    materializedRows: materialized.length,
    persistence: ref.persistence,
    assertions: {
      activeSessionReadable: true,
      parsedRepresentationStable: true,
      compactCustody: true,
      coldReloadRestoredIdentity: true,
      coldReloadRestoredDatasetRevision: true,
      coldReloadRestoredMappingRevision: true,
      freshWorkerMaterializedPersistedRows: true,
    },
  };
  localStorage.removeItem(STAGE_KEY);
  globalThis.__XML_CII_ISSUE_837_DONE__ = true;
  globalThis.__XML_CII_ISSUE_837_RESULT__ = result;
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
}

try {
  if (localStorage.getItem(STAGE_KEY) === 'hydrate') await secondLoad();
  else await firstLoad();
} catch (error) {
  localStorage.removeItem(STAGE_KEY);
  const result = {
    schema: 'XMLCII_ISSUE_837_MAT_MAP_COLD_RELOAD_V1',
    ok: false,
    error: String(error?.stack || error),
  };
  globalThis.__XML_CII_ISSUE_837_DONE__ = true;
  globalThis.__XML_CII_ISSUE_837_RESULT__ = result;
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
}
</script>
