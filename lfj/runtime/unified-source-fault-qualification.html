<!doctype html><meta charset="utf-8">
<title>LFJ W2 unified source native IndexedDB atomic HEAD fault matrix</title>
<script type="module">
import {openUnifiedIndexedSourceStore}
  from './unified-indexed-source-store.mjs';
window.runUnifiedFaultMatrix=async()=>{
  const prefix='lfj-w2-fault-'+crypto.randomUUID(),namespace='source';
  const basis={sourceRefId:'FAULT-SOURCE',sourceSha256:'a'.repeat(64),
    sourceRevision:'FAULT-REVISION'};
  const occurrenceId=JSON.stringify(['lfj-json-value/v1',basis.sourceRefId,
    basis.sourceRevision,'']);
  const open={schema:'LFJ.JSON.OccurrenceEvent.v1',...basis,
    kind:'OPEN',occurrenceId,ordinal:0,path:'',
    parentId:null,type:'string',startByte:0};
  const seal={schema:'LFJ.JSON.OccurrenceEvent.v1',...basis,
    kind:'SEAL',occurrenceId,ordinal:0,endByteExclusive:4};
  const manifest={schema:'LFJ.JSON.OccurrenceIndexSummary.v1',
    ...basis,complete:true,occurrenceCount:1,eventCount:2,byteLength:4,
    rightsBasis:'SOURCE_FACTS_ONLY',engineeringReady:false};
  const outcomes={};
  async function make(name,options={}){
    const databaseName=prefix+'-'+name,generation='g';
    const port=await openUnifiedIndexedSourceStore({
      databaseName,namespace,generation,basis,...options});
    return {databaseName,generation,port};
  }
  async function lookup(c){
    try{await c.port.lookupCommittedPair(occurrenceId);return 'UNEXPECTED_COMMITTED';}
    catch(e){return e?.code;}
  }
  async function cleanup(c){
    try{c.port.close();}catch{}
    indexedDB.deleteDatabase(c.databaseName);
  }
  const missing=await make('missing-seal');
  try{
    await missing.port.stagePage([open]);
    try{await missing.port.commitDurably(manifest);
      outcomes.missingSeal='UNEXPECTED_COMMITTED';
    }catch(e){outcomes.missingSeal=e?.code;}
    outcomes.missingSealInvisible=await lookup(missing);
  }finally{await cleanup(missing);}

  const wrong=await make('mismatch');
  try{
    await wrong.port.stagePage([open,{...seal,occurrenceId:occurrenceId+'-mismatch'}]);
    try{await wrong.port.commitDurably(manifest);
      outcomes.wrongSeal='UNEXPECTED_COMMITTED';
    }catch(e){outcomes.wrongSeal=e?.code;}
    outcomes.wrongSealInvisible=await lookup(wrong);
  }finally{await cleanup(wrong);}

  let called=false;
  const interrupted=await make('head-aborted',{
    beforeHeadCommit:tx=>{called=true;tx.abort();}
  });
  try{
    await interrupted.port.stagePage([open,seal]);
    try{await interrupted.port.commitDurably(manifest);
      outcomes.headAborted='UNEXPECTED_COMMITTED';
    }catch(e){outcomes.headAborted=e?.code;}
    outcomes.headAbortInjected=called;
    outcomes.headAbortedInvisible=await lookup(interrupted);
  }finally{await cleanup(interrupted);}

  // Two generations sampled the same absent HEAD. Exactly one CAS may
  // publish; the losing writer must not revoke the winning generation.
  const casName=prefix+'-head-cas',winner=await openUnifiedIndexedSourceStore({
    databaseName:casName,namespace,generation:'winner',basis});
  const loser=await openUnifiedIndexedSourceStore({
    databaseName:casName,namespace,generation:'loser',basis});
  try{
    await winner.stagePage([open,seal]);
    try{await loser.stagePage([open,seal]);
      outcomes.casLoser='UNEXPECTED_STAGED';
    }catch(e){outcomes.casLoser=e?.code;}
    try{await winner.lookupCommittedPair(occurrenceId);
      outcomes.preCommitVisible='UNEXPECTED_ACCEPTED';
    }catch(e){outcomes.preCommitVisible=e?.code;}
    await winner.commitDurably(manifest);
    const unaffected=await winner.lookupCommittedPair(occurrenceId);
    outcomes.casWinnerRetained=unaffected.seal.endByteExclusive===4;
  }finally{
    try{winner.close();loser.close();}catch{}
    indexedDB.deleteDatabase(casName);
  }

  // Worker ACK is provisional custody transfer. A caller may modify its
  // own JS objects AFTER await stagePage; no accepted original fact may drift.
  const mutable=await make('mutable-after-ack');
  try{
    const callerOpen={...open},callerSeal={...seal};
    await mutable.port.stagePage([callerOpen,callerSeal]);
    callerOpen.path='/invented';callerOpen.startByte=99;
    callerSeal.endByteExclusive=0;
    await mutable.port.commitDurably(manifest);
    const unchanged=await mutable.port.lookupCommittedPair(occurrenceId);
    outcomes.mutableInputIsolated=unchanged.open.path===''&&
      unchanged.open.startByte===0&&unchanged.seal.endByteExclusive===4;
  }catch(e){outcomes.mutableInputIsolated=e?.code||'UNKNOWN_FAILED';}
  finally{await cleanup(mutable);}

  // Close during a HEAD put must abort the same still-open transaction,
  // rather than resolve a rejected promise while publishing a durable HEAD.
  let midCommit;
  midCommit=await make('close-during-commit',{
    beforeHeadCommit:()=>midCommit.port.close()
  });
  try{
    await midCommit.port.stagePage([open,seal]);
    try{await midCommit.port.commitDurably(manifest);
      outcomes.closeWhileCommitting='UNEXPECTED_COMMITTED';
    }catch(e){outcomes.closeWhileCommitting=e?.code;}
    const reopened=await openUnifiedIndexedSourceStore({
      databaseName:midCommit.databaseName,namespace,
      generation:midCommit.generation,basis
    });
    try{
      outcomes.closeDuringCommitVisible=await lookup({...midCommit,port:reopened});
    }finally{reopened.close();}
  }finally{await cleanup(midCommit);}

  // A prefetched 64-row ordered cursor must not leak its second record
  // after the original source HEAD has been revoked between iterator.next().
  const refTwo=JSON.stringify(['lfj-json-value/v1',basis.sourceRefId,
    basis.sourceRevision,'/child']);
  const childOpen={...open,occurrenceId:refTwo,ordinal:1,path:'/child',
    parentId:occurrenceId,startByte:1};
  const childSeal={...seal,occurrenceId:refTwo,ordinal:1,endByteExclusive:3};
  const twoManifest={...manifest,occurrenceCount:2,eventCount:4};
  const revoked=await make('revoke-mid-ordered-chunk');
  try{
    await revoked.port.stagePage([open,childOpen,childSeal,seal]);
    await revoked.port.commitDurably(twoManifest);
    const iterator=revoked.port.readOrdered()[Symbol.asyncIterator]();
    const first=await iterator.next();
    outcomes.firstRowCorrect=first.done===false&&
      first.value.occurrenceId===occurrenceId;
    await revoked.port.abort();
    try{await iterator.next();
      outcomes.postAbortPrefetch='UNEXPECTED_ACCEPTED';
    }catch(e){outcomes.postAbortPrefetch=e?.code;}
  }finally{await cleanup(revoked);}

  // Source identity includes exact ancestral original JSON path, not just
  // occurrence ID. A foreign parent must not be committed or value-readable.
  const ancestry=await make('wrong-parent');
  try{
    await ancestry.port.stagePage([open,
      {...childOpen,parentId:'forged-ancestor'},childSeal,seal]);
    try{await ancestry.port.commitDurably(twoManifest);
      outcomes.wrongParent='UNEXPECTED_COMMITTED';
    }catch(e){outcomes.wrongParent=e?.code;}
    outcomes.wrongParentInvisible=await lookup(ancestry);
  }finally{await cleanup(ancestry);}

  // R05 SEAL's ownAttributes attaches source-owned attributes to the exact
  // original parent. It must not be silently reinterpreted in a compact row.
  const attr=await make('own-attributes');
  const attrOpen={...childOpen,path:'/attributes',
    occurrenceId:JSON.stringify(['lfj-json-value/v1',basis.sourceRefId,
      basis.sourceRevision,'/attributes']),type:'object'};
  const attrSeal={...childSeal,occurrenceId:attrOpen.occurrenceId,
    ownAttributes:{ownerOccurrenceId:occurrenceId,
      startByte:attrOpen.startByte,endByteExclusive:childSeal.endByteExclusive}};
  try{
    await attr.port.stagePage([open,attrOpen,attrSeal,seal]);
    await attr.port.commitDurably(twoManifest);
    const valid=await attr.port.lookupCommittedPair(attrOpen.occurrenceId);
    outcomes.ownAttributesRoundTrip=
      valid.seal.ownAttributes?.ownerOccurrenceId===occurrenceId;
    attr.port.close();
    const txdb=await new Promise((resolve,reject)=>{
      const req=indexedDB.open(attr.databaseName);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    try{
      await new Promise((resolve,reject)=>{
        const tx=txdb.transaction('pairs','readwrite');
        const store=tx.objectStore('pairs');
        const req=store.get([namespace,attr.generation,attrOpen.occurrenceId]);
        req.onsuccess=()=>store.put({...req.result,ownAttributes:{
          ...req.result.ownAttributes,startByte:0}});
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
        tx.onabort=()=>reject(new Error('attribute-poison transaction aborted'));
      });
    }finally{txdb.close();}
    const poisoned=await openUnifiedIndexedSourceStore({
      databaseName:attr.databaseName,namespace,generation:attr.generation,basis
    });
    try{outcomes.ownAttributesCorruption=await lookup({...attr,
      port:{lookupCommittedPair:id=>poisoned.lookupCommittedPair(attrOpen.occurrenceId)}});
    }finally{poisoned.close();}
  }finally{await cleanup(attr);}

  // A valid R10 message may exceed the *native transaction* limit while
  // remaining below its own 4096-event/1MiB wire cap. Prove the source port
  // splits 1042 authentic-shaped original events without weakening the
  // complete-generation manifest or leaking a precommit HEAD.
  const wide=await make('over-1024-event-message');
  try{
    const count=520,events=[open];
    for(let i=0;i<count;i++){
      const path='/'+i,id=JSON.stringify(['lfj-json-value/v1',
        basis.sourceRefId,basis.sourceRevision,path]);
      events.push({...open,occurrenceId:id,ordinal:i+1,path,
        parentId:occurrenceId,startByte:i*2+1});
      events.push({...seal,occurrenceId:id,ordinal:i+1,
        endByteExclusive:i*2+2});
    }
    events.push({...seal,endByteExclusive:count*2+2});
    await wide.port.stagePage(events);
    outcomes.widePrecommit=await lookup(wide);
    await wide.port.commitDurably({...manifest,
      occurrenceCount:count+1,eventCount:events.length,
      byteLength:count*2+2});
    let rows=0;
    for await(const record of wide.port.readOrdered()){
      if(record.ordinal!==rows++)throw Error('UNIFIED_WIDE_ORDER');
    }
    outcomes.wideOriginalCensus=rows;
    outcomes.wideLastValue=(await wide.port.lookupCommittedPair(
      JSON.stringify(['lfj-json-value/v1',basis.sourceRefId,
        basis.sourceRevision,'/'+(count-1)]))).seal.endByteExclusive;
  }finally{await cleanup(wide);}

  // W2 COLD-RECOVERY RED: staging ACKs persisted more than 1024 event
  // facts, then its owner tab disappeared without invoking async abort.
  // A later valid successor must not retain unbounded orphan rows forever.
  // This currently FAILS: no generation lease and no bounded cold cleanup.
  let recoveryClock=10000;
  const abandoned=await make('abandoned-staged-source',{
    now:()=>recoveryClock,leaseTtlMs:1000});
  const orphanRoot={...open,endByteExclusive:undefined};
  const orphanRows=[open];
  for(let i=1;i<=520;i++){
    const path='/'+i,oid=JSON.stringify(['lfj-json-value/v1',
      basis.sourceRefId,basis.sourceRevision,path]);
    orphanRows.push({...open,occurrenceId:oid,ordinal:i,path,
      parentId:occurrenceId,startByte:i*2+1});
    orphanRows.push({...seal,occurrenceId:oid,ordinal:i,
      endByteExclusive:i*2+2});
  }
  orphanRows.push({...seal,endByteExclusive:1100});
  await abandoned.port.stagePage(orphanRows);
  abandoned.port.close(); // tab death: no awaitable abort/rollback
  recoveryClock+=2000; // deterministic recovery after expired source lease
  const successor=await openUnifiedIndexedSourceStore({
    databaseName:abandoned.databaseName,namespace,
    generation:'successor',basis,now:()=>recoveryClock,leaseTtlMs:1000
  });
  try{
    await successor.stagePage([open,seal]);
    await successor.commitDurably(manifest);
    const db=await new Promise((resolve,reject)=>{
      const request=indexedDB.open(abandoned.databaseName);
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
    try{
      outcomes.abandonedStagedRows=await new Promise((resolve,reject)=>{
        const tx=db.transaction('pairs','readonly');
        const request=tx.objectStore('pairs').count(
          IDBKeyRange.bound([namespace,abandoned.generation,''],
            [namespace,abandoned.generation,'\uffff']));
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
      outcomes.successorExact=(await successor.lookupCommittedPair(
        occurrenceId)).seal.endByteExclusive===4;
    }finally{db.close();}
  }finally{
    successor.close();indexedDB.deleteDatabase(abandoned.databaseName);
  }

  // Inject a recovery transaction failure after old staged facts exist.
  // The IDB rollback must retain its recovery marker, so the *next* fresh
  // writer resumes from the same original ordered generation frontier.
  let retryClock=40000,interrupt=true;
  const interruptedOld=await make('reclaim-resume',{
    now:()=>retryClock,leaseTtlMs:1000});
  await interruptedOld.port.stagePage(orphanRows);
  interruptedOld.port.close();retryClock+=2000;
  const rejected=await openUnifiedIndexedSourceStore({
    databaseName:interruptedOld.databaseName,namespace,
    generation:'retry-first',basis,now:()=>retryClock,leaseTtlMs:1000,
    beforeReclaim:({tx})=>{
      if(interrupt){interrupt=false;tx.abort();}
    }
  });
  try{
    try{await rejected.stagePage([open,seal]);
      outcomes.pruneTransactionFailed='UNEXPECTED_STAGED';
    }catch(e){outcomes.pruneTransactionFailed=e?.code;}
  }finally{rejected.close();}
  // The failed reclaimer's lease is still real and unexpired despite its
  // closed connection. A successor may recover only after explicit expiry.
  retryClock+=2000;
  const resumed=await openUnifiedIndexedSourceStore({
    databaseName:interruptedOld.databaseName,namespace,
    generation:'retry-second',basis,now:()=>retryClock,leaseTtlMs:1000
  });
  try{
    await resumed.stagePage([open,seal]);
    await resumed.commitDurably(manifest);
    const db=await new Promise((resolve,reject)=>{
      const req=indexedDB.open(interruptedOld.databaseName);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    try{
      outcomes.pruneResumedLeftovers=await new Promise((resolve,reject)=>{
        const req=db.transaction('pairs','readonly').objectStore('pairs').count(
          IDBKeyRange.bound([namespace,interruptedOld.generation,''],
            [namespace,interruptedOld.generation,'\uffff']));
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
    }finally{db.close();}
  }finally{
    resumed.close();indexedDB.deleteDatabase(interruptedOld.databaseName);
  }

  // Three committed generations: a prior published HEAD must remain
  // intact until its successor publishes, then become a durable bounded
  // recovery target even though the prior writer released its lease.
  const historyDb=prefix+'-committed-history';
  const a=await openUnifiedIndexedSourceStore({
    databaseName:historyDb,namespace,generation:'history-A',basis});
  const b=await openUnifiedIndexedSourceStore({
    databaseName:historyDb,namespace,generation:'history-B',basis});
  try{
    await a.stagePage([open,seal]);
    await a.commitDurably(manifest);
    await b.stagePage([open,seal]);
    await b.commitDurably(manifest);
    const c=await openUnifiedIndexedSourceStore({
      databaseName:historyDb,namespace,generation:'history-C',basis});
    try{
      await c.stagePage([open,seal]); // claims lease + reclaims replaced A
      const raw=await new Promise((resolve,reject)=>{
        const request=indexedDB.open(historyDb);
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
      try{
        const countFor=gen=>new Promise((resolve,reject)=>{
          const tx=raw.transaction('pairs','readonly');
          const req=tx.objectStore('pairs').count(
            IDBKeyRange.bound([namespace,gen,''],[namespace,gen,'\uffff']));
          req.onsuccess=()=>resolve(req.result);
          req.onerror=()=>reject(req.error);
        });
        outcomes.oldCommittedReclaimed=await countFor('history-A');
        outcomes.currentCommittedRetained=await countFor('history-B');
      }finally{raw.close();}
      await c.commitDurably(manifest);
      outcomes.historyCurrent=(await c.lookupCommittedPair(occurrenceId))
        .seal.endByteExclusive===4;
      try{await a.lookupCommittedPair(occurrenceId);
        outcomes.replacedHeadInvisible='UNEXPECTED_AUTHORIZED';
      }catch(error){outcomes.replacedHeadInvisible=error?.code;}
    }finally{c.close();}
  }finally{
    a.close();b.close();indexedDB.deleteDatabase(historyDb);
  }

  const accepted=await make('durable');
  try{
    await accepted.port.stagePage([open]);
    await accepted.port.stagePage([seal]); // OPEN and SEAL across ACK pages
    await accepted.port.commitDurably(manifest);
    const original=await accepted.port.lookupCommittedPair(occurrenceId);
    outcomes.pairExact=original.open.startByte===0&&original.seal.endByteExclusive===4;
    const ordered=[];
    for await(const x of accepted.port.readOrdered())ordered.push(x.path);
    outcomes.orderedExact=JSON.stringify(ordered)===JSON.stringify(['']);
    accepted.port.close();
    const again=await openUnifiedIndexedSourceStore({
      databaseName:accepted.databaseName,namespace,
      generation:accepted.generation,basis
    });
    try{
      const value=await again.lookupCommittedPair(occurrenceId);
      outcomes.reopenExact=value.seal.endByteExclusive===4;
    }finally{again.close();}
    const direct=await new Promise((resolve,reject)=>{
      const req=indexedDB.open(accepted.databaseName);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    try{
      await new Promise((resolve,reject)=>{
        const tx=direct.transaction('pairs','readwrite');
        const store=tx.objectStore('pairs');
        const req=store.get([namespace,accepted.generation,occurrenceId]);
        req.onsuccess=()=>store.put({...req.result,endByteExclusive:0});
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
        tx.onabort=()=>reject(new Error('poison transaction aborted'));
      });
    }finally{direct.close();}
    const damaged=await openUnifiedIndexedSourceStore({
      databaseName:accepted.databaseName,namespace,
      generation:accepted.generation,basis
    });
    try{outcomes.poisonRejected=await lookup({...accepted,port:damaged});}
    finally{damaged.close();}
  }finally{await cleanup(accepted);}
  return outcomes;
};
</script>
