<!doctype html><meta charset="utf-8"><title>V4.1 STORE actual R10→R07→IndexedDB→R08/R09 Chromium composite</title>
<script type="module">
import {runCommittedSourceQuery} from '../../ports/committed-worker-query.mjs';
import {openIndexedRecordStore} from './indexed-record-store.mjs';

window.runDurableWorkerChain=async json=>{
 const bytes=new TextEncoder().encode(json),blob=new Blob([bytes],{type:'application/json'});
 const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),
   b=>b.toString(16).padStart(2,'0')).join('');
 const revision='STORE-ACTUAL-REV',sourceRefId='STORE-ACTUAL-SRC',jobId='STORE-ACTUAL-NATIVE',
   sourceRevision=revision+':sha256:'+sha,selectionDigest='only-original-branch-0';
 const sourceBasis={sourceRefId,sourceSha256:sha,sourceRevision};
 let liveBasis={...sourceBasis,byteLength:bytes.length,selectionDigest,jobId};
 const dbName='lfj-durable-composite-'+crypto.randomUUID();
 const sourceNs='original:'+sourceRefId, selectedNs='selected:'+sourceRefId;
 const indexStore=await openIndexedRecordStore({
   databaseName:dbName,namespace:sourceNs,generation:jobId,basis:sourceBasis,kind:'source'
 });
 const selectedStore=await openIndexedRecordStore({
   databaseName:dbName,namespace:selectedNs,generation:jobId,
   basis:sourceBasis,kind:'selection',selectionDigest,jobEpoch:jobId
 });
 const selectedId=JSON.stringify(['lfj-json-value/v1',sourceRefId,sourceRevision,'/0']);
 let result;
 try{
   result=await runCommittedSourceQuery({
     blob,revision,expectedSha256:sha,sourceRefId,jobId,selectionDigest,
     selection:{mode:'EXPLICIT',includes:[selectedId],excludes:[]},
     indexStore,selectedStore,trustedWorkerCtor:Worker,
     createWorker:()=>new Worker(new URL('../../ports/source-browser-worker.mjs',import.meta.url),{type:'module'}),
     getCurrentBasis:()=>liveBasis,pageEvents:2
   });
   const sourceCount=result.summary.occurrenceCount;
   const out=[],pageRows=[];
   let cursor=null;
   do{
     const page=await result.readPage({cursor,maxRows:1,maxBytes:65536});
     if(!page.complete&&typeof page.cursor!=='string')throw Error('MISSING_BOUND_CURSOR');
     if(page.rightsBasis!=='SOURCE_FACTS_ONLY'||page.engineeringReady!==false)
       throw Error('UNAUTHORIZED_ENGINEERING_RIGHTS');
     out.push(...page.rows.map(r=>r.path));
     pageRows.push(page.rows.length);
     cursor=page.cursor;
   }while(cursor!==null);
   await result.close();
   indexStore.close();selectedStore.close();
   const originalAgain=await openIndexedRecordStore({
     databaseName:dbName,namespace:sourceNs,generation:jobId,basis:sourceBasis,kind:'source'
   });
   const reopenedSourcePaths=[];
   for await(const row of originalAgain.readOrdered())reopenedSourcePaths.push(row.path);
   originalAgain.close();
   const selectedAgain=await openIndexedRecordStore({
     databaseName:dbName,namespace:selectedNs,generation:jobId,
     basis:sourceBasis,kind:'selection',selectionDigest,jobEpoch:jobId
   });
   const resumedSelected=await selectedAgain.readRange(0,200,1048576);
   selectedAgain.close();
   const wrongScope=await openIndexedRecordStore({
     databaseName:dbName,namespace:selectedNs,generation:jobId,
     basis:sourceBasis,kind:'selection',selectionDigest:'changed-scope',jobEpoch:jobId
   });
   let staleScopeCode;
   try{await wrongScope.readRange(0,1,65536);}
   catch(e){staleScopeCode=e?.code;}
   finally{wrongScope.close();}
   return {
     paths:out,pageRows,sourceCount,sha,originalBytes:result.receipt.workerConsumedBytes,
     completion:result.completion.kind,selectedCount:result.selectionSummary.selectedCount,
     reopenedSourcePaths, resumedSelectedPaths:resumedSelected.map(r=>r.path),
     persistedManifest:result.pageManifest.complete,
     staleScopeCode
   };
 }finally{
   try{await result?.close();}catch{}
   try{indexStore.close();selectedStore.close();}catch{}
   indexedDB.deleteDatabase(dbName);
 }
};
</script>
