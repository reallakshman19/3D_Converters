<!doctype html><meta charset="utf-8"><title>LFJ Agent B native Worker/IDB smoke</title><pre id="result">RUNNING</pre><script type="module">
const records=[];const check=(name,pass,extra={})=>records.push({name,status:pass?'PASS':'FAIL',...extra});
const digest=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',x))].map(v=>v.toString(16).padStart(2,'0')).join('');
const workerURL=URL.createObjectURL(new Blob([`onmessage=async(e)=>{const h=await crypto.subtle.digest('SHA-256',e.data);postMessage([...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''))}`],{type:'text/javascript'}));
const request=r=>new Promise((ok,bad)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});
let db;
try {
check('secure-context',isSecureContext,{origin:location.origin});
const a=new TextEncoder().encode('branch=1;position=2');const b=new TextEncoder().encode('branch=1;position=3');
const old=await digest(a),next=await digest(b);check('same-length-interior-edit',a.byteLength===b.byteLength&&old!==next);
const w=new Worker(workerURL);const workerResult=await Promise.race([new Promise((ok,bad)=>{w.onmessage=e=>ok(e.data);w.onerror=e=>bad(e.message);w.postMessage(a.slice().buffer)}),new Promise((_,bad)=>setTimeout(()=>bad('Worker timeout'),5000))]);w.terminate();check('native-worker-digest',old===workerResult,{digest:workerResult});
const name='lfj-agent-b-'+Date.now(),open=indexedDB.open(name,1);open.onupgradeneeded=()=>open.result.createObjectStore('pages',{keyPath:'id'});db=await request(open);
await new Promise((ok,bad)=>{const tx=db.transaction('pages','readwrite');tx.objectStore('pages').put({id:1,generation:'A',digest:old,payload:'branch=1;position=2'});tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});
const stored=await request(db.transaction('pages').objectStore('pages').get(1));check('committed-idb-page',stored.generation==='A'&&stored.digest===old);
check('stale-generation-rejection',stored.generation!=='B');
const edited=await digest(new TextEncoder().encode('branch=1;position=3'));check('corrupted-page-rejection',stored.digest!==edited);
db.close();db=null;indexedDB.deleteDatabase(name);
}catch(error){check('harness-exception',false,{message:String(error)})}finally{if(db)db.close();URL.revokeObjectURL(workerURL);const report={schema:'AGENT_B_NATIVE_SMOKE_V1',userAgent:navigator.userAgent,records,overall:records.every(x=>x.status==='PASS')?'PASS':'FAIL'};document.querySelector('#result').textContent=JSON.stringify(report,null,2);document.documentElement.dataset.completed='true'}
</script>
