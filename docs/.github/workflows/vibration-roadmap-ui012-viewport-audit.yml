name: Vibration Roadmap UI-012 Viewport Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/vibration-roadmap-ui012-viewport-audit.yml'
      - 'scripts/run-vibration-roadmap-viewport-audit.mjs'
      - 'scripts/run-vibration-roadmap-focus-appearance-audit.mjs'
      - 'tests/browser/vibration-roadmap-viewport-audit.html'
      - 'tabs/vibration-roadmap-*.js'
      - 'tabs/vibration-roadmap-panel.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser audit dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vibration-roadmap-ui012-http.log 2>&1 &
          echo $! > /tmp/vibration-roadmap-ui012-http.pid

      - name: Run UI-012 viewport audit
        run: node scripts/run-vibration-roadmap-viewport-audit.mjs

      - name: Run UI-012 focus appearance audit
        run: node scripts/run-vibration-roadmap-focus-appearance-audit.mjs

      - name: Upload UI-012 screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibration-ui-012-browser-evidence
          path: audit-output/vibration-ui-012
          if-no-files-found: error
          retention-days: 14
