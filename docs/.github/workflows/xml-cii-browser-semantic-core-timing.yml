name: XML CII Browser Semantic Core Timing
# Self-report both successful timing and infrastructure/test failure outcomes.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/xml-cii-browser-semantic-core-timing.yml'
      - 'tests/browser/xml-cii-semantic-core-timing.html'
      - 'scripts/run-xml-cii-browser-semantic-timing.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-*.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-derived-context.js'
      - 'converters/xml-cii2019-core/**'
      - 'Benchmarks/css/SYS-0010.xml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/xml-cii-browser-semantic-core-timing.yml'
      - 'tests/browser/xml-cii-semantic-core-timing.html'
      - 'scripts/run-xml-cii-browser-semantic-timing.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-*.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-derived-context.js'
      - 'converters/xml-cii2019-core/**'
      - 'Benchmarks/css/SYS-0010.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chromium-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        id: install
        continue-on-error: true
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0 > /tmp/xml-cii-perf-install.log 2>&1
          npx playwright install --with-deps chromium >> /tmp/xml-cii-perf-install.log 2>&1

      - name: Start static server
        id: server
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xml-cii-perf-http.log 2>&1 &
          echo $! > /tmp/xml-cii-perf-http.pid

      - name: Run real browser timing
        id: timing
        continue-on-error: true
        run: node scripts/run-xml-cii-browser-semantic-timing.mjs > /tmp/xml-cii-perf-run.log 2>&1

      - name: Persist timing and failure evidence on main
        if: always() && github.event_name == 'push'
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          TIMING_OUTCOME: ${{ steps.timing.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ValidationRecords
          printf '{\n  "schema": "XMLCII_BROWSER_TIMING_RUN_STATUS_V1",\n  "sourceSha": "%s",\n  "installOutcome": "%s",\n  "serverOutcome": "%s",\n  "timingOutcome": "%s"\n}\n' \
            "$SOURCE_SHA" "$INSTALL_OUTCOME" "$SERVER_OUTCOME" "$TIMING_OUTCOME" \
            > ValidationRecords/xml-cii-browser-semantic-core-timing-status.json
          cp /tmp/xml-cii-perf-install.log ValidationRecords/xml-cii-browser-semantic-core-timing-install.log 2>/dev/null || true
          cp /tmp/xml-cii-perf-http.log ValidationRecords/xml-cii-browser-semantic-core-timing-http.log 2>/dev/null || true
          cp /tmp/xml-cii-perf-run.log ValidationRecords/xml-cii-browser-semantic-core-timing-run.log 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ValidationRecords/xml-cii-browser-semantic-core-timing* || true
          git commit -m 'test(xml-cii): record Chromium semantic-core timing evidence' || exit 0
          git push origin HEAD:main

      - name: Upload timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-cii-browser-semantic-core-timing
          path: |
            ValidationRecords/xml-cii-browser-semantic-core-timing.json
            ValidationRecords/xml-cii-browser-semantic-core-timing-status.json
            ValidationRecords/xml-cii-browser-semantic-core-timing-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce browser timing success
        if: always() && steps.timing.outcome != 'success'
        run: exit 1
