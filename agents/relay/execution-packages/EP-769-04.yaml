benchmarks:
- id: BENCH-ORDER-769
  name: Real reversed-length provenance cases
  purpose: Reconstruct the reported 26.8 mm reversed segments and provide an independent expected orientation for repair validation.
  source: agents/relay/evidence/EVD-769-0002.yaml
  oracle_class: REFERENCE_DATA
  payload:
    ranges:
    - {elements: 2909-2920, reported_length_mm: 26.8, defect: reversed}
    - {elements: 2439-2450, reported_length_mm: 26.8, defect: similar-reversed}
  expected: Recovered source/component connectivity establishes the expected direction for each reported segment; proposed implementation output is not the oracle.
  tolerance: {absolute_mm: 1.0e-06}
  independence: Expected orientation must come from the recovered real source/component evidence, not from _build_edges or a proposed repair.
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  verifies: [AC-ORDER-REAL-01, AC-ORDER-REAL-02, TEST-ORDER-REAL-PY]
  stale_if:
  - Real source/provenance capture changes.
  - Any required generated label is unmatched or ambiguous.
