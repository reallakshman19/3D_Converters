inputs:
- id: INPUT-OD-AUTH
  name: Raw-versus-effective OD authority
  description: Preserve raw FLAN/VALV/RIGID endpoint OD; derive effective CII OD from the connected side. Reducers/branches
    remain size-change authorities.
  authority: 'Owner roadmap X002 and Issue #769'
  source: docs/Overall_roadmap.md X002 at main 9f0925454652cd963364c066c2bb7b8828275afd
  resolution_method: Pair same-ref FLAN/VALV/RIGID endpoints and resolve outward connected positive OD without replacing raw
    OD.
  type: geometry-authority
  units: mm
  editable: false
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  consumers:
  - STEP-OD-01
  - AC-OD-01
  - AC-OD-02
  validation:
  - 60.3/26.7 flange with outward 60.3 resolves effective 60.3 while raw 26.7 remains.
  - Unknown/unpaired components are not guessed.
  - Reducers/branches are not flattened.
  stale_if:
  - Owner supersedes X002.
  - 'PR #417 overlaps an OD write path.'
  - Main geometry authority changes.
benchmarks:
- id: BENCH-OD-769
  name: Endpoint discontinuity oracle
  purpose: Separate raw component endpoint OD from effective CII section OD.
  source: 'Owner roadmap X002 plus Issue #769 reports'
  oracle_class: REFERENCE_DATA
  payload:
    flange:
      endpoint1_od_mm: 60.3
      endpoint2_od_mm: 26.7
      connected_od_mm: 60.3
    reported:
    - - 2766
      - 2768
      - 26.7
      - 60.3
    - - 2296
      - 2298
      - 26.7
      - 60.3
    - - 1826
      - 1828
      - 26.7
      - 60.3
    - - 3556
      - 3558
      - 114.3
      - 60.3
    legacy:
    - 596→598
    - 1036→1038
    - 1476→1478
    - 1916→1918
    - 2356→2358
    - 2796→2798
  expected: Raw OD remains auditable; governed effective OD drives CII for FLAN/VALV/RIGID discontinuities; reducer/branch
    transitions remain valid.
  tolerance:
    absolute_mm: 1.0e-06
  independence: Expected values come from Owner/roadmap source evidence, not the resolver.
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  verifies:
  - AC-OD-01
  - AC-OD-02
  - TEST-OD-JS
  - TEST-OD-PY
  stale_if:
  - Owner supplies superseding source evidence.
