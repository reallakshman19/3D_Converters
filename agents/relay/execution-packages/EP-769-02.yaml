outcome:
  user_visible:
  - Correct reported CII OD mismatches without overwriting raw endpoint OD.
  engineering:
  - Resolve additive EffectiveOutsideDiameter for paired FLAN/VALV/RIGID endpoints from governed connected-side geometry and
    make CII prefer it.
context_capsule:
  product_goal: 'Close the OD-authority subset of Issue #769 without entering PR #417 coordinate/topology custody.'
  roadmap_position: WP-769-GEOMETRY is the serial frontier after CP-769-01.
  why_this_work_exists: Raw component endpoint OD can differ from the effective pipe-section OD required by CII.
  current_architecture: Browser enrichment calls outside-diameter-resolver.js before Python conversion; the resolver only
    fills missing raw OD and Python currently consumes raw OutsideDiameter.
  prior_owner_decisions:
  - ODR-769-0001
  - ODR-769-0002
  - ODR-769-0003
  current_implementation_state: FBLI is checkpointed; geometry production code is unchanged from main.
  known_problems:
  - FLAN endpoint pattern 60.3/26.7 can yield wrong CII 26.7.
  - Reported 3556→3558 is 114.3 but should be 60.3.
  deliberate_non_goals:
  - 'No PR #417 files.'
  - No reversed-length/orientation fix in this EP.
  - No bore-unit, support, weight, mapping, regex, B31.3 or master-import changes.
  terminology:
    sourceOutsideDiameter: raw XML OD
    effectiveOutsideDiameter: governed engineering OD
    componentSibling: paired endpoint with same ComponentRefNo
