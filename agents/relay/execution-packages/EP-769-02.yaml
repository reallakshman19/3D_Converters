inputs:
- id: INPUT-OD-AUTH
  name: Raw-versus-effective OD authority
  description: For paired FLAN/VALV/RIGID endpoint discontinuities, preserve raw endpoint OutsideDiameter but derive engineering effective OD from the connected side; reducers/branches remain legitimate size-change authorities.
  authority: Owner roadmap X002 and Issue #769 reported OD defects
  source: docs/Overall_roadmap.md X002 at main 9f0925454652cd963364c066c2bb7b8828275afd plus Issue #769
  resolution_method: Use component ref/endpoint pairing and outward connected positive OD; do not overwrite raw OutsideDiameter.
  type: geometry-authority
  units: mm
  editable: false
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  consumers: [STEP-OD-01, AC-OD-01, AC-OD-02]
  validation:
  - FLAN endpoint1=60.3 and endpoint2=26.7 with outward connected OD=60.3 resolves EffectiveOutsideDiameter=60.3 on the 26.7 endpoint while retaining raw 26.7.
  - Unknown/unpaired components do not gain invented effective OD.
  - A legitimate connected size transition remains capable of producing a different effective OD.
  stale_if:
  - Owner supersedes X002 authority.
  - PR #417 begins changing the OD write paths.
  - Main geometry authority changes before write.
benchmarks:
- id: BENCH-OD-769
  name: Issue 769 endpoint OD discontinuity oracle
  purpose: Prove raw component endpoint OD is distinct from effective CII section OD.
  source: docs/Overall_roadmap.md X002 and Issue #769 node reports
  oracle_class: REFERENCE_DATA
  payload:
    flange_pattern:
      component_type: FLAN
      endpoint1_od_mm: 60.3
      endpoint2_od_mm: 26.7
      connected_effective_od_mm: 60.3
    reported_pairs:
    - {from: 2766, to: 2768, observed_od_mm: 26.7, expected_od_mm: 60.3}
    - {from: 2296, to: 2298, observed_od_mm: 26.7, expected_od_mm: 60.3}
    - {from: 1826, to: 1828, observed_od_mm: 26.7, expected_od_mm: 60.3}
    - {from: 3556, to: 3558, observed_od_mm: 114.3, expected_od_mm: 60.3}
    legacy_x002_pairs: [596→598, 1036→1038, 1476→1478, 1916→1918, 2356→2358, 2796→2798]
  expected: Raw endpoint values remain inspectable; effective connected OD drives CII output for non-size-changing FLAN/VALV/RIGID discontinuities. Legitimate reducer/branch transitions are not flattened.
  tolerance: {absolute_mm: 1.0e-06}
  independence: Expected 60.3 values come from Owner/roadmap source evidence, not from the new resolver.
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  verifies: [AC-OD-01, AC-OD-02, TEST-OD-JS, TEST-OD-PY]
  stale_if: [Owner supplies superseding source evidence.]
