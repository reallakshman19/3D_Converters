outcome:
  user_visible:
  - Correct CII outside diameter for flange/valve/rigid endpoint discontinuities such as reported 26.7→60.3 and 114.3→60.3 cases without overwriting raw source OD.
  engineering:
  - Separate raw endpoint OutsideDiameter from EffectiveOutsideDiameter, resolve effective OD from the connected side of paired FLAN/VALV/RIGID component endpoints, and make the Python CII model prefer the qualified effective value.
context_capsule:
  product_goal: Close the OD-authority subset of Issue #769 without entering PR #417 coordinate/topology custody.
  roadmap_position: WP-769-GEOMETRY is the single serial frontier after CP-769-01.
  why_this_work_exists: The CII writer helper uses edge.from_node OutsideDiameter by default, while the source contains legitimate component endpoint ODs that are not the effective pipe-section OD. The owner roadmap explicitly requires raw and effective OD to remain separate.
  current_architecture: Browser enrichment runs staged geometry then outside-diameter resolution before Python conversion. The existing resolver only fills zero/missing raw OutsideDiameter values. The base Python XmlNode stores only OutsideDiameter and _element_outside_diameter consumes it.
  prior_owner_decisions: [ODR-769-0001, ODR-769-0002, ODR-769-0003]
  current_implementation_state: FBLI slice is checkpointed with TEST-FBLI/TEST-LEGACY deferred. Geometry code is unchanged from main on this branch.
  known_problems:
  - FLAN endpoint pattern can carry raw endpoint1 OD 60.3 mm and endpoint2 OD 26.7 mm even when the following effective CII pipe section is 60.3 mm.
  - Current outside-diameter resolver does not emit EffectiveOutsideDiameter.
  - Python conversion does not consume EffectiveOutsideDiameter.
  - Reported node pairs include 2766→2768, 2296→2298, 1826→1828 and 3556→3558 OD mismatches.
  deliberate_non_goals:
  - No Position/origin/topology changes owned by PR #417.
  - No element orientation or reversed-length repair in this EP.
  - No bore-unit/NPS mapping change in this first geometry slice.
  - No support, weight, line-list, regex, B31.3, or large-master changes.
  terminology:
    sourceOutsideDiameter: Raw XML OutsideDiameter retained as source evidence.
    effectiveOutsideDiameter: Governed pipe-section OD used for engineering/CII output when explicitly resolved.
    component sibling: The other endpoint node with the same nonblank ComponentRefNo for a paired FLAN/VALV/RIGID component.
