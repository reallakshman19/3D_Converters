  - Join source records only on exact stable fields; unmatched records remain explicitly unmatched.
  - Do not infer expected topology or orientation from generated node numbers.
  stale_if:
  - The enrichment renumber owner changes.
  - Source identity fields are transformed before the diagnostic boundary.
benchmarks:
- id: BENCH-PROV-769
  name: Synthetic generated-label/source-record mapping
  purpose: Prove exact generated-label filtering and source join independently of the reported unresolved topology oracle.
  source: Hand-constructed XML pair exercising generated labels 2909-2920 between source records carrying negative node numbers.
  oracle_class: MANUAL_RECONSTRUCTION
  payload:
    generated_range: [2909, 2920]
    source_node_number: -1
    join_fields: [branch_name, component_ref_no, endpoint, component_type, position]
  expected: Each generated label maps to the exact matching source record and source branch index; no XML is modified.
  tolerance: {position_numeric_absolute: 1.0e-09}
  independence: Expected source identities are declared in the fixture before invoking the extractor and do not depend on the implementation output.
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  verifies: [AC-PROV-01, AC-PROV-02, TEST-PROV-PY]
  stale_if: [The diagnostic join contract changes.]
