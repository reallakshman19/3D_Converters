  name: Generated-node provenance authority
  description: Source identity is bound by branch name plus component reference, endpoint, component type and numeric position; source order is recorded as branch-node index. No fuzzy topology inference is permitted.
  authority: Repository XML schema/content plus existing enrichment renumber implementation and Owner ODR-769-0007.
  source: enrichment-run-parity.js; canonical GLRD XML; Issue #769 reported generated ranges.
  type: diagnostic-provenance
  units: none
  editable: false
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  consumers: [STEP-PROV-01, AC-PROV-01, AC-PROV-02]
  validation:
