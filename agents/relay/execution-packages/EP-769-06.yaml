- {id: TEST-SUPPORT-SCOPE, class: MUST_PASS, method: 'Git changed-path comparison from 069f7015 branch point; require allowed-path-only intersection, zero PR 417 path intersection, and durable backup receipts for every existing JS edit.', proves: [AC-SUPPORT-REPAIR-SCOPE]}
failure_and_stop_conditions:
  hard_stop_categories: [OWNER_DECISION_REQUIRED, ESSENTIAL_INPUT_MISSING, AUTHORITY_VIOLATION, PROTECTED_INVARIANT_FAILURE, WRITE_COLLISION, SUPERSEDED_EP, ROADMAP_CONFLICT, REPOSITORY_STATE_CONFLICT, UNSAFE_ENGINEERING_RESULT]
report_contract:
  sections: [Executive state, Overall / phase / EP progress, Work completed, Files changed, Acceptance matrix, Tests and evidence, Quality findings, Known limitations, Owner decisions required, GitHub issue changes, Roadmap changes, Exact next actions, Successor EP, Qualification Q1-Q5 when applicable]
  payloads:
  - {id: RPT-STATE, section: Executive state, sources: [REPO_STATE], required_fields: [relay_state, current_position, execution_state, material_authority, stop]}
  - {id: RPT-PROGRESS, section: Overall / phase / EP progress, sources: [PROGRESS, OVERALL_ROADMAP, EP], required_fields: [progress_basis, overall, phase, work_package, step, acceptance]}
  - {id: RPT-WORK, section: Work completed, sources: [EP, CP], required_fields: [completed_steps, implementation_result]}
  - {id: RPT-FILES, section: Files changed, sources: [CP], required_fields: [files_changed]}
  - {id: RPT-AC, section: Acceptance matrix, sources: [EP, PROGRESS, CP], required_fields: [criterion, status, percent, basis]}
  - {id: RPT-EVIDENCE, section: Tests and evidence, sources: [EP, CP, REPO_STATE], required_fields: [validation_id, obligation_class, status, basis_ref, not_run_reason]}
  - {id: RPT-QUALITY, section: Quality findings, sources: [EP, QRV, CP, REPO_STATE], required_fields: [quality_review, procedures, findings, disposition, execution_effect]}
  - {id: RPT-LIMITS, section: Known limitations, sources: [EP, CP, REPO_STATE], required_fields: [limitations, evidence_gaps, deferred_items]}
  - {id: RPT-OWNER, section: Owner decisions required, sources: [ODR, REPO_STATE], required_fields: [decision_required, pending_items, authority_effect]}
  - {id: RPT-ISSUES, section: GitHub issue changes, sources: [ISSUE_GRAPH, REPO_STATE], required_fields: [operations, relationships, projection_state]}
  - {id: RPT-ROADMAP, section: Roadmap changes, sources: [OVERALL_ROADMAP, ROADMAP_REVISION, PROGRESS], required_fields: [revision, topology_or_status_change, frontier_after, progress_basis_effect]}
  - {id: RPT-NEXT, section: Exact next actions, sources: [EP], required_fields: [ordered_actions, targets, inputs, tests, benchmarks, acceptance, expected_result, stop_conditions]}
  - {id: RPT-SUCCESSOR, section: Successor EP, sources: [CP, OVERALL_ROADMAP, REPO_STATE], required_fields: [successor_mode, next_frontier, ep_or_terminal_disposition]}
checkpoint_contract:
  required: true
  acceptance: [AC-SUPPORT-REPAIR-01, AC-SUPPORT-REPAIR-02, AC-SUPPORT-REPAIR-03, AC-SUPPORT-REPAIR-SCOPE]
  validation: [TEST-SUPPORT-REAL, TEST-SUPPORT-NEGATIVE, TEST-SUPPORT-REGRESSION, TEST-SUPPORT-SCOPE]
  carry_forward:
  - Full post-material v2.5 release/conformance suite remains WP-769-RELEASE after support checkpoint.
successor_relay:
  required: true
  duties:
  - Preserve source-semantic authority and negative-control outcomes.
  - Create checkpoint with exact material head and quality review.
  - Update progress and issue projection.
  - Compute next frontier, expected WP-769-RELEASE only after support acceptance passes.
  required_outputs: [checkpoint, progress_reconciliation, issue_projection_disposition, next_frontier, successor_ep_or_terminal_disposition]
