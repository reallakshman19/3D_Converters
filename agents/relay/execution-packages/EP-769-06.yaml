outcome:
  user_visible:
  - XML→CII 2019 Standalone restores the missing REST restraint for reported PS00608.1 / XML node 3140 from authoritative staged support identity and attachment evidence.
  engineering:
  - Support association uses one shared source-semantic authority: exact normalized identity plus unique compatible explicit relationship evidence; ambiguity and relationship conflict fail closed and coordinates never override them.
  - Working PS00573.1 remains resolved, PS00572.1 remains unclaimed without evidence, and no PS-prefix-to-REST or tag-specific exception is introduced.
context_capsule:
  product_goal: Close Issue 769 support fallback with a source-semantic repair rather than a tag or coordinate heuristic.
  roadmap_position: OBJ-769 / PHASE-769-POSTMERGE / WP-769-SUPPORT after CP-769-05.
  why_this_work_exists: EVD-769-0005 proves PS00608.1 is explicit REST and explicitly attached to the XML branch containing node 3140, but the standalone ledger rejects it because fallback uses staged container-branch compatibility and ignores that explicit attachment.
  current_architecture: The standalone trace ledger owns position groups and legacy PS fallback; shared source-schema adapters expose COMPRE and ATTACHED_COMPONENT_REF relationship evidence, and the shared DTXR resolver can index exact support identities when an explicit sourceSchema profile is enabled.
  prior_owner_decisions: [ODR-769-0003, ODR-769-0005, ODR-769-0006, ODR-769-0007, ODR-769-0008, ODR-769-0009]
  current_implementation_state: CP-769-05 closed read-only support provenance. No production support file has changed since geometry material head aa5659f334f780c1a0ecd381872ee64a2e5ac60e.
  known_problems:
  - globalPsFallback in xml-cii-trace-resolution-ledger.js requires staged container branch compatibility, so PS00608.1 is rejected despite its exact tag and COMPRE / ATTACHED_COMPONENT_REF matching the XML branch.
  - The standalone default trace config leaves sourceSchema empty; simply calling shared resolver APIs would otherwise preserve legacy behavior.
  - The current shared support-restraint resolver rejects internal staged relationship conflicts but does not by itself prove cross-source attachment-to-XML-branch agreement or uniqueness across unrelated relationship roots.
  deliberate_non_goals:
  - No PS* => REST inference or PS00608.1 special case.
  - No coordinate-only support authority and no coordinate override of relationship conflicts.
  - No changes to PR 417 coordinate-custody paths, geometry topology, rigid weights, line-list mapping, regex/branch mapping, B31.3 or large-master import.
  - No claim that PS00572.1 is feasible from the current benchmark; it is absent from both exact benchmark members.
  terminology:
    explicit_attachment: Staged relationship field such as COMPRE / ATTACHED_COMPONENT_REF that names the attached XML component or branch.
    unique_compatible_evidence: Exactly one qualified support relationship family agrees with normalized support identity and the XML branch; zero remains unresolved and more than one remains ambiguous.
