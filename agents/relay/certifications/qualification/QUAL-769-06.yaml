    protected_invariant: Legitimate PIPE/reducer/tee/olet/endpoint topology, valid negative-coordinate runs, restraints and PR 417 coordinate/origin behavior remain unchanged.
    custody_boundary: Writes remain limited to converters/scripts/xml_to_cii2019.py and converters/scripts/test_xml_to_cii2019_edge_order_authority.py; PR 417 paths are excluded.
    falsifier: Zero or multiple host segments, ambiguous junction identity, need for NodeNumber sorting or coordinate-sign reversal, PR 417 overlap, or any negative-control topology change invalidates the repair.
