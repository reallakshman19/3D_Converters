- id: Q2
  response: A -1 FBLI reaches the wrapper with a length-bearing blind-flange record. Because FBLI is not in {FLAN,RIGID}, the wrapper leaves NodeNumber negative. The base parser rejects node_number <= 0 before model construction, so the blind flange disappears. The first wrong authority boundary is component-family admission in the wrapper, not CII serialization.
  outputs:
    reconstruction_steps:
    - Read ComponentType=FBLI, NodeNumber=-1 and ElementLengthMm in the wrapper.
    - Evaluate existing negative-node eligibility; FBLI is absent from RENUMBERABLE_NEGATIVE_TYPES.
    - Node remains negative.
    - Base _parse_xml_document rejects node_number <= 0.
    - No model/CII record can be produced for that node.
    intermediate_result: The record is lost before model creation because negative FBLI never receives a positive synthetic node number.
    expected_result: Classifying FBLI into the existing flange retention family causes eligible FBLI to be positively renumbered before the base parser and therefore retained.
  evidence:
