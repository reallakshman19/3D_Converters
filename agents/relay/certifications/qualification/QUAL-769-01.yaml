  outputs:
    mutation_effect: FBLI is admitted to the existing flange-family negative-node renumber path; no downstream exception is added.
    protected_invariant: FLAN and RIGID behavior stays unchanged, and unrelated negative component types remain non-renumberable/fail-closed.
    falsifier: Any regression in FLAN/RIGID or any negative INST becoming renumberable falsifies the change.
