- id: Q1
  response: The production browser path enriches the raw ZIP XML through enrichment-run-parity.js::enrichXmlForCii2019, including gasket removal and split-condensed renumbering. The Python converter then parses positive nodes, applies _drop_short_element_nodes, and _build_edges serializes consecutive retained nodes. Direction/contracted-direction wrappers consume that same base edge topology downstream.
  outputs:
    production_entrypoint: tabs/model-converters/converters/xmltocii2019_helper/enrichment-run-parity.js::enrichXmlForCii2019 -> converters/scripts/xml_to_cii2019.py::_parse_xml_document
    source_order_owner: Exact AVEVA raw branch/component endpoint records joined to the production-enriched artifact by EVD-769-0002.
    edge_order_owner: converters/scripts/xml_to_cii2019.py::_drop_short_element_nodes followed by _build_edges.
    downstream_consumer: Direction/contracted-direction conversion model and CII ELEMENTS serialization.
