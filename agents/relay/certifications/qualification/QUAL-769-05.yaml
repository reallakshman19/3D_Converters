- id: Q2
  response: Both real cases are exact and symmetric. Generated 2439 is raw FLAN endpoint 2 ref =134234934/25983 at Y=106912.93; terminal RIGID 2440 is at Y=106916.13; BRAN connection 2450 is at Y=106886.13. Generated 2909/2910/2920 have the same topology at X=102600 with refs =134234934/26047, /26049 and /26019. _drop_short_element_nodes removes 2440/2910 because each terminal span is 3.2 mm, then _build_edges converts the new adjacency into the reported 2439->2450 / 2909->2920 vectors of -26.8 mm. Source/component semantics establish that the BRAN records are junctions, not terminal successors, while the blind-flange RIGID records are terminal closures.
  outputs:
    reconstruction_steps:
    - Production enrichment creates 2439/2909 from exact raw FLAN endpoint-2 records and retains 2440/2910 RIGID plus 2450/2920 BRAN.
    - Provenance diagnostic returns 8/8 EXACT joins.
    - Short-node pruning removes 2440/2910 at 3.2 mm.
    - Consecutive-edge construction emits 2439->2450 and 2909->2920, each vector [0,-26.8,0] mm.
    first_wrong_boundary: Short-node pruning erases source-significant terminal closure, after which adjacency-based _build_edges mistakes an appended branch-connection record for the terminal successor.
    expected_order: The branch junction belongs in the unique host span before the terminal flange face; the terminal suffix remains junction -> FLAN endpoint2 -> blind-flange RIGID. For the reported local geometry this is 2450 -> 2439 -> 2440 and 2920 -> 2909 -> 2910, with the upstream host edge split at the junction.
    provenance_basis: EVD-769-0002 exact raw/enriched joins and source component/endpoint semantics.
  evidence:
