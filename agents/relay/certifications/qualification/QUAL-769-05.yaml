  - agents/relay/certifications/discovery/DISC-769-06.yaml
- id: Q3
  response: The smallest permitted mutation is topology normalization inside xml_to_cii2019.py before short-node pruning/edge construction. It may act only when explicit source semantics identify a trailing BRAN connection and a source-proven blind-flange terminal closure, and the BRAN point resolves to exactly one host segment. It must not sort NodeNumbers, reverse on coordinate sign, touch coordinate custody, or alter ordinary reducer/tee/run ordering.
  outputs:
    mutation_effect: Move only a uniquely resolved trailing BRAN connection into its host segment before edge construction and preserve the source-proven terminal blind-flange RIGID from short-node pruning; otherwise leave branch order unchanged/fail closed.
    protected_invariant: Legitimate PIPE/reducer/tee/olet/endpoint topology, valid negative-coordinate runs, restraints, and PR 417 coordinate/origin behavior remain unchanged.
    custody_boundary: Writes limited to converters/scripts/xml_to_cii2019.py and converters/scripts/test_xml_to_cii2019_edge_order_authority.py; current PR 417 paths are excluded.
    falsifier: Multiple/no host segments, ambiguous junction identity, need for global NodeNumber sort or coordinate-sign reversal, PR 417 overlap, or any negative-control topology change makes the repair unsafe.
  evidence:
  - agents/relay/evidence/EVD-769-0002.yaml
  - agents/relay/execution-packages/EP-769-04.yaml
  - GitHub PR 417 changed-file readback
- id: Q4
  response: The oracle is the frozen real provenance in EVD-769-0002, declared before implementation. The focused test must reproduce both exact terminal/junction cases and assert junction insertion, terminal RIGID preservation, absence of 2439->2450 and 2909->2920, and the positive 26.8 mm junction-to-flange span. Negative controls must prove ordinary negative-coordinate runs, reducers, tees/olets, non-junction BRAN records, ambiguous/no-host junction candidates and terminal flange pairs without appended BRAN tails are not globally reordered.
  outputs:
    independent_method: Construct fixtures from the exact component types/endpoints/positions and expected topology declared in EVD-769-0002; compare normalized branch/edge pairs independently of the proposed implementation.
    predicted_result: Real cases normalize to host -> BRAN junction -> terminal FLAN -> blind-flange RIGID, with junction-to-FLAN scalar distance 26.8 mm and no reversed serial edge; all negative controls retain their original semantic ordering.
    negative_controls:
    - legitimate negative-coordinate physical run
    - standard reducer transition
    - TEE/OLET multi-endpoint topology
    - BRAN candidate with zero or multiple possible host segments
    - terminal flange/equipment pair without appended BRAN tail
    tolerance_or_exactness: Component identity, endpoint, edge-pair and no-reorder assertions exact; position/length comparisons absolute tolerance 1e-6 mm.
  evidence:
  - agents/relay/evidence/EVD-769-0002.yaml
  - agents/relay/execution-packages/EP-769-04.yaml
- id: Q5
  response: First bounded write is one topology-normalization helper plus parser provenance needed to identify the blind-flange terminal, invoked before _drop_short_element_nodes, and one focused regression file. A trailing BRAN endpoint-2 record is eligible only when it is an explicit shared branch junction and its position lies on exactly one existing host segment; it is inserted into that segment. A terminal RIGID is protected from short-node removal only when raw source adjacency/provenance identifies it as the closure of an FBLI component. All other cases preserve existing order/pruning. No coordinate frame mapping is changed.
  outputs:
    first_change_or_stop: Modify converters/scripts/xml_to_cii2019.py only within parse/topology-normalization/short-prune ownership, plus converters/scripts/test_xml_to_cii2019_edge_order_authority.py; stop instead of guessing on zero/multiple junction hosts or missing blind-flange provenance.
    predicted_before: 2440/2910 are pruned, then _build_edges emits 2439->2450 and 2909->2920 at -26.8 mm.
    predicted_after: Junction records split their unique host segments and precede the terminal FLAN face; 2440/2910 remain terminal closure nodes, yielding 2450->2439 and 2920->2909 at +26.8 mm and FLAN->RIGID terminal edges, without global reordering.
    verification: TEST-ORDER-REAL-PY covers both real fixtures and all negative controls; TEST-ORDER-REAL-SCOPE requires zero intersection with PR 417.
