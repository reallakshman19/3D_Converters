name: Engineering Calculations — controlled flange-face binding source
about: Submit one real controlled project source for FlangeFaceBindingSourceRecord.v1 custody and independent review.
title: "engcalc P8 source: <project> / <joint> / <record revision>"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for exactly one real project-controlled flange-face binding source record.

        This submission is source custody only. It does not grant Code compliance, design authority, governing eligibility, automatic model routing, master resolution, or solver authority.

        Do not infer missing engineering semantics from bounding boxes, primitive orientation, native-kind/text classification, EP1/EP2 ordering, PCF chain direction, nearest topology, or tolerance-based candidate selection. If a required controlled fact is unavailable, state that explicitly and leave the record unadmitted.
  - type: input
    id: project_id
    attributes:
      label: Project ID
      description: Controlled project identifier.
      placeholder: PROJECT-...
    validations:
      required: true
  - type: input
    id: record_identity
    attributes:
      label: Source record ID and revision
      description: Proposed FlangeFaceBindingSourceRecord.v1 recordId and recordRevisionId.
      placeholder: RECORD-ID / REVISION
    validations:
      required: true
  - type: textarea
    id: model_identity
    attributes:
      label: Exact model identity and custody
      description: Provide modelId, modelRevisionId, globalFrameId, source kind/file/ref/path/nativeKind identity, sourceSchema=rvm-converter-stage/v1, units, and retained evidence reference(s).
      placeholder: |
        modelId:
        modelRevisionId:
        globalFrameId:
        source file/hash/ref/path:
        nativeKind:
        retained evidence IDs:
    validations:
      required: true
  - type: textarea
    id: physical_flange
    attributes:
      label: Controlled physical flange and calculation-face declaration
      description: Identify the physical flange component, selected calculation face, selected port, and the controlled source that makes those engineering declarations.
      placeholder: |
        componentId:
        componentRole: PHYSICAL_FLANGE
        selectedFaceId:
        selectedPortId:
        modelEntitySourceId:
        calculationFaceSourceId:
    validations:
      required: true
  - type: textarea
    id: face_geometry
    attributes:
      label: Face reference point, opening direction, and mating side
      description: Supply the physical face point in the declared global frame, one positive local opening direction, matingSideId, and separate controlled provenance for each semantic declaration.
      placeholder: |
        referencePointGlobalM: { x: , y: , z: }
        positiveOpeningDirection: POSITIVE_LOCAL_X | POSITIVE_LOCAL_Y | POSITIVE_LOCAL_Z
        matingSideId:
        openingDirectionSourceId:
        matingSideSourceId:
        globalFrameSourceId:
    validations:
      required: true
  - type: textarea
    id: analysis_identity
    attributes:
      label: Exact Advanced_Analysis interface identities
      description: Provide the pinned repository/commit, interface-set semantic hash, interfaceId, interface semantic hash, frame semantic hash, reporting sign convention, and source evidence reference.
      placeholder: |
        repository: reallaksh19/Advanced_Analysis
        commit: eabb93cd44c59ce182d73284cb707653917e07c8
        interfaceSetSemanticHash:
        interfaceId:
        interfaceSemanticHash:
        frameSemanticHash:
        reportingSignConvention:
        analysisInterfaceSourceId:
    validations:
      required: true
  - type: textarea
    id: ambiguity_policy
    attributes:
      label: Ambiguity and tolerance custody
      description: The v1 register requires exact identifiers, one unambiguous candidate, and explicit positional/orientation tolerances with a controlled tolerance source.
      placeholder: |
        identityPolicy: EXACT_IDENTIFIERS_ONLY
        ambiguityDisposition: UNAMBIGUOUS_REQUIRED
        candidateCount: 1
        positionToleranceM:
        orientationToleranceRad:
        toleranceSourceId:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Retained evidence package
      description: List immutable document/file/record IDs or repository refs supporting every declaration above. Do not paste licensed Code text or secrets.
      placeholder: Evidence IDs, hashes, controlled document references, repository refs, or attachment descriptions.
    validations:
      required: true
  - type: textarea
    id: independent_review
    attributes:
      label: Independent engineering review
      description: Provide reviewer identity/role, review evidence reference, disposition, and review date. If not yet reviewed, write NOT_RUN and the submission remains blocked.
      placeholder: |
        reviewer:
        reviewerRole:
        reviewEvidenceId:
        disposition: ACCEPTED | REJECTED | NOT_RUN
        reviewDate:
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Submission declarations
      options:
        - label: I confirm this submission represents one real controlled project source and does not contain synthetic project facts.
          required: true
        - label: I confirm no required engineering semantic was inferred from bounding boxes, primitive orientation, text/native-kind recognition, EP ordering, chain direction, nearest topology, or hidden tolerances.
          required: true
        - label: I understand acceptance into source custody does not grant Code compliance, design authority, governing eligibility, or automatic solver execution.
          required: true
