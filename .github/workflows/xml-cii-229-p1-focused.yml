name: XML CII 229 P1 Focused Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'converters/xml-cii2019-core/branch-format-extraction.js'
      - 'tabs/xml-cii-2019-standalone/**'
      - 'docs/converters/xml-cii2019-core/branch-format-extraction.js'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml-cii-229-regex-authority.test.mjs'
      - '.github/workflows/xml-cii-229-p1-focused.yml'

permissions:
  contents: read

jobs:
  p1-regex-and-run-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source/served module parity
        shell: bash
        run: |
          set -euo pipefail
          diff -u converters/xml-cii2019-core/branch-format-extraction.js docs/converters/xml-cii2019-core/branch-format-extraction.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-state.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-state.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-regex-tester.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-regex-tester.js
          diff -u tabs/xml-cii-2019-standalone/xml-cii-regex-tester.js docs/tabs/xml-cii-2019-standalone/xml-cii-regex-tester.js
      - name: Validate JS parseability
        shell: bash
        run: |
          set -euo pipefail
          node --check converters/xml-cii2019-core/branch-format-extraction.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-state.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-regex-tester.js
          node --check tabs/xml-cii-2019-standalone/xml-cii-regex-tester.js
          node --check tests/xml-cii-229-regex-authority.test.mjs
      - name: Run owner-229 targeted regressions and existing J04 release gates
        run: |
          node --test             tests/xml-cii-229-regex-authority.test.mjs             tests/xml-cii-j04-output-authority-readiness.test.mjs             tests/xml-cii-j04-service-release-gate.test.mjs
