name: LFJ R07 Worker job lifecycle
on:
  push:
    branches: ['lfj/r07-lifecycle-product']
    paths:
      - 'lfj/transport/lifecycle/**'
      - '.github/workflows/lfj-r07-worker-lifecycle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lfj/transport/lifecycle/**'
      - '.github/workflows/lfj-r07-worker-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  lifecycle:
    name: R07 Node ${{ matrix.node }} real Worker lifecycle and fail-closed state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact candidate and Node attest
        run: |
          echo "R07_TESTED_SHA=$(git rev-parse HEAD)"
          node --version
      - name: RED first / native Worker lifecycle
        run: node --test lfj/transport/lifecycle/*.test.mjs
      - name: Verify zero test side effects
        run: test -z "$(git status --porcelain)"
