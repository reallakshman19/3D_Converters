name: Issue 880 C05.5.4.1 Corrupt Restore Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrupt-restore-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.5.4.1 failure-matrix baseline
        run: node --test tests/xml-cii-issue-880-corrupt-restore-baseline.test.mjs
