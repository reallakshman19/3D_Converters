name: XML229 Native Staged Position Owner Proof

on:
  pull_request:
    paths:
      - 'converters/scripts/xml_to_cii2019_master_addon.py'
      - 'docs/converters/scripts/xml_to_cii2019_master_addon.py'
      - 'tests/test_xml229_staged_position_scope.py'
      - 'tests/xml229-staged-ambiguity-export.test.mjs'
      - 'tests/xml229-staged-owner-real-cli-e2e.test.mjs'
      - 'converters/scripts/xml229_native_final_mass_binding.py'
      - 'docs/converters/scripts/xml229_native_final_mass_binding.py'
      - 'converters/scripts/xml_to_cii2019_runtime_custody.py'
      - 'docs/converters/scripts/xml_to_cii2019_runtime_custody.py'
      - 'converters/scripts/xml_to_cii2019_patched.py'
      - 'docs/converters/scripts/xml_to_cii2019_patched.py'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs'
      - '.github/workflows/xml229-staged-position-owner-proof.yml'
  workflow_dispatch:

jobs:
  exact-source-owner-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile native module and verify served mirror
        run: |
          python -m py_compile converters/scripts/xml_to_cii2019_master_addon.py converters/scripts/xml229_native_final_mass_binding.py converters/scripts/xml_to_cii2019_runtime_custody.py
          cmp converters/scripts/xml_to_cii2019_master_addon.py docs/converters/scripts/xml_to_cii2019_master_addon.py
          cmp converters/scripts/xml229_native_final_mass_binding.py docs/converters/scripts/xml229_native_final_mass_binding.py
          cmp converters/scripts/xml_to_cii2019_runtime_custody.py docs/converters/scripts/xml_to_cii2019_runtime_custody.py
      - name: Staged-position unique-owner positive and fail-closed negative cases
        run: python -m unittest discover -s tests -p 'test_xml229_staged_position_scope.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-safe native receipt export and legacy boundary
        run: |
          cmp tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs docs/tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs
          cmp converters/scripts/xml_to_cii2019_patched.py docs/converters/scripts/xml_to_cii2019_patched.py
          node --test tests/xml229-staged-ambiguity-export.test.mjs tests/xml229-staged-owner-real-cli-e2e.test.mjs
