name: PR780 phase E-B1 apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply worker atomic remap capability
        run: python3 scripts/_pr780_phase_e_b1_apply.py
      - name: Syntax checks
        run: |
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-client.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-service.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js
      - name: Run applicable Phase E-B1 regressions
        run: |
          node --test \
            tests/xml-cii-master-dataset-remap.test.mjs \
            tests/xml-cii-master-dataset-worker.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            tests/xml-cii-workflow-job-dataset-materialization.test.mjs
      - name: Commit protected Phase E-B1 result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_pr780_phase_e_b1_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-client.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-client.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-service.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-service.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js \
            tests/xml-cii-master-dataset-remap.test.mjs \
            scripts/_pr780_phase_e_b1_apply.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(xml-cii): add atomic worker dataset remap'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
