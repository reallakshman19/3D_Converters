name: Issue 857 C05.4.3 Valve Weight Cold Hydration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valve-weight-cold-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.4.3 focused contract
        run: node --test tests/xml-cii-issue-857-valve-weight-cold-hydration.test.mjs
