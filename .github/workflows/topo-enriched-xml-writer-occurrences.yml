name: TopoEnrichedXML Writer Occurrences

on:
  pull_request:
    paths:
      - 'tabs/stagedjson-to-enrichxml/psi-writer-occurrence-planner.js'
      - 'tests/psi-writer-occurrence-planner.test.mjs'
      - 'tests/fixtures/topo-enriched-xml/writer-occurrences/**'
      - 'contracts/topo-enriched-xml/**'
      - 'schemas/topo-enriched-xml/**'
      - '.github/workflows/topo-enriched-xml-writer-occurrences.yml'
  workflow_dispatch:

jobs:
  validate-writer-occurrences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check planner and tests
        run: |
          node --check tabs/stagedjson-to-enrichxml/psi-writer-occurrence-planner.js
          node --check tests/psi-writer-occurrence-planner.test.mjs
      - name: Run TE-003 occurrence planner tests
        run: node --test tests/psi-writer-occurrence-planner.test.mjs
      - name: Protect TE-002 contract freeze
        run: node --test tests/topo-enriched-xml-contracts.test.mjs
      - name: Protect TE-001 characterization
        run: node --test tests/topo-enriched-xml-current-allocation.test.mjs
      - name: Protect PSI writer selection
        run: node --test tests/stagedjson-psi-writer-selection.test.mjs
      - name: Protect enriched XML topology
        run: node --test tests/stagedjson-enriched-xml-topology.test.mjs
