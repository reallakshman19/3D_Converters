name: LFJ 1104 A04 original Worker to typed candidate (PROVISIONAL)
on:
  pull_request:
    branches: [feat/1104-a02-atomic-source-generation-sink]
    paths:
      - 'lfj/acceptance/3d-converters/served-published-typed-candidate.mjs'
      - 'lfj/consumers/3d-converters/published-source-typed-candidate*.mjs'
      - '.github/workflows/lfj-1104-published-typed-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-browser-to-typed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Exact source candidate HEAD
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/checkout@v4
        with:
          ref: f3b1383be6707ec884325176bc6b98d9b40ca7c8
          path: upstream
      - name: Real neutral Worker runtime pinned and 14-module provisional closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "f3b1383be6707ec884325176bc6b98d9b40ca7c8"
          stage_dir="$(mktemp -d "${RUNNER_TEMP}/lfj-1104-a04-XXXXXX")"
          echo "LFJ_A04_STAGE=${stage_dir}" >> "${GITHUB_ENV}"
          (cd upstream && node lfj/qualification/provisional/stage-public-runtime.mjs --stage-dir "${stage_dir}")
          cat "${stage_dir}/lfj/source-derived-staging-report.json"
      - name: Install native Chromium
        working-directory: candidate
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve unmodified pinned neutral closure from TEMP staging
        shell: bash
        run: |
          set -euo pipefail
          (cd "${LFJ_A04_STAGE}" && python3 -m http.server 4186 --bind 127.0.0.1 >/tmp/lfj-a04-http.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4186/lfj/served-durable-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-a04-http.log
          exit 1
      - name: Actual Worker/IDB -> receiver -> app CAS -> typed owners
        working-directory: candidate
        run: node lfj/acceptance/3d-converters/served-published-typed-candidate.mjs
      - name: Retain exactly pinned neutral source-closure inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfj-a04-provisional-source-closure
          path: ${{ env.LFJ_A04_STAGE }}/lfj/source-derived-staging-report.json
          if-no-files-found: warn
