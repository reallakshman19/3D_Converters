name: PR780 FBX cache test native backup

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save native backup
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq 'native backup: PR780 shared-shell FBX cache test'; then
            exit 0
          fi
          node utils/backup.js save 'tests/fbx/test-fbx2-runtime-cache-chain.mjs' 'PR780 shared app-shell cache token advance before edit'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .backups
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: native backup: PR780 shared-shell FBX cache test'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
