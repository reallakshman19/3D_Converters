name: StagedJSON InputXML Sync Main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stagedjson-inputxml-sync-main.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Work Pack branch
        uses: actions/checkout@v4
        with:
          ref: agent/stagedjson-inputxml-audit-fix
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          test "$(git rev-parse origin/main)" = "78d9bd4f29e0297c33f53230e3cd8729a727d00d"
          git merge --no-edit origin/main
      - name: Install dependencies
        run: |
          npm ci --omit=dev
          python -m pip install --disable-pip-version-check pytest
      - name: Focused verification after merge
        run: |
          python -m py_compile \
            converters/scripts/inputxml_bookmark.py \
            converters/scripts/stagedjson_inputxml_diagnostics.py \
            converters/scripts/stagedjson_to_inputxml.py \
            converters/scripts/test_stagedjson_inputxml_workpack.py
          node --check converters/invocation-builder.js
          node --check converters/py-worker.js
          node --check tabs/model-converters/stagedjson-inputxml-diagnostics-panel.js
          python -m pytest -q converters/scripts/test_stagedjson_inputxml_workpack.py
          python converters/scripts/test_coord_transform.py
          python converters/scripts/test_chain_g4_g5.py
          node tests/stagedjson-inputxml-workpack.test.js
          node tests/xml-cii-standalone-source-mode-integration.test.js
      - name: Named base vs head ledger after merge
        run: |
          git worktree add --detach /tmp/stagedjson-inputxml-base origin/main
          npm ci --prefix /tmp/stagedjson-inputxml-base --omit=dev
          python scripts/xml-builder-inputxml-baseline-gate.py \
            --base /tmp/stagedjson-inputxml-base \
            --head . \
            --output /tmp/stagedjson-inputxml-synced-baseline.json
      - name: Remove sync workflow and push
        run: |
          git rm -f .github/workflows/stagedjson-inputxml-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:agent/stagedjson-inputxml-audit-fix
