name: Agent P B2-B V7 DTXR Rating Worker
on:
  push:
    branches:
      - 'agent-p/1000-preview-b2b-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-dtxr-transaction.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-dtxr-transaction.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-rating-fetch.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-rating-fetch.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dryrun-core.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dryrun-core.js'
      - 'tests/xml-cii-preview-original-node-ordinal.test.mjs'
      - 'tests/xml-cii-preview-b2b-dtxr-worker.test.mjs'
      - 'tests/browser/xml-cii-preview-b2b-dtxr-worker.html'
      - 'scripts/run-xml-cii-preview-b2b-dtxr-worker.mjs'
      - '.github/workflows/xml-cii-preview-b2b-dtxr-worker.yml'
jobs:
  dtxr-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manual Rating precedence, conflict, stale-edit and rollback oracles
        run: |
          node --test tests/xml-cii-preview-original-node-ordinal.test.mjs \
            tests/xml-cii-preview-b2b-dtxr-worker.test.mjs \
            tests/xml-cii-preview-b2a-worker-rebuild.test.mjs \
            tests/xml-cii-preview-button-basis.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Real V7 DTXR Fetch worker-button and manual authority
        run: node scripts/run-xml-cii-preview-b2b-dtxr-worker.mjs
