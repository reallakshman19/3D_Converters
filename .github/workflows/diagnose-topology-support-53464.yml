name: Validate topology support policy fix

on:
  push:
    branches:
      - fix/topology-support-position-authority-20260715
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and focused tests
        run: |
          for file in tabs/model-converters/converters/component-topology/*.js; do node --check "$file"; done
          node tests/component-topology-static.test.js
          node tests/component-topology-support-policy.test.mjs
      - name: Build real 1885_NC artifacts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { buildComponentTopologyArtifacts } from './tabs/model-converters/converters/component-topology/topology-artifact-exporter.js';
          import { SUPPORT_PROJECTION_TOLERANCE_MM, TOPOLOGY_TOLERANCE_MM } from './tabs/model-converters/converters/component-topology/topology-values.js';
          const sourceText = readFileSync('Benchmarks/1885_NC/1885_NC.json', 'utf8');
          const built = await buildComponentTopologyArtifacts(sourceText, {
            sourceName: '1885_NC.json',
            jobName: '1885_NC',
            toleranceMm: TOPOLOGY_TOLERANCE_MM,
            supportProjectionToleranceMm: SUPPORT_PROJECTION_TOLERANCE_MM,
            enrichmentConfig: {},
          });
          const target = built.traceLedger.records.find((row) => row.sourceRef === '=1006649732/53464');
          if (!target) throw new Error('Target support ledger record was not generated.');
          if (target.primaryDisposition !== 'DEFER_SUPPORT') throw new Error(`Unexpected target disposition: ${target.primaryDisposition}`);
          if (target.canonicalNodeIds.length || target.inputXmlElementIds.length || target.inputXmlChildIds.length) throw new Error('Deferred target support must not project topology or restraints.');
          const result = { metrics: built.metrics, target };
          writeFileSync('1885-support-policy-result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result.metrics));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: 1885-support-policy-result
          path: 1885-support-policy-result.json
