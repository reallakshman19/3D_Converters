name: Validate topology support policy fix

on:
  push:
    branches:
      - fix/topology-support-position-authority-20260715
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validation and capture evidence
        run: |
          set +e
          status=0
          : > support-policy-validation.log
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { runEnrichment } from './tabs/stagedjson-to-enrichxml/sj-enrichment-engine.js';
          import { buildTopologySourceModel } from './tabs/model-converters/converters/component-topology/topology-source-model.js';
          import { portForRole } from './tabs/model-converters/converters/component-topology/topology-connectivity.js';
          import { bestPosition } from './tabs/stagedjson-to-enrichxml/sj-point-resolver.js';
          const text = readFileSync('Benchmarks/1885_NC/1885_NC.json', 'utf8');
          const source = JSON.parse(text);
          const branches = Array.isArray(source) ? source : (source.objects || source.hierarchy || source.branches || []);
          const branch = branches[241];
          const child = branch?.children?.[79];
          const model = await buildTopologySourceModel(text, { sourceName: '1885_NC.json', toleranceMm: 0.5 });
          const component = model.components.find((row) => row.sourcePath === '$[241].children[79]');
          const enrichment = runEnrichment({ stagedJsonText: text, config: {} });
          const record = enrichment.records.find((row) => JSON.stringify(row.path) === JSON.stringify([241, 'children', 79]));
          writeFileSync('support-ps02705-diagnostic.json', JSON.stringify({
            branch: { name: branch?.name, attributes: branch?.attributes },
            child,
            component: component ? {
              sourcePath: component.sourcePath,
              sourceBranchName: component.sourceBranchName,
              positions: component.positions,
              ports: Object.fromEntries(['P','A','L'].map((role) => [role, portForRole(component, role)?.position || null])),
              supportProjection: component.supportProjection,
            } : null,
            record: record ? {
              name: record.name,
              attrs: record.attrs,
              bestPosition: bestPosition(record.attrs),
              resolved: record.resolved,
            } : null,
            siblings: (branch?.children || []).slice(70, 85).map((row, offset) => ({ index: offset + 70, name: row.name, type: row.type, attributes: row.attributes })),
          }, null, 2));
          NODE
          for file in tabs/model-converters/converters/component-topology/*.js; do
            node --check "$file" >> support-policy-validation.log 2>&1 || status=1
          done
          node tests/component-topology-static.test.js >> support-policy-validation.log 2>&1 || status=1
          node tests/component-topology-support-policy.test.mjs >> support-policy-validation.log 2>&1 || status=1
          node --input-type=module >> support-policy-validation.log 2>&1 <<'NODE' || status=1
          import { readFileSync, writeFileSync } from 'node:fs';
          import { buildComponentTopologyArtifacts } from './tabs/model-converters/converters/component-topology/topology-artifact-exporter.js';
          import { SUPPORT_PROJECTION_TOLERANCE_MM, TOPOLOGY_TOLERANCE_MM } from './tabs/model-converters/converters/component-topology/topology-values.js';
          const sourceText = readFileSync('Benchmarks/1885_NC/1885_NC.json', 'utf8');
          const built = await buildComponentTopologyArtifacts(sourceText, {
            sourceName: '1885_NC.json',
            jobName: '1885_NC',
            toleranceMm: TOPOLOGY_TOLERANCE_MM,
            supportProjectionToleranceMm: SUPPORT_PROJECTION_TOLERANCE_MM,
            enrichmentConfig: {},
          });
          const target = built.traceLedger.records.find((row) => row.sourceRef === '=1006649732/53464');
          if (!target) throw new Error('Target support ledger record was not generated.');
          if (target.primaryDisposition !== 'DEFER_SUPPORT') throw new Error(`Unexpected target disposition: ${target.primaryDisposition}`);
          if (target.canonicalNodeIds.length || target.inputXmlElementIds.length || target.inputXmlChildIds.length) throw new Error('Deferred target support must not project topology or restraints.');
          const result = { metrics: built.metrics, target };
          writeFileSync('1885-support-policy-result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result.metrics));
          NODE
          echo "$status" > support-policy-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-policy-validation-evidence
          path: |
            support-policy-validation.log
            support-policy-status.txt
            support-ps02705-diagnostic.json
            1885-support-policy-result.json
          if-no-files-found: warn
      - name: Enforce validation result
        run: |
          test "$(cat support-policy-status.txt)" = "0"
