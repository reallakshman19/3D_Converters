name: Preview V7 Observer Feedback Gate
on:
  push:
    branches:
      - 'agent-p/1000-preview-v7-observer-feedback-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js'
      - 'tests/xml-cii-preview-v7-observer-feedback.test.mjs'
      - 'tests/browser/xml-cii-preview-v7-observer-feedback.html'
      - 'scripts/run-xml-cii-preview-v7-observer-feedback.mjs'
      - '.github/workflows/xml-cii-preview-v7-observer-feedback.yml'
jobs:
  browser-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit RED/green and retained V7 Preview authority regressions
        run: |
          node --test tests/xml-cii-preview-v7-observer-feedback.test.mjs \
            tests/xml-cii-preview-rating-authority.test.mjs \
            tests/xml-cii-preview-cache-v7.test.mjs
      - name: Native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve checked-out branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v7-observer-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/tests/browser/xml-cii-preview-v7-observer-feedback.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v7-observer-http.log
          exit 1
      - name: Actual MutationObserver no-feedback UI oracle
        run: node scripts/run-xml-cii-preview-v7-observer-feedback.mjs
