name: Sync CategorizedInputXML Authority Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/sync-categorized-inputxml-authority-bootstrap.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v6
        with:
          ref: agent/sync-categorized-inputxml-authority
          fetch-depth: 0

      - name: Checkout pinned XML Utilities authority
        uses: actions/checkout@v6
        with:
          repository: reallaksh19/XML_Compare_Utilities
          ref: dd7e62c2dc879d0ac4916303f9c41ff863b50cbc
          path: XML_Compare_Utilities
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Copy exact authority and write manifest
        shell: bash
        run: |
          cp XML_Compare_Utilities/xml-compare/CategorizedInputXmlConverter.js xml-compare/CategorizedInputXmlConverter.js
          cp XML_Compare_Utilities/xml-compare/XmlCompareCoordinateSideload.js xml-compare/XmlCompareCoordinateSideload.js
          cp XML_Compare_Utilities/xml-compare/XmlCompareCoordinateDiagnostics.js xml-compare/XmlCompareCoordinateDiagnostics.js
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          paths = [
              'xml-compare/CategorizedInputXmlConverter.js',
              'xml-compare/XmlCompareCoordinateSideload.js',
              'xml-compare/XmlCompareCoordinateDiagnostics.js',
          ]
          manifest = {
              'schema': 'categorized-inputxml-authority-pin/v1',
              'mode': 'exact-vendored-authority',
              'sourceRepository': 'reallaksh19/XML_Compare_Utilities',
              'sourceCommit': 'dd7e62c2dc879d0ac4916303f9c41ff863b50cbc',
              'files': [
                  {
                      'path': path,
                      'sourcePath': path,
                      'sha256': sha256(Path(path).read_bytes()).hexdigest(),
                  }
                  for path in paths
              ],
              'runtimeNetworkFallback': False,
              'localModificationAuthorized': False,
          }
          Path('xml-compare/CategorizedInputXmlConverter.pin.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          Path('.github/workflows/sync-categorized-inputxml-authority-bootstrap.yml').unlink()
          PY

      - name: Qualify synchronized authority
        shell: bash
        run: |
          cmp xml-compare/CategorizedInputXmlConverter.js XML_Compare_Utilities/xml-compare/CategorizedInputXmlConverter.js
          cmp xml-compare/XmlCompareCoordinateSideload.js XML_Compare_Utilities/xml-compare/XmlCompareCoordinateSideload.js
          cmp xml-compare/XmlCompareCoordinateDiagnostics.js XML_Compare_Utilities/xml-compare/XmlCompareCoordinateDiagnostics.js
          node --experimental-default-type=module tests/categorized-inputxml-authority-pin.test.mjs
          node tests/xml-builder-inputxml-ui.test.js
          git diff --check

      - name: Commit qualified authority sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(categorized): sync pinned coordinate-aware authority'
          git push origin HEAD:agent/sync-categorized-inputxml-authority
