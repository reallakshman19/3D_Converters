name: Topology Normalization Shadow

on:
  pull_request:
    paths:
      - 'tabs/stagedjson-to-enrichxml/topology-normalization/**'
      - 'tests/topology-normalization-shadow.test.mjs'
      - 'tests/fixtures/topology-normalization/**'
      - '.github/workflows/topology-normalization-shadow.yml'
      - 'contracts/topo-enriched-xml/**'
      - 'schemas/topo-enriched-xml/**'
      - 'node-history/matching/**'
      - 'tabs/stagedjson-to-enrichxml/psi-writer-occurrence-planner.js'
      - 'tabs/stagedjson-to-enrichxml/psi-serialization-plan.js'
  workflow_dispatch:

jobs:
  validate-topology-normalization-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate TE-009 bounds and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            Path('tabs/stagedjson-to-enrichxml/topology-normalization/normalization-policy.js'),
            Path('tabs/stagedjson-to-enrichxml/topology-normalization/micro-candidate-builder.js'),
            Path('tabs/stagedjson-to-enrichxml/topology-normalization/topology-conflict-gates.js'),
            Path('tabs/stagedjson-to-enrichxml/topology-normalization/topology-node-references.js'),
            Path('tabs/stagedjson-to-enrichxml/topology-normalization/topology-normalizer-shadow.js'),
            Path('tests/topology-normalization-shadow.test.mjs'),
            Path('tests/fixtures/topology-normalization/shadow-fixture.mjs'),
            Path('tests/fixtures/topology-normalization/orchestrator-regressions.test.mjs'),
          ]
          for path in files:
            count = len(path.read_text().splitlines())
            assert count <= 300, f'{path}: {count} lines'
          PY
          node --check tabs/stagedjson-to-enrichxml/topology-normalization/normalization-policy.js
          node --check tabs/stagedjson-to-enrichxml/topology-normalization/micro-candidate-builder.js
          node --check tabs/stagedjson-to-enrichxml/topology-normalization/topology-conflict-gates.js
          node --check tabs/stagedjson-to-enrichxml/topology-normalization/topology-node-references.js
          node --check tabs/stagedjson-to-enrichxml/topology-normalization/topology-normalizer-shadow.js
          node --check tests/fixtures/topology-normalization/shadow-fixture.mjs
          node --check tests/fixtures/topology-normalization/orchestrator-regressions.test.mjs
          node --check tests/topology-normalization-shadow.test.mjs
      - name: Run TE-009 shadow normalization proof
        run: |
          node --test tests/topology-normalization-shadow.test.mjs
          node --test tests/fixtures/topology-normalization/orchestrator-regressions.test.mjs
      - name: Protect frozen contracts
        run: node --test tests/topo-enriched-xml-contracts.test.mjs
      - name: Protect occurrence identities
        run: node --test tests/psi-writer-occurrence-planner.test.mjs
      - name: Protect exact historical evidence
        run: node --test tests/node-history-exact-matcher.test.mjs
      - name: Protect strict serialization
        run: node --test tests/topo-enriched-xml-strict-serializer.test.mjs
      - name: Protect topology index and trace
        run: node --test tests/topo-topology-index.test.mjs
