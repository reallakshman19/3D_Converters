name: LFJ A3 Product Handoff Boundary
on:
  pull_request:
    paths:
      - 'lfj/consumers/3d-converters/**'
      - 'tabs/xml-cii-2019-standalone/xml-cii-trace-export.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-*.js'
      - '.github/workflows/lfj-a3-product-handoff.yml'
  push:
    paths:
      - 'lfj/consumers/3d-converters/**'
      - '.github/workflows/lfj-a3-product-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-node:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert actual tested head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: A3 source capsule currentness and output bytes
        run: node --test lfj/consumers/3d-converters/verified-xml-csv-handoff.test.mjs
      - name: A3 product CSV grants, original bytes and concurrent stale click negatives
        run: node --test lfj/consumers/3d-converters/source-backed-resolver-export.test.mjs
      - name: A3 strict bounded source catalog budget rejection tests
        run: node --test lfj/consumers/3d-converters/source-catalog-budget.test.mjs
      - name: A3 native Worker product preview state and scope negatives
        run: node --test lfj/consumers/3d-converters/source-backed-resolver-build.test.mjs
      - name: A3 retained shipping stale source and export veto
        run: node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-stale.test.mjs
      - name: Ensure tests did not mutate source
        run: test -z "$(git status --porcelain)"
  native-chromium-worker-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert actual tested head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual source tree and authentic original inputs
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/a3-worker-preview.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-original.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/a3-worker-preview.log
          exit 1
      - name: Actual A3 LFJ Build, original rows, two browser CSV Blob downloads and stale veto
        run: node lfj/consumers/3d-converters/source-backed-resolver-browser.mjs
      - name: Real standalone app tab original file uploads and two actual browser downloads
        run: node lfj/consumers/3d-converters/source-backed-resolver-app-shell-browser.mjs
      - name: Source unchanged after browser qualification
        run: test -z "$(git status --porcelain)"

  populated-30mib-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact populated test head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for native populated Worker stress
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve original 10 MB populated source and application modules
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/lfj-30mib.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/Benchmarks/1885_NC/1885_NC.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-30mib.log
          exit 1
      - name: Native 30MiB populated source catalog and IndexedDB cleanup
        run: node lfj/consumers/3d-converters/source-backed-populated-30mib-browser.mjs
      - name: Source and original fixture custody after stress
        run: test -z "$(git status --porcelain)"

  populated-90mib-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact populated 90MiB test head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for populated source stress
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve original 10 MB populated source and application modules
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/lfj-90mib.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/Benchmarks/1885_NC/1885_NC.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-90mib.log
          exit 1
      - name: Native 90MiB populated source catalog and IndexedDB cleanup
        run: LFJ_A3_STRESS_COPIES=10 node lfj/consumers/3d-converters/source-backed-populated-30mib-browser.mjs
      - name: Source and original fixture custody after stress
        run: test -z "$(git status --porcelain)"

  full-original-10mb-product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact full-product tested head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual original 10MB XML and source from source tree
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/lfj-a3-full-large.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/Benchmarks/1885_NC/1885_NC.topology.input.xml >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-a3-full-large.log
          exit 1
      - name: Original 10MB full native source projection XML and both CSV product goldens
        run: node lfj/consumers/3d-converters/source-backed-large-full-path-browser.mjs
      - name: Assert original fixtures/worktree not mutated
        run: test -z "$(git status --porcelain)"

  full-derived-40mb-product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact full-product tested head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual original 10MB XML and source from source tree
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/lfj-a3-full-large.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/Benchmarks/1885_NC/1885_NC.topology.input.xml >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-a3-full-large.log
          exit 1
      - name: Derived 40MB full native source projection XML and two original output checks
        run: LFJ_A3_FULL_PATH_COPIES=4 node lfj/consumers/3d-converters/source-backed-large-full-path-browser.mjs
      - name: Assert original fixtures/worktree not mutated
        run: test -z "$(git status --porcelain)"
