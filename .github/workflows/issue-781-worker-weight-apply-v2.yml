name: Issue 781 Worker Weight Apply V2

on:
  push:
    branches:
      - agent/issue-781-worker-weight-api-mapping-projection-20260930
    paths:
      - .github/workflows/issue-781-worker-weight-apply-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-781-worker-weight-api-mapping-projection-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay guarded architectural repair against actual service contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/issue-781-worker-weight-apply.yml').read_text()
          match = re.search(r"python3 <<'PY'\n(?P<body>.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('Could not recover guarded apply script.')
          script = textwrap.dedent(match.group('body'))
          lines = script.splitlines()
          dispatch_replaced = 0
          request_id_replaced = 0
          for index, line in enumerate(lines):
              if 'replace_once(svc' in line and 'MASTER_DATASET_COMMAND.SEARCH' in line:
                  lines[index] = "replace_once(svc, \"      case MASTER_DATASET_COMMAND.SEARCH: return search(message);\", \"      case MASTER_DATASET_COMMAND.SEARCH: return search(message);\\n      case MASTER_DATASET_COMMAND.RANK_WEIGHT_ISSUES: return rankWeightIssues(message);\")"
                  dispatch_replaced += 1
              if 'return response(MASTER_DATASET_EVENT.WEIGHT_MATCH_RESULT, message, {' in line:
                  lines[index] = line.replace('WEIGHT_MATCH_RESULT, message, {', 'WEIGHT_MATCH_RESULT, message.requestId, {')
                  request_id_replaced += 1
          if dispatch_replaced != 1:
              raise SystemExit(f'Expected one worker dispatch patch anchor, found {dispatch_replaced}.')
          if request_id_replaced != 1:
              raise SystemExit(f'Expected one Weight response requestId correction, found {request_id_replaced}.')
          script = '\n'.join(lines) + '\n'
          exec(compile(script, '<issue-781-worker-weight-apply-v2>', 'exec'), {'__name__': '__main__'})

          test_path = Path('tests/xml-cii-issue-781-worker-weight-api.test.mjs')
          test_source = test_path.read_text()
          test_source, count = re.subn(
              r"searchDataset:\s*\(corpus, query\)\s*=>\s*corpus\.map\(\(value, index\)\s*=>\s*value\.includes\(query\)\s*\?\s*index\s*:\s*-1\)\.filter\(\(index\)\s*=>\s*index\s*>=\s*0\),",
              "buildSearchCorpus: (rows) => rows.map((row) => Object.values(row).join(' ').toLowerCase()),\n    searchCorpusIndexes: (corpus, query) => corpus.map((value, index) => value.includes(query) ? index : -1).filter((index) => index >= 0),",
              test_source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Synthetic service search dependency replacement count={count}.')

          reject_pattern = re.compile(
              r"const result = await svc\.handle\(\{ type: MASTER_DATASET_COMMAND\.RANK_WEIGHT_ISSUES, requestId: 'rank-line', datasetId: ready\.metadata\.datasetId, issues: \[issue\], config: \{\} \}\);\s*"
              r"assert\.equal\(result\.type, MASTER_DATASET_EVENT\.ERROR\);\s*"
              r"assert\.match\(result\.error\.message, /requires a weight dataset/i\);"
          )
          test_source, count = reject_pattern.subn(
              "await assert.rejects(\n      () => svc.handle({ type: MASTER_DATASET_COMMAND.RANK_WEIGHT_ISSUES, requestId: 'rank-line', datasetId: ready.metadata.datasetId, issues: [issue], config: {} }),\n      /requires a weight dataset/i,\n    );",
              test_source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Synthetic non-weight rejection assertion replacement count={count}.')
          test_path.write_text(test_source)
          PY
      - name: Syntax-check touched runtime files
        run: |
          node --check converters/xml-cii2019-core/linelist-mapping.js
          node --check converters/xml-cii2019-core/weight-match-ranking-service.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-service.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-client.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js
          node --check tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js
      - name: Run focused architectural regressions
        run: |
          node --test tests/xml-cii-issue-781-worker-weight-api.test.mjs
          node --test tests/xml-cii-master-worker-metadata-import.test.mjs
          node --test tests/xml-cii-master-preview-worker-search.test.mjs
          node --test tests/xml-cii-issue-781-weight-build-performance.test.mjs
      - name: Commit qualified implementation
        shell: bash
        run: |
          set -euo pipefail
          git add converters docs tabs tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(issue-781): move Weight ranking to dataset worker'
          git push origin HEAD:agent/issue-781-worker-weight-api-mapping-projection-20260930
