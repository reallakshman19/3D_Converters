name: Issue 871 C05.5.1 Persistence Failure Baselines

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-failure-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.5.1 failure baseline contracts
        run: node --test tests/xml-cii-issue-871-persistence-failure-baseline.test.mjs
