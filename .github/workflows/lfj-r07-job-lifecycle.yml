name: LFJ R07 transactional Worker lifecycle
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/transport/lifecycle/**'
      - '.github/workflows/lfj-r07-job-lifecycle.yml'
  push:
    branches: [lfj/r07-job-lifecycle]
    paths:
      - 'lfj/transport/lifecycle/**'
      - '.github/workflows/lfj-r07-job-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  r07-native-worker:
    name: R07 real Worker lifecycle Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact source and Node runtime
        run: |
          echo "R07_EXACT_HEAD=$(git rev-parse HEAD)"
          node --version
      - name: Native-worker cancellation and transaction tests
        run: node --test lfj/transport/lifecycle/*.test.mjs
      - name: No generated changes
        run: test -z "$(git status --porcelain)"
