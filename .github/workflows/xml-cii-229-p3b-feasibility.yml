name: XML229 P3B.0 Original object-input feasibility
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/xml-cii-229-p3b-original-object-parity.test.mjs'
      - '.github/workflows/xml-cii-229-p3b-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-object-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact original source proof and no production changes
        run: |
          echo "P3B0_HEAD=$(git rev-parse HEAD)"
          echo "P3B0_NODE=$(node --version)"
          printf '6b2c8b01ab0ba6ec8e9e7c42eb4a719668ffd2dc4dbe4790d27cf426a1f60288  Benchmarks/1885Sjson/Sjson.json\n' | sha256sum --check -
          node --check tests/xml-cii-229-p3b-original-object-parity.test.mjs
          node --test tests/xml-cii-229-p3b-original-object-parity.test.mjs
      - name: Retain baseline P3A served mirrors
        run: |
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-preview-source-gate.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-source-gate.mjs
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js
