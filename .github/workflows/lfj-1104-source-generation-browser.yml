name: LFJ 1104 genuine Worker IDB to first-party source CAS (PROVISIONAL)
on:
  pull_request:
    branches: [test/1104-a03-served-receiver-h1]
    paths:
      - 'lfj/consumers/3d-converters/source-generation-store*.mjs'
      - 'lfj/acceptance/3d-converters/h1-served-source-receiver.mjs'
      - '.github/workflows/lfj-1104-source-generation-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-derived-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout literal first-party generation source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Verify candidate HEAD
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Checkout immutable merged neutral source
        uses: actions/checkout@v4
        with:
          ref: f3b1383be6707ec884325176bc6b98d9b40ca7c8
          path: upstream
      - name: Verify immutable upstream and stage complete LFJ module closure OUTSIDE repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "f3b1383be6707ec884325176bc6b98d9b40ca7c8"
          stage_dir="$(mktemp -d "${RUNNER_TEMP}/lfj-firstparty-cas-XXXXXX")"
          echo "LFJ_1104_CAS_STAGE=${stage_dir}" >> "${GITHUB_ENV}"
          cd upstream
          node lfj/qualification/provisional/stage-public-runtime.mjs --stage-dir "${stage_dir}"
          cat "${stage_dir}/lfj/source-derived-staging-report.json"
      - name: Install genuine Chromium native Worker engine
        working-directory: candidate
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve TEMPORARY canonical-source module closure (not authored docs)
        shell: bash
        run: |
          set -euo pipefail
          (cd "${LFJ_1104_CAS_STAGE}" && python3 -m http.server 4186 --bind 127.0.0.1 >/tmp/lfj-1104-cas-http.log 2>&1) &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4186/lfj/served-durable-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-1104-cas-http.log
          exit 1
      - name: Execute true native Worker IndexedDB receiver to first-party source CAS
        working-directory: candidate
        run: node lfj/acceptance/3d-converters/h1-served-source-receiver.mjs
      - name: Preserve canonical source closure SHA inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfj-1104-cas-source-derived-stage
          path: ${{ env.LFJ_1104_CAS_STAGE }}/lfj/source-derived-staging-report.json
          if-no-files-found: warn
