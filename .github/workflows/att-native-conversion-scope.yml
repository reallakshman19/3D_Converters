name: ATT Native Conversion Scope H4
on:
  pull_request:
    paths:
      - 'converters/rmss-attribute-parser.js'
      - 'docs/converters/rmss-attribute-parser.js'
      - 'tabs/model-converters/att-native-scope-*.js'
      - 'docs/tabs/model-converters/att-native-scope-*.js'
      - 'tabs/model-converters/converters/rvmattr-to-xml.js'
      - 'docs/tabs/model-converters/converters/rvmattr-to-xml.js'
      - 'tests/model-converters/test-att-native-conversion-scope.mjs'
      - '.github/workflows/att-native-conversion-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-selected-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source/docs exact mirror
        run: |
          cmp converters/rmss-attribute-parser.js docs/converters/rmss-attribute-parser.js
          cmp tabs/model-converters/converters/rvmattr-to-xml.js docs/tabs/model-converters/converters/rvmattr-to-xml.js
          cmp tabs/model-converters/att-native-scope-selection.js docs/tabs/model-converters/att-native-scope-selection.js
          cmp tabs/model-converters/att-native-scope-popup.js docs/tabs/model-converters/att-native-scope-popup.js
      - name: Real source identity and scope regressions
        run: |
          node --check converters/rmss-attribute-parser.js
          node --check tabs/model-converters/converters/rvmattr-to-xml.js
          node tests/model-converters/test-att-native-conversion-scope.mjs
          node tests/model-converters/test-att-native-scope-selection.mjs
