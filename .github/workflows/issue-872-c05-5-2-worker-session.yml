name: Issue 872 C05.5.2 Worker Session Fallback

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-session-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.5.2 worker fallback contracts
        run: node --test tests/xml-cii-issue-872-worker-session-fallback.test.mjs
