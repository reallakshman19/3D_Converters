name: XML229 Immutable Engineering Basis
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/integration/xml229-engineering-basis-authority.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-regex-smart-ui.js'
      - 'tests/xml-cii-229-engineering-basis-authority.test.mjs'
      - '.github/workflows/xml229-immutable-engineering-basis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check owned session and full approved engineering rules
        run: |
          node --test tests/xml-cii-229-engineering-basis-authority.test.mjs tests/xml-cii-229-review-session-live-basis.test.mjs
          node --test tests/xml-cii-229-p263-integration-correction.test.mjs
      - name: Verify exact production mirror
        shell: bash
        run: |
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-engineering-basis-authority.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-engineering-basis-authority.mjs
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-regex-smart-ui.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-regex-smart-ui.js
