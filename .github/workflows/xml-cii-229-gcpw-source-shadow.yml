name: XML229 A2 GC-PW Source Shadow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/xml-cii-229-gcpw-source-shadow.yml'
      - 'tests/recovery-preview/xml229-gcpw-source-shadow.test.mjs'
      - 'tests/recovery-preview/xml229-worker-physical-facts.test.mjs'
      - 'tests/recovery-preview/xml229-worker-physical-browser.mjs'
      - 'tests/browser/xml229-worker-physical-browser.html'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-gcpw-source-shadow.js'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-gcpw-source-shadow.js'

permissions:
  contents: read

jobs:
  source-shadow:
    name: Exact source-census / schema safety (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Original GLRD + selected source custody + adversarial tests
        run: node --test tests/recovery-preview/xml229-gcpw-source-shadow.test.mjs tests/recovery-preview/xml229-worker-physical-facts.test.mjs
      - name: Root/served shadow parity
        run: |
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-gcpw-source-shadow.js docs/tabs/xml-cii-2019-standalone/integration/xml229-gcpw-source-shadow.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js

  served-browser:
    name: Real Chromium served GLRD module Worker / source-only authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Execute real served module Worker with GLRD source
        run: node tests/recovery-preview/xml229-worker-physical-browser.mjs
      - name: Verify root/served Worker parity
        run: diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js
