name: LFJ R01 root profile independent checks

on:
  push:
    branches:
      - 'lfj/r01-*'
    paths:
      - 'lfj/contracts/profiles/**'
      - '.github/workflows/lfj-r01-profiles.yml'
  pull_request:
    paths:
      - 'lfj/contracts/profiles/**'
      - '.github/workflows/lfj-r01-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-profile:
    name: R01 independently precommitted RED/GREEN source profile truth table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact source head
        run: |
          echo "R01_EXACT_HEAD=$(git rev-parse HEAD)"
          node --version
      - name: Run independently authored R01 cases
        run: node --test lfj/contracts/profiles/root-profile.test.mjs
