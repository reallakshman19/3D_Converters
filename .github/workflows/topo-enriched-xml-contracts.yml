name: TopoEnrichedXML Contract Freeze

on:
  pull_request:
    paths:
      - 'contracts/topo-enriched-xml/**'
      - 'schemas/topo-enriched-xml/**'
      - 'docs/architecture/topo-enriched-xml/adr/**'
      - 'docs/architecture/topo-enriched-xml/contract-freeze.md'
      - 'tests/topo-enriched-xml-contracts.test.mjs'
      - '.github/workflows/topo-enriched-xml-contracts.yml'
  workflow_dispatch:

jobs:
  validate-contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Draft 2020-12 validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'

      - name: Run runtime and schema instance suite
        run: node --test tests/topo-enriched-xml-contracts.test.mjs

      - name: Syntax check contract modules and tests
        shell: bash
        run: |
          for file in contracts/topo-enriched-xml/*.js; do
            node --check "$file"
          done
          node --check tests/topo-enriched-xml-contracts.test.mjs

      - name: Validate every Draft 2020-12 schema document
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          from jsonschema import Draft202012Validator

          paths = sorted(glob.glob('schemas/topo-enriched-xml/*.schema.json'))
          assert len(paths) == 16, f'Expected catalog plus 15 contract schemas; found {len(paths)}'
          for path in paths:
              with open(path, encoding='utf-8') as stream:
                  Draft202012Validator.check_schema(json.load(stream))
              print(f'validated {path}')
          PY

      - name: Protect accepted TE-001 characterization
        run: node --test tests/topo-enriched-xml-current-allocation.test.mjs

      - name: Protect current PSI writer selection
        run: node --test tests/stagedjson-psi-writer-selection.test.mjs

      - name: Protect current enriched XML topology
        run: node --test tests/stagedjson-enriched-xml-topology.test.mjs
