name: Component Topology Support Policy

on:
  pull_request:
    paths:
      - 'tabs/model-converters/converters/component-topology/**'
      - 'tabs/stagedjson-to-enrichxml/**'
      - 'tests/component-topology-**'
      - 'Benchmarks/1885_NC/**'
      - '.github/workflows/component-topology-support-policy.yml'
  workflow_dispatch:

jobs:
  support-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate production module syntax
        run: |
          for file in tabs/model-converters/converters/component-topology/*.js; do node --check "$file"; done
      - name: Validate static contracts
        run: node tests/component-topology-static.test.js
      - name: Validate focused support policy
        run: node tests/component-topology-support-policy.test.mjs
      - name: Validate real 1885_NC support policy
        run: node tests/component-topology-artifacts-1885-nc.test.mjs
      - name: Validate ASIM-1835 compatibility
        run: node tests/component-topology-artifacts-asim-1835.test.mjs
