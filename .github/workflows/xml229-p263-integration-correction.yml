name: XML229 Existing Preview Weight Integration Correction
on:
  push:
    branches:
      - fix/xml229-integrate-p263-existing-stages-20261015
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml-cii-229-p263-integration-correction.test.mjs'
      - '.github/workflows/xml229-p263-integration-correction.yml'
jobs:
  custody-and-routes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check changed JS syntax and source-attested custody regressions
        run: |
          node --check tabs/xml-cii-2019-standalone/integration/xml229-four-master-custody.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-button-session.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js
          node --test tests/xml-cii-229-p263-integration-correction.test.mjs
          node --test tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs
