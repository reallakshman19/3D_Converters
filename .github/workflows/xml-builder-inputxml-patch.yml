name: XML Builder InputXML Guarded Patch

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/xml-builder-inputxml-workpack-patch.mjs
      - .github/workflows/xml-builder-inputxml-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Work Pack branch
        uses: actions/checkout@v4
        with:
          ref: agent/xml-builder-inputxml-audit-fix
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Apply exact patch
        run: node scripts/xml-builder-inputxml-workpack-patch.mjs
      - name: Syntax checks
        run: |
          node --check converters/xml-cii2019-core/custom-input-table-parser.js
          node --check converters/xml-cii2019-core/custom-input-model.js
          node --check converters/xml-cii2019-core/custom-input-xml-builder.js
          node --check converters/xml-cii2019-core/custom-input-api.js
          node --check converters/xml-cii2019-core/custom-input-diagnostics.js
          node --check tabs/model-converters/xml-cii-node-to-inputxml-audit.js
          node --check tabs/model-converters/xml-cii-node-to-inputxml-core.js
          node --check tabs/model-converters/custom-input/custom-input-panel.js
          node --check tabs/xml-builder-diagnostics-view.js
          node --check tabs/xml-builder-tab.js
          node --check tests/xml-cii-node-to-inputxml-core.test.js
          node --check tests/xml-builder-inputxml-ui.test.js
      - name: Focused XML Builder and shared-core tests
        run: |
          node tests/xml-cii-node-to-inputxml-core.test.js
          node tests/xml-cii-node-to-inputxml-benchmark.test.js
          node tests/xml-cii-node-to-inputxml-fillers.test.js
          node tests/xml-builder-inputxml-ui.test.js
      - name: Commit patched capability and remove scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add converters/xml-cii2019-core/custom-input-table-parser.js \
            converters/xml-cii2019-core/custom-input-model.js \
            converters/xml-cii2019-core/custom-input-xml-builder.js \
            converters/xml-cii2019-core/custom-input-api.js \
            converters/xml-cii2019-core/custom-input-diagnostics.js \
            tabs/model-converters/xml-cii-node-to-inputxml-audit.js \
            tabs/model-converters/xml-cii-node-to-inputxml-core.js \
            tabs/model-converters/custom-input/custom-input-panel.js \
            tabs/xml-builder-diagnostics-view.js \
            tabs/xml-builder-tab.js \
            tests/xml-cii-node-to-inputxml-core.test.js \
            tests/xml-builder-inputxml-ui.test.js
          git rm scripts/xml-builder-inputxml-workpack-patch.mjs .github/workflows/xml-builder-inputxml-patch.yml
          git diff --cached --check
          git commit -m "fix: harden XML Builder InputXML generation"
          git push origin HEAD:agent/xml-builder-inputxml-audit-fix
