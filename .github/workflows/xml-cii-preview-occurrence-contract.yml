name: Agent P Source Occurrence Contract
on:
  push:
    branches:
      - 'agent-p/1000-preview-occurrence-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-*'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-*'
      - 'tests/xml-cii-preview-facts-*.test.mjs'
      - '.github/workflows/xml-cii-preview-occurrence-contract.yml'
jobs:
  source-occurrence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable basis and Mode A/B occurrence oracles
        run: node --test tests/xml-cii-preview-facts-basis.test.mjs tests/xml-cii-preview-facts-occurrence.test.mjs
