name: Issue 921 J01 Owner Intent Recovery
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml-cii-*'
      - '.github/workflows/issue-921-recovery-j01-intent.yml'
  workflow_dispatch:
jobs:
  j01-owner-outcome:
    name: J01 hierarchy scope, complete trace and 30MB fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scoped hierarchy, spatial parity, bore trace and generated 30MB acceptance
        run: |
          node --test tests/xml-cii-json-hierarchy-scope.test.mjs \
            tests/xml-cii-trace-spatial-index.test.mjs \
            tests/xml-cii-issue-829-json-trace-bore-validation.test.mjs
      - name: Verify every changed J01 runtime module matches deployable docs
        run: |
          set -eu
          for path in \
            ui-adapted/xml-cii-adapted-resolver-json-trace.js \
            ui-adapted/xml-cii-adapted-resolver-scope.js \
            xml-cii-json-hierarchy-scope.js \
            xml-cii-resolver-json-trace.js \
            xml-cii-trace-resolution-ledger.js \
            xml-cii-trace-spatial-index.js
          do
            cmp "tabs/xml-cii-2019-standalone/$path" "docs/tabs/xml-cii-2019-standalone/$path"
          done
