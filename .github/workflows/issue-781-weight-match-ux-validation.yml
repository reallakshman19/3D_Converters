name: Issue 781 Weight Match Authority UX Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-authority-ui.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-authority-ui.js'
      - 'tests/xml-cii-issue-781-weight-match-authority-presentation.test.mjs'
      - 'tests/xml-cii-rigid-weight-lifecycle.test.mjs'
      - '.github/workflows/issue-781-weight-match-ux-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weight-match-authority-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Issue 781 Weight Match authority presentation regression
        run: node tests/xml-cii-issue-781-weight-match-authority-presentation.test.mjs
      - name: Run rigid-weight lifecycle authority regression
        run: node --test tests/xml-cii-rigid-weight-lifecycle.test.mjs
