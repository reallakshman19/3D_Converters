name: Topo Node Zone Allocation

on:
  pull_request:
    paths:
      - 'node-history/allocation/**'
      - 'tests/node-history-zone-allocator.test.mjs'
      - 'tests/fixtures/node-history/allocation/**'
      - 'node-history/registry/**'
      - 'node-history/matching/**'
      - 'contracts/topo-enriched-xml/**'
      - 'schemas/topo-enriched-xml/**'
      - '.github/workflows/topo-node-zone-allocation.yml'
  workflow_dispatch:

jobs:
  validate-zone-allocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check TE-006 slice
        run: |
          node --check node-history/allocation/allocation-request-normalizer.js
          node --check node-history/allocation/zone-lease-index.js
          node --check node-history/allocation/allocation-result.js
          node --check node-history/allocation/deterministic-zone-allocator.js
          node --check tests/node-history-zone-allocator.test.mjs
      - name: Run TE-006 allocator tests
        run: node --test tests/node-history-zone-allocator.test.mjs
      - name: Protect TE-005 registry foundation
        run: |
          node --test tests/node-history-registry-foundation.test.mjs
          node --test tests/fixtures/node-history/registry/draft-schema-validation.test.mjs
          node --test tests/fixtures/node-history/registry/orchestrator-regressions.test.mjs
      - name: Protect TE-007 exact matcher
        run: node --test tests/node-history-exact-matcher.test.mjs
      - name: Protect TE-002 frozen contracts
        run: node --test tests/topo-enriched-xml-contracts.test.mjs
