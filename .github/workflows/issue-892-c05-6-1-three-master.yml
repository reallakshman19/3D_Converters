name: Issue 892 C05.6.1 Three Master First Load

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-master-first-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-892-http.log 2>&1 &
      - name: Run combined three-master first-load persistence baseline
        run: node scripts/run-xml-cii-issue-892-three-master-cold-reload-e2e.mjs
      - name: Upload first-load receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-892-c05-6-1-three-master-first-load
          path: |
            ValidationRecords/xml-cii-issue-892-three-master-first-load.json
            /tmp/issue-892-http.log
          if-no-files-found: error
