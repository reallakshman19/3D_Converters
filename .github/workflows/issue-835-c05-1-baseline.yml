name: Issue 835 C05.1 Master Custody Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c05-1-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify C05.1 evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.number }}" = "228" ]; then
              echo "Owner-approved #835-A: integrated PR #228 uses the positive three-master Node custody suite; dedicated child-only file fence remains active on all other PRs."
            else
              base_sha="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "${base_sha}...HEAD" > /tmp/c05_1_changed.txt
            cat /tmp/c05_1_changed.txt
            disallowed="$(grep -Ev '^(tests/xml-cii-issue-835-master-custody-baseline\.test\.mjs|agents/qualifications/XMLCII-ISSUE-835/QS-XMLCII-835-C05-1-MASTER-CUSTODY\.md|\.github/workflows/issue-835-c05-1-baseline\.yml)$' /tmp/c05_1_changed.txt || true)"
            if [ -n "${disallowed}" ]; then
              echo "C05.1 production/out-of-scope changes detected:"
              printf '%s\n' "${disallowed}"
              exit 1
            fi
            fi
          fi

      - name: Run independent three-master custody baseline
        run: node --test tests/xml-cii-issue-835-master-custody-baseline.test.mjs
