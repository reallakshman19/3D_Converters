name: Issue 781 Worker Child Cache Refresh

on:
  push:
    branches:
      - agent/issue-781-worker-weight-api-mapping-projection-20260930
    paths:
      - .github/workflows/issue-781-worker-cache-child-refresh.yml

permissions:
  contents: write

jobs:
  backup-refresh-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-781-worker-weight-api-mapping-projection-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Back up current worker cache-boundary bytes
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js; do
            node utils/backup.js save "$file" "issue-781 worker child-module cache hardening"
          done
          git add -f .backups
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(issue-781): backup worker child cache boundary'
          git push origin HEAD:agent/issue-781-worker-weight-api-mapping-projection-20260930
      - name: Version worker child-module imports
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin agent/issue-781-worker-weight-api-mapping-projection-20260930
          python3 <<'PY'
          from pathlib import Path
          token='20260930-issue781-worker-weight-api-1'
          edits={
            'tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js': (
              "from './master-dataset-normalize.js';",
              f"from './master-dataset-normalize.js?v={token}';",
            ),
            'tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js': (
              "from '../../../converters/xml-cii2019-core/linelist-mapping.js';",
              f"from '../../../converters/xml-cii2019-core/linelist-mapping.js?v={token}';",
            ),
          }
          for file,(old,new) in edits.items():
            path=Path(file)
            text=path.read_text()
            if old not in text:
              raise SystemExit(f'{file}: expected unversioned child import missing')
            path.write_text(text.replace(old,new,1))
            docs=Path('docs')/path
            docs.write_text(path.read_text())
          PY
      - name: Validate worker cache boundary and architecture
        run: |
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js
          node --test \
            tests/xml-cii-issue-781-worker-weight-api.test.mjs \
            tests/xml-cii-master-worker-metadata-import.test.mjs \
            tests/xml-cii-master-preview-worker-search.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          token='20260930-issue781-worker-weight-api-1'
          checks={
            'tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js': f"master-dataset-normalize.js?v={token}",
            'tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js': f"linelist-mapping.js?v={token}",
          }
          for file,needle in checks.items():
            source=Path(file).read_text()
            if needle not in source: raise SystemExit(f'{file}: missing {needle}')
            if (Path('docs')/file).read_text()!=source: raise SystemExit(f'docs mirror mismatch: {file}')
          PY
      - name: Commit qualified worker child-cache refresh
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(issue-781): version worker normalization cache boundary'
          git push origin HEAD:agent/issue-781-worker-weight-api-mapping-projection-20260930
