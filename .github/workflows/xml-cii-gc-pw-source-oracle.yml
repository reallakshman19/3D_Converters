name: XML-CII GC-PW Source Occurrence Oracle
on:
  pull_request:
    paths:
      - 'scripts/gc-pw-v1-source-custody.py'
      - 'tests/gc-pw-v1-source-custody.test.py'
      - 'docs/architecture/gc-pw-v1-source-oracle.md'
      - '.github/workflows/xml-cii-gc-pw-source-oracle.yml'
  workflow_dispatch:
jobs:
  synthetic-source-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent source oracle negative tests
        run: python3 tests/gc-pw-v1-source-custody.test.py
      - name: Show explicit Owner fixture requirement
        run: python3 scripts/gc-pw-v1-source-custody.py --help
