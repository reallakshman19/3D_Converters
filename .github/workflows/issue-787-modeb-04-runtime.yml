name: Issue 787 Mode B Runtime Handoff Validation

on:
  pull_request:
    branches:
      - main
      - 'agent/issue-787-modeb-03-numbering-20260930'
    paths:
      - 'converters/xml-cii2019-core/topology/xml-cii-mode-b-*.js'
      - 'docs/converters/xml-cii2019-core/topology/xml-cii-mode-b-*.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-api-atta-default.js'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-workflow-api-atta-default.js'
      - 'converters/scripts/xml_to_cii2019.py'
      - 'scripts/xml-cii-mode-b-runtime-materialize.mjs'
      - 'tests/xml-cii-issue-787-mode-b-*.mjs'
      - 'tests/xml-cii-issue-787-mode-b-*.py'
      - 'tests/fixtures/xml-cii-mode-b-*.json'
      - 'docs/InputxmltoCII2019Fixplan.md'
      - 'Benchmarks/XML-CII-2019/**'
      - '.github/workflows/issue-787-modeb-04-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modeb-runtime-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce MODEB-04 new-JS size contract
        shell: bash
        run: |
          test "$(wc -l < converters/xml-cii2019-core/topology/xml-cii-mode-b-runtime.js)" -lt 300
          test "$(wc -l < scripts/xml-cii-mode-b-runtime-materialize.mjs)" -lt 300
      - name: Run MODEB-04 materialization and workflow API regressions
        run: node --test tests/xml-cii-issue-787-mode-b-runtime-materializer.test.mjs
      - name: Materialize real three-source Mode B runtime evidence
        run: node scripts/xml-cii-mode-b-runtime-materialize.mjs --xml-out /tmp/modeb-runtime.xml --evidence-out /tmp/modeb-runtime-evidence.json | tee modeb04-materialization-summary.json
      - name: Prove shared junction in native XML-to-CII writer model
        run: python3 tests/xml-cii-issue-787-mode-b-native-writer.test.py /tmp/modeb-runtime.xml /tmp/modeb-runtime-evidence.json | tee modeb04-native-writer-summary.json
      - name: Preserve frozen MODEB-03 numbering authority
        run: node --test tests/xml-cii-issue-787-mode-b-numbering.test.mjs tests/xml-cii-issue-787-mode-b-numbering-fixture.test.mjs
      - name: Preserve frozen MODEB-02 graph authority
        run: node --test tests/xml-cii-issue-787-mode-b-composite.test.mjs tests/xml-cii-issue-787-mode-b-combined-oracle.test.mjs tests/xml-cii-issue-787-mode-b-composite-fixture.test.mjs
      - name: Preserve MODEB-01 observation authority
        run: node --test tests/xml-cii-issue-787-mode-b-observation.test.mjs tests/xml-cii-issue-787-mode-b-fixture.test.mjs
      - name: Preserve existing single-document topology behavior
        run: node tests/seljson-to-inputxml-topology-element-length.test.js
      - name: Run inherited Issue 776 focused authority regressions
        run: node --test tests/xml-cii-issue-776-*.test.mjs tests/xml-cii-mode-a-preview-restoration.test.mjs
      - name: Run inherited PR780 master-dataset regressions
        run: node --test tests/xml-cii-master-dataset-*.test.mjs tests/xml-cii-master-preview-worker-search.test.mjs tests/xml-cii-master-worker-integration.test.mjs
      - name: Run adjacent authority regressions on MODEB-04 head
        id: adjacent_head
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap \
            tests/xml-cii-smart-ui-preflight.test.mjs \
            tests/xml-cii-regex-confidence-buckets.test.mjs \
            tests/xml-cii-b313-preview-od-selection.test.mjs \
            tests/xml-cii-b313-preview-pressure-unit.test.mjs \
            tests/xml-cii-b313-preview-blocker-ui-static.test.mjs \
            tests/engineering-calculation-core.test.mjs 2>&1 | tee modeb04-adjacent-head.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Checkout stacked PR base for adjacent baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: __modeb04_base
      - name: Run adjacent authority regressions on stacked base
        id: adjacent_base
        shell: bash
        working-directory: __modeb04_base
        run: |
          set +e
          node --test --test-reporter=tap \
            tests/xml-cii-smart-ui-preflight.test.mjs \
            tests/xml-cii-regex-confidence-buckets.test.mjs \
            tests/xml-cii-b313-preview-od-selection.test.mjs \
            tests/xml-cii-b313-preview-pressure-unit.test.mjs \
            tests/xml-cii-b313-preview-blocker-ui-static.test.mjs \
            tests/engineering-calculation-core.test.mjs 2>&1 | tee ../modeb04-adjacent-base.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Classify adjacent regressions against stacked base
        id: adjacent_diff
        if: always()
        shell: bash
        run: |
          set -u
          head_status="${{ steps.adjacent_head.outputs.status }}"
          base_status="${{ steps.adjacent_base.outputs.status }}"
          normalize_failures() {
            sed -nE 's/^[[:space:]]*not ok [0-9]+ - (.*)$/\1/p' "$1" | sed -E 's/[[:space:]]+#.*$//' | sort
          }
          normalize_failures modeb04-adjacent-head.log > modeb04-adjacent-head.failures.txt
          normalize_failures modeb04-adjacent-base.log > modeb04-adjacent-base.failures.txt
          comm -23 modeb04-adjacent-head.failures.txt modeb04-adjacent-base.failures.txt > modeb04-adjacent-new.failures.txt
          status=0
          classification="head-pass"
          if [ "${head_status}" != "0" ]; then
            if [ ! -s modeb04-adjacent-head.failures.txt ]; then
              status=1; classification="unclassified-head-failure"
            elif [ "${base_status}" = "0" ]; then
              status=1; classification="new-head-failure"
            elif [ -s modeb04-adjacent-new.failures.txt ]; then
              status=1; classification="new-failure-identity"
            else
              classification="baseline-only-failures"
            fi
          fi
          echo "MODEB-04 adjacent applicability: head=${head_status} base=${base_status} classification=${classification}"
          cat modeb04-adjacent-new.failures.txt || true
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "classification=${classification}" >> "${GITHUB_OUTPUT}"
      - name: Enforce applicable adjacent regression result
        if: always()
        run: test "${{ steps.adjacent_diff.outputs.status }}" = "0"
      - name: Upload MODEB-04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-787-modeb-04-runtime
          path: |
            modeb04-materialization-summary.json
            modeb04-native-writer-summary.json
            /tmp/modeb-runtime.xml
            /tmp/modeb-runtime-evidence.json
            modeb04-adjacent-head.log
            modeb04-adjacent-base.log
            modeb04-adjacent-head.failures.txt
            modeb04-adjacent-base.failures.txt
            modeb04-adjacent-new.failures.txt
          if-no-files-found: warn
