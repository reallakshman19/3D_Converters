name: Issue 859 C05.4.5 Valve Weight Browser Lifecycle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valve-weight-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-859-http.log 2>&1 &
      - name: Run Valve Weight first-load -> reload -> fresh-worker lifecycle
        run: node scripts/run-xml-cii-issue-859-valve-weight-cold-reload-e2e.mjs
      - name: Upload C05.4.5 browser receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-859-c05-4-5-valve-weight-cold-reload
          path: ValidationRecords/xml-cii-issue-859-valve-weight-cold-reload.json
          if-no-files-found: warn
