name: Issue 856 C05.4.2 Valve Weight Restart Custody

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valve-weight-restart-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.4.2 focused contract
        run: node --test tests/xml-cii-issue-856-valve-weight-restart-custody.test.mjs
