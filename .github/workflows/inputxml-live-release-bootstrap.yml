name: Bootstrap InputXML Live Release Integration

on:
  push:
    branches:
      - agent/inputxml-live-release-diagnostics
    paths:
      - '.github/workflows/inputxml-live-release-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/inputxml-live-release-diagnostics
          fetch-depth: 0

      - name: Apply exact integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          version = '20260729-inputxml-live-release-1'
          old_worker = 'py-worker.js?v=20260711-local-pyodide-worker-1'
          new_worker = f'py-worker.js?v={version}'

          replace(
              'tabs/model-converters/converters/inputxml-to-cii2019.js',
              "import { decodeTextUtf8 } from '../core/output-utils.js';\n",
              "import { decodeTextUtf8 } from '../core/output-utils.js';\nimport {\n  buildInputXmlBlockedSummary,\n  buildInputXmlPreflightRows,\n} from './inputxml-blocked-diagnostics.js';\n",
          )
          replace(
              'tabs/model-converters/converters/inputxml-to-cii2019.js',
              "  const blocked = response.logs?.preflight?.releaseEligible === false;\n  return { ...response, blocked, diagnosticsRows: buildReleasePreflightRows(response.logs) };",
              "  const blocked = response.logs?.preflight?.releaseEligible === false;\n  const rawOutputs = Array.isArray(response.outputs) ? response.outputs : [];\n  const blockedSummary = blocked ? buildInputXmlBlockedSummary(rawOutputs, response.logs) : null;\n  const outputs = blockedSummary ? [blockedSummary.artifact, ...rawOutputs] : rawOutputs;\n  return {\n    ...response,\n    outputs,\n    blocked,\n    blockedSummary,\n    diagnosticsRows: buildInputXmlPreflightRows(outputs, response.logs),\n  };",
          )

          replace(
              'converters/py-worker.js',
              "import { loadVerifiedInputXmlRuntime } from './inputxml-release-runtime-loader.js';\n",
              "import { loadVerifiedInputXmlRuntime } from './inputxml-release-runtime-loader.js';\nimport { createRetryableAsyncCache } from './inputxml-runtime-cache.js';\n",
          )
          replace(
              'converters/py-worker.js',
              "let _pyodidePromise = null;\nlet _inputXmlRuntimePromise = null;\nlet _scriptsLoaded = false;",
              "let _pyodidePromise = null;\nconst _inputXmlRuntimeCache = createRetryableAsyncCache(\n  (pyodide) => loadVerifiedInputXmlRuntime(pyodide, INPUTXML_RUNTIME_MANIFEST_URL),\n);\nlet _scriptsLoaded = false;",
          )
          replace(
              'converters/py-worker.js',
              "async function _ensureInputXmlRuntime(pyodide) {\n  if (!_inputXmlRuntimePromise) {\n    _inputXmlRuntimePromise = loadVerifiedInputXmlRuntime(pyodide, INPUTXML_RUNTIME_MANIFEST_URL);\n  }\n  return await _inputXmlRuntimePromise;\n}",
              "async function _ensureInputXmlRuntime(pyodide) {\n  return await _inputXmlRuntimeCache.get(pyodide);\n}",
          )

          for path in [
              'tabs/model-converters/legacy-adapter.js',
              'converters/BrowserConverterExecutor.js',
              'tabs/model-converters/xml-cii-rich-worker-cache-bust.js',
              'tests/standalone-static.test.js',
          ]:
              replace(path, old_worker, new_worker)

          replace(
              'tabs/model-converters/converter-registry.js',
              "import { run as inputXmlToCii2019Run } from './converters/inputxml-to-cii2019.js';",
              f"import {{ run as inputXmlToCii2019Run }} from './converters/inputxml-to-cii2019.js?v={version}';",
          )
          replace(
              'tabs/model-converters/ModelConvertersTab.js',
              "import './xml-cii-rich-worker-cache-bust.js?v=20260623-xml-cii-rich-worker-1';",
              f"import './xml-cii-rich-worker-cache-bust.js?v={version}';",
          )
          replace(
              'tabs/model-converters/ModelConvertersTab.js',
              "import { renderLegacyModelConvertersTab } from './legacy-adapter.js?v=20260725-fbx-source-graph-preview-1';",
              f"import {{ renderLegacyModelConvertersTab }} from './legacy-adapter.js?v={version}';",
          )
          replace(
              'tabs/model-converters/ModelConvertersTab.js',
              "import { CONVERTERS as LIVE_MODEL_CONVERTERS } from './converter-registry.js?v=20260713-stagedjson-inputxml-audit-1';",
              f"import {{ CONVERTERS as LIVE_MODEL_CONVERTERS }} from './converter-registry.js?v={version}';",
          )
          replace(
              'tabs/model-converters/ModelConvertersTab.js',
              "import { run as inputXmlToCii2019LiveRun } from './converters/inputxml-to-cii2019.js?v=20260627-inputxml-cii2019-live-guard-1';",
              f"import {{ run as inputXmlToCii2019LiveRun }} from './converters/inputxml-to-cii2019.js?v={version}';",
          )
          replace(
              'tabs/model-converters/xml-cii-workflow-bridge.js',
              "import { getXmlCiiPhaseBridge } from './legacy-adapter.js?v=20260725-fbx-source-graph-preview-1';",
              f"import {{ getXmlCiiPhaseBridge }} from './legacy-adapter.js?v={version}';",
          )
          replace(
              'tabs/model-converters/index.js',
              "export { renderModelConvertersTab } from './ModelConvertersTab.js?v=20260727-fbx-zone-stagedjson-1';",
              f"export {{ renderModelConvertersTab }} from './ModelConvertersTab.js?v={version}';",
          )
          replace(
              'tabs/model-converters-tab.js',
              "const MODEL_CONVERTERS_SHIM_VERSION = '20260727-fbx-zone-stagedjson-1';\nconst CANONICAL_MODULE = './model-converters/index.js?v=20260727-fbx-zone-stagedjson-1';\nconst LEGACY_MODULE = './model-converters/legacy-adapter.js?v=20260725-fbx-source-graph-preview-1';",
              f"const MODEL_CONVERTERS_SHIM_VERSION = '{version}';\nconst CANONICAL_MODULE = './model-converters/index.js?v={version}';\nconst LEGACY_MODULE = './model-converters/legacy-adapter.js?v={version}';",
          )
          replace(
              'core/app-standalone-runtime.js',
              "import('../tabs/model-converters-tab.js?v=standalone-2')",
              f"import('../tabs/model-converters-tab.js?v={version}')",
          )

          Path('.github/workflows/inputxml-live-release-bootstrap.yml').unlink()
          PY

      - name: Commit integration patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(inputxml): recover runtime and surface blocked diagnostics'
          git push origin HEAD:agent/inputxml-live-release-diagnostics
