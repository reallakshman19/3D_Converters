name: FBX Pages Deployment Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fbx-pages-deployment-smoke.yml'
      - 'tabs/model-converters/converters/fbx/parser-wasm.js'
      - 'tabs/model-converters/converters/fbx/parser-provenance.js'
      - 'third_party/ufbx/fbx_parser.wasm'
      - 'third_party/ufbx/provenance.json'

permissions:
  contents: write

concurrency:
  group: fbx-pages-deployment-smoke
  cancel-in-progress: true

jobs:
  verify-pages-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll deployed parser identity
        env:
          PAGES_ROOT: https://reallaksh19.github.io/3D_Converters
        run: |
          set -euo pipefail
          expected_sha="$(jq -r '.wasmSha256' third_party/ufbx/provenance.json)"
          expected_bytes="$(jq -r '.wasmByteLength' third_party/ufbx/provenance.json)"
          test "$expected_sha" != null
          test "$expected_bytes" != null

          rm -rf .pages-smoke
          mkdir -p .pages-smoke evidence
          matched=false
          matched_attempt=0
          for attempt in $(seq 1 60); do
            cache_bust="commit=${GITHUB_SHA}&attempt=${attempt}"
            if curl --fail --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                "$PAGES_ROOT/third_party/ufbx/provenance.json?$cache_bust" \
                --output .pages-smoke/provenance.json \
              && curl --fail --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                "$PAGES_ROOT/third_party/ufbx/fbx_parser.wasm?$cache_bust" \
                --output .pages-smoke/fbx_parser.wasm; then
              deployed_sha="$(sha256sum .pages-smoke/fbx_parser.wasm | cut -d' ' -f1)"
              deployed_bytes="$(stat -c '%s' .pages-smoke/fbx_parser.wasm)"
              declared_sha="$(jq -r '.wasmSha256 // empty' .pages-smoke/provenance.json 2>/dev/null || true)"
              declared_bytes="$(jq -r '.wasmByteLength // empty' .pages-smoke/provenance.json 2>/dev/null || true)"
              if [[ "$deployed_sha" == "$expected_sha" \
                  && "$deployed_bytes" == "$expected_bytes" \
                  && "$declared_sha" == "$expected_sha" \
                  && "$declared_bytes" == "$expected_bytes" ]]; then
                matched=true
                matched_attempt="$attempt"
                break
              fi
              printf 'attempt=%s deployed_sha=%s deployed_bytes=%s declared_sha=%s declared_bytes=%s\n' \
                "$attempt" "$deployed_sha" "$deployed_bytes" \
                "$declared_sha" "$declared_bytes"
            fi
            sleep 10
          done

          if [[ "$matched" != true ]]; then
            echo 'GitHub Pages did not converge to the repository parser identity.' >&2
            exit 1
          fi

          curl --fail --location --silent --show-error \
            --header 'Cache-Control: no-cache' \
            "$PAGES_ROOT/tabs/model-converters/converters/fbx/parser-wasm.js?commit=${GITHUB_SHA}" \
            --output .pages-smoke/parser-wasm.js
          grep -F "fetch(url, { cache: 'no-store' })" .pages-smoke/parser-wasm.js

          provenance_sha="$(sha256sum .pages-smoke/provenance.json | cut -d' ' -f1)"
          runtime_sha="$(sha256sum .pages-smoke/parser-wasm.js | cut -d' ' -f1)"
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg schema 'FbxPagesParserDeploymentEvidence.v1' \
            --arg repositoryCommit "$GITHUB_SHA" \
            --arg pagesRoot "$PAGES_ROOT" \
            --arg wasmSha256 "$expected_sha" \
            --argjson wasmByteLength "$expected_bytes" \
            --arg provenanceSha256 "$provenance_sha" \
            --arg parserRuntimeSha256 "$runtime_sha" \
            --arg browserFetchPolicy 'no-store' \
            --argjson convergenceAttempt "$matched_attempt" \
            --arg verifiedAt "$verified_at" \
            '{schema:$schema,repositoryCommit:$repositoryCommit,pagesRoot:$pagesRoot,
              wasmSha256:$wasmSha256,wasmByteLength:$wasmByteLength,
              provenanceSha256:$provenanceSha256,parserRuntimeSha256:$parserRuntimeSha256,
              browserFetchPolicy:$browserFetchPolicy,convergenceAttempt:$convergenceAttempt,
              verifiedAt:$verifiedAt}' \
            > evidence/fbx-pages-parser-deployment.json

          {
            echo '### FBX Pages parser deployment'
            echo
            echo "- repository commit: \`${GITHUB_SHA}\`"
            echo "- SHA-256: \`${expected_sha}\`"
            echo "- byte length: \`${expected_bytes}\`"
            echo "- convergence attempt: \`${matched_attempt}\`"
            echo '- deployed provenance: matched'
            echo '- browser fetch policy: no-store'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit deployment evidence
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/fbx-pages-parser-deployment.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(fbx): record deployed Pages parser identity'
            git push origin HEAD:main
          fi
