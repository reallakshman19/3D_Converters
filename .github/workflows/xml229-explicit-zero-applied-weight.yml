name: XML229 Explicit Zero Applied Weight (source-bound)
on:
  pull_request:
    paths:
      - 'converters/xml-cii2019-core/weight-facts-review-service.js'
      - 'converters/xml-cii2019-core/weight-facts-individual-review.js'
      - 'converters/xml-cii2019-core/weight-facts-mode-a-final-read.js'
      - 'contracts/gc-pw-v1/contract.mjs'
      - 'converters/scripts/xml229_native_final_mass_binding.py'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-*'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs'
      - 'docs/contracts/gc-pw-v1/**'
      - 'docs/converters/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml229-confirmed-zero-weight.test.mjs'
      - 'tests/xml229-safety-current-final-readonly.test.mjs'
      - 'tests/xml229-native-final-mass-consumption.test.py'
      - '.github/workflows/xml229-explicit-zero-applied-weight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirmed-zero-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Source Worker 0 Final and non-intrusive offer
        run: |
          node --test tests/xml229-confirmed-zero-weight.test.mjs tests/xml229-safety-current-final-readonly.test.mjs tests/xml229-g3-candidate-coverage.test.mjs tests/xml229-applied-weight-owner-selection.test.mjs tests/gc-pw-v1-contract.test.mjs tests/xml-cii-agent-w-weight-facts-review.test.mjs tests/xml-cii-agent-w-weight-mode-a-final-dialog.test.mjs tests/xml229-run-hold-audit.test.mjs
      - name: Source and live served code must be identical
        run: |
          for path in             contracts/gc-pw-v1/contract.mjs             converters/xml-cii2019-core/weight-facts-review-service.js             converters/xml-cii2019-core/weight-facts-individual-review.js             converters/xml-cii2019-core/weight-facts-mode-a-final-read.js             tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-applied-weight-owner-selection.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-confirmed-zero-source-wide.mjs             tabs/xml-cii-2019-standalone/integration/xml229-candidate-coverage-report.mjs             tabs/xml-cii-2019-standalone/integration/xml229-full-source-weight-safety-receipt.mjs             tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js             tabs/xml-cii-2019-standalone/ui-adapted/xml229-full-source-safety-download.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-busy-apply-queue.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js             tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-panel-shell.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-unqualified-drafts.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-weight-review-presentation.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js             tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs; do
            diff -u "$path" "docs/$path"
          done
  zero-native-hold-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m py_compile converters/scripts/xml229_native_final_mass_binding.py
          python3 tests/xml229-native-final-mass-consumption.test.py
          diff -u converters/scripts/xml229_native_final_mass_binding.py docs/converters/scripts/xml229_native_final_mass_binding.py
