name: XML229 W3 Final rigid weight reconciliation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'converters/xml-cii2019-core/weight-final-review-reconciliation.js'
      - 'converters/xml-cii2019-core/weight-facts-shared-reconciliation.js'
      - 'docs/converters/xml-cii2019-core/weight-facts-shared-reconciliation.js'
      - 'tests/xml-cii-229-w3b-shared-weight-snapshot.test.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-shared-reconciliation-view.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-shared-reconciliation-view.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js'
      - 'docs/converters/xml-cii2019-core/weight-final-review-reconciliation.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js'
      - 'tests/xml-cii-229-w3-final-reconciliation.test.mjs'
      - 'tests/xml-cii-229-w3-final-reconciliation-browser.mjs'
      - '.github/workflows/xml229-w3-final-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w3-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check exact SHA, scripts and mirrors
        run: |
          git rev-parse HEAD
          node --check converters/xml-cii2019-core/weight-final-review-reconciliation.js
          node --check converters/xml-cii2019-core/weight-facts-shared-reconciliation.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-shared-reconciliation-view.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js
          node --check tests/xml-cii-229-w3-final-reconciliation-browser.mjs
          diff -u converters/xml-cii2019-core/weight-final-review-reconciliation.js docs/converters/xml-cii2019-core/weight-final-review-reconciliation.js
          diff -u converters/xml-cii2019-core/weight-facts-shared-reconciliation.js docs/converters/xml-cii2019-core/weight-facts-shared-reconciliation.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-shared-reconciliation-view.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-shared-reconciliation-view.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js
      - name: Source and Weight acceptance guard tests
        run: |
          node --test tests/xml-cii-229-w3-final-reconciliation.test.mjs tests/xml-cii-229-w3b-shared-weight-snapshot.test.mjs tests/xml-cii-229-weight-blank-only.test.mjs
  w3-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Chromium Final review with duplicates and cancel
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
          node tests/xml-cii-229-w3-final-reconciliation-browser.mjs
