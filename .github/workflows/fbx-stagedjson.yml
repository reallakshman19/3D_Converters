name: FBX StagedJSON

on:
  pull_request:
    paths:
      - 'tabs/model-converters/converter-registry.js'
      - 'tabs/model-converters/converters/fbx-to-stagedjson.js'
      - 'tabs/model-converters/converters/fbx/**'
      - 'contracts/fbx/**'
      - 'third_party/ufbx/**'
      - 'scripts/fbx/**'
      - 'tests/fbx/**'
      - 'tests/fixtures/fbx/**'
      - 'docs/fbx/**'
      - '.github/workflows/fbx-stagedjson.yml'
  push:
    branches: ['agent/f2s-001-fbx-stagedjson-pipe']

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture parser build and materialize result
        if: github.event_name == 'push'
        run: |
          if [ "$(git log -1 --pretty=%s)" = "build(fbx): materialize parser diagnostic" ]; then
            echo 'Diagnostic commit already materialized.'
            exit 0
          fi
          set +e
          mkdir -p docs/fbx
          {
            echo '=== toolchain ==='
            uname -a
            command -v clang-18 || true
            clang-18 --version || true
            echo '=== apt update ==='
            sudo apt-get update
            echo '=== apt install ==='
            sudo apt-get install -y clang-18 lld-18 wasi-libc libclang-rt-18-dev-wasm32
            echo '=== parser build ==='
            CC=clang-18 WASI_SYSROOT=/usr bash scripts/fbx/build-ufbx-wasm.sh
            echo '=== fixture build ==='
            python3 scripts/fbx/generate-fixture.py
          } > docs/fbx/ci-build-debug.log 2>&1
          status=$?
          echo "buildStatus=$status" >> docs/fbx/ci-build-debug.log
          if [ -f third_party/ufbx/fbx_parser.wasm ]; then
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('third_party/ufbx/provenance.json')
          data = json.loads(path.read_text())
          data['wasmSha256'] = hashlib.sha256(Path('third_party/ufbx/fbx_parser.wasm').read_bytes()).hexdigest()
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fbx/ci-build-debug.log third_party/ufbx/fbx_parser.wasm third_party/ufbx/provenance.json tests/fixtures/fbx
          git commit -m 'build(fbx): materialize parser diagnostic'
          git push origin HEAD:agent/f2s-001-fbx-stagedjson-pipe
          exit 0
