name: FBX StagedJSON Cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/fbx-stagedjson.yml'
  push:
    branches: ['agent/f2s-001-fbx-stagedjson-pipe']
    paths:
      - '.github/workflows/fbx-stagedjson.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary mission refs
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete agent/f2s-001-fbx-stagedjson-pipe-clean || true
          git push origin --delete agent/f2s-001-fbx-stagedjson-certify || true
          git push origin --delete agent/f2s-001-fbx-stagedjson-pipe-pr2 || true
          git push origin --delete dummy-never || true
