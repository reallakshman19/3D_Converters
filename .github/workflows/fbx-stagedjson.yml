name: FBX StagedJSON

on:
  pull_request:
    paths:
      - 'tabs/model-converters/converter-registry.js'
      - 'tabs/model-converters/converters/fbx-to-stagedjson.js'
      - 'tabs/model-converters/converters/fbx/**'
      - 'contracts/fbx/**'
      - 'third_party/ufbx/**'
      - 'scripts/fbx/**'
      - 'tests/fbx/**'
      - 'tests/fixtures/fbx/**'
      - 'docs/fbx/**'
      - '.github/workflows/fbx-stagedjson.yml'
  push:
    branches: ['agent/f2s-001-fbx-stagedjson-pipe']
    paths:
      - 'tabs/model-converters/converter-registry.js'
      - 'tabs/model-converters/converters/fbx-to-stagedjson.js'
      - 'tabs/model-converters/converters/fbx/**'
      - 'contracts/fbx/**'
      - 'third_party/ufbx/**'
      - 'scripts/fbx/**'
      - 'tests/fbx/**'
      - 'tests/fixtures/fbx/**'
      - 'docs/fbx/**'
      - '.github/workflows/fbx-stagedjson.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned compiler family
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 wasi-libc libclang-rt-18-dev-wasm32
      - name: Rebuild parser and fixtures
        env:
          CC: clang-18
          WASI_SYSROOT: /usr
        run: |
          bash scripts/fbx/build-ufbx-wasm.sh
          python3 scripts/fbx/generate-fixture.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('third_party/ufbx/provenance.json')
          data = json.loads(path.read_text())
          data['wasmSha256'] = hashlib.sha256(Path('third_party/ufbx/fbx_parser.wasm').read_bytes()).hexdigest()
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
      - name: Materialize reproducible parser on feature branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- third_party/ufbx/fbx_parser.wasm third_party/ufbx/provenance.json tests/fixtures/fbx; then
            echo 'Generated parser and fixtures already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/ufbx/fbx_parser.wasm third_party/ufbx/provenance.json tests/fixtures/fbx
          git commit -m 'build(fbx): refresh reproducible parser artifact'
          git push origin HEAD:agent/f2s-001-fbx-stagedjson-pipe
      - name: Verify generated-byte determinism
        run: git diff --exit-code -- third_party/ufbx/fbx_parser.wasm third_party/ufbx/provenance.json tests/fixtures/fbx/two-pipes.fbx tests/fixtures/fbx/axis-geometric.fbx
      - name: Run FBX certification
        run: |
          node tests/fbx/run-all.mjs
          node tests/fbx/test-determinism.mjs
          node tests/fbx/test-registry.mjs
          node tests/fbx/test-static-guards.mjs
