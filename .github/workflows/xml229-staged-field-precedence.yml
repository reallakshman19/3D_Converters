name: XML229 staged restraint field precedence
on:
  pull_request:
    paths:
      - 'converters/**'
      - 'tabs/xml-cii-2019-standalone/**'
      - 'docs/converters/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml229-staged-field-precedence.test.mjs'
      - '.github/workflows/xml229-staged-field-precedence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/xml229-staged-field-precedence.test.mjs tests/xml229-json-restraint-body-transfer.test.mjs tests/xml-cii-mds-position-restraints.test.mjs tests/xml229-all-mapper-source-gap.test.mjs tests/xml229-preview-restraint-review-policy.test.mjs
