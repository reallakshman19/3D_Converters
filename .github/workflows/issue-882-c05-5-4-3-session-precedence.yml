name: Issue 882 C05.5.4.3 Session Precedence Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-precedence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.5.4.3 precedence and regression contracts
        run: |
          node --test \
            tests/xml-cii-issue-882-session-precedence.test.mjs \
            tests/xml-cii-issue-881-per-master-restore-isolation.test.mjs \
            tests/xml-cii-issue-873-session-custody.test.mjs
