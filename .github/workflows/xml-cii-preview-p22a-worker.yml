name: Agent P Preview P2.2-A Worker Qualification
on:
  push:
    branches:
      - 'agent-p/1000-preview-worker-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-*'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-*'
      - 'tests/xml-cii-preview-local-execution.test.mjs'
      - 'tests/browser/xml-cii-preview-p22a-local-worker.html'
      - 'scripts/run-xml-cii-preview-p22a-local-worker.mjs'
      - '.github/workflows/xml-cii-preview-p22a-worker.yml'
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local worker transport and existing source/read contract
        run: |
          node --test tests/xml-cii-preview-local-execution.test.mjs \
            tests/xml-cii-preview-facts-occurrence.test.mjs \
            tests/xml-cii-preview-facts-read-model.test.mjs \
            tests/gc-pw-v1-contract.test.mjs
      - name: Install Chromium for real worker computation
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Run actual module Worker / synthetic owner-scale master fixture
        run: node scripts/run-xml-cii-preview-p22a-local-worker.mjs
