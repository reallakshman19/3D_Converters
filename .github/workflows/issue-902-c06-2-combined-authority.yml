name: Issue 902 C06.2 Combined Authority Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/issue-902-c06-2-combined-authority.yml'
      - 'scripts/run-xml-cii-issue-902-p2810042-combined-e2e.mjs'
      - 'tests/browser/xml-cii-issue-902-p2810042-combined-e2e.html'
      - 'tests/fixtures/xml-cii-p2810042-c06-combined-fixture.js'
      - 'agents/PR907_workreport.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check C06.2 runner and fixture
        run: |
          node --check scripts/run-xml-cii-issue-902-p2810042-combined-e2e.mjs
          node --check tests/fixtures/xml-cii-p2810042-c06-combined-fixture.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-902-http.log 2>&1 &

      - name: Run combined source Preview enriched XML CII authority ledger
        run: node scripts/run-xml-cii-issue-902-p2810042-combined-e2e.mjs

      - name: Upload C06.2 authority receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-902-c06-2-combined-authority
          path: |
            ValidationRecords/xml-cii-issue-902-p2810042-combined.json
            ValidationRecords/xml-cii-issue-902-p2810042-final.xml
            ValidationRecords/xml-cii-issue-902-p2810042.cii
            ValidationRecords/xml-cii-issue-902-p2810042-source.xml
            /tmp/issue-902-http.log
          if-no-files-found: warn
