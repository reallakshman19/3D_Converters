name: Issue 781 Weight Build Native Backup

on:
  push:
    branches:
      - agent/issue-781-weight-build-singleflight-20260930

permissions:
  contents: write

jobs:
  backup:
    if: ${{ !contains(github.event.head_commit.message, '[native-backup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-781-weight-build-singleflight-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository-native pre-edit backups
        shell: bash
        run: |
          set -euo pipefail
          node utils/backup.js save tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js "Issue 781 Weight Match single-flight and pending-validation lifecycle before edit"
          node utils/backup.js save docs/tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js "Issue 781 Weight Match single-flight and pending-validation lifecycle docs mirror before edit"
          node utils/backup.js save tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-consolidated.js "Issue 781 consolidated Weight Match single-flight before edit"
          node utils/backup.js save docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-consolidated.js "Issue 781 consolidated Weight Match single-flight docs mirror before edit"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit"
            exit 0
          fi
          git commit -m "backup(issue-781): protect Weight Build lifecycle targets [native-backup]"
          git push origin HEAD:agent/issue-781-weight-build-singleflight-20260930
