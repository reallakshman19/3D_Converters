name: Issue 884 C05.5.4.5 Corrupt Restore Final Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c05-5-4-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify qualification-only child scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "${base_sha}...HEAD" > /tmp/issue884_changed.txt
            cat /tmp/issue884_changed.txt
            disallowed="$(grep -Ev '^\.github/workflows/issue-884-c05-5-4-5-final\.yml$' /tmp/issue884_changed.txt || true)"
            if [ -n "${disallowed}" ]; then
              echo "Issue 884 must remain qualification-only; unexpected files:"
              printf '%s\n' "${disallowed}"
              exit 1
            fi
          fi

      - name: Run C05.5.4 and descendant-compatible protected-path regressions
        run: |
          node --test \
            tests/xml-cii-issue-881-per-master-restore-isolation.test.mjs \
            tests/xml-cii-issue-882-session-precedence.test.mjs \
            tests/xml-cii-issue-883-restore-failure-identity.test.mjs \
            tests/xml-cii-issue-858-hydrated-weight-match.test.mjs \
            tests/xml-cii-issue-872-worker-session-fallback.test.mjs \
            tests/xml-cii-issue-873-session-custody.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs
