name: TE-014 Remediation Snapshot

on:
  push:
    branches:
      - agent/te-014-psi116-canonical-cii-proof
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive reviewed TE-014 head
        run: git archive --format=zip --output=te014-remediation-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: te014-remediation-source
          path: te014-remediation-source.zip
          if-no-files-found: error
          retention-days: 1
