name: LFJ A-140 XML semantic attestor (author regression)
on:
  push:
    branches:
      - lfj/a-140-semantic-attestor-20261010
  pull_request:
    paths:
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-semantic-attestor*'
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-parity.mjs'
      - '.github/workflows/lfj-a-140-xml-semantic-attestor.yml'
permissions:
  contents: read
jobs:
  source-attestor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pin checked-out source and runner versions
        run: |
          git rev-parse HEAD
          git status --porcelain
          node --version
      - name: Run author-side semantic regression and authentic XML source checks
        run: node --test lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-semantic-attestor.test.mjs
      - name: Run retained B0 structural integrity checks
        run: |
          node --test lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-input-integrity.test.mjs
          node lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-ledger-census-guard.test.mjs

  native-browser-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify raw source candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --version
      - name: Install native Chromium for independent Worker execution
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve original immutable repository fixtures
        shell: bash
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 > /tmp/lfj-a140-web.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-original.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-a140-web.log
          exit 1
      - name: Thirteen original-source native Worker semantic negatives
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-semantic-attestor.browser-negative.mjs
      - name: Ensure tracked source remains untouched
        run: test -z "$(git status --porcelain)"
