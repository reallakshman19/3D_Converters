name: Issue 905 C06.5 Final Exact Head Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/issue-905-c06-5-final-qualification.yml'
      - 'agents/PR*_workreport.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c06-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove C06 stack is qualification-only
        shell: bash
        run: |
          set -euo pipefail
          base=71d3a1a53b9274f8491704367fe9330d526a8cc9
          git diff --name-only "$base" HEAD | sort > c06-changed-files.txt
          git diff --stat "$base" HEAD > c06-diff-stat.txt
          if grep -E '^(tabs/|converters/|docs/tabs/|docs/converters/)' c06-changed-files.txt; then
            echo "Unexpected C06 runtime/docs-runtime change" >&2
            exit 1
          fi
      - name: Run C06.1 source baseline and modular contracts
        run: |
          node --test tests/xml-cii-issue-901-p2810042-source-baseline.test.mjs
          node tests/xml-cii-c06/topology-delta-authority.test.mjs
          node tests/xml-cii-c06/topology-delta-evaluator.test.mjs
          node --check scripts/run-xml-cii-issue-902-p2810042-combined-e2e.mjs
          node --check scripts/run-xml-cii-issue-903-p2810042-topology-delta-e2e.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-905-http.log 2>&1 &
      - name: Run C06.2 combined authority ledger
        run: node scripts/run-xml-cii-issue-902-p2810042-combined-e2e.mjs
      - name: Run C06.3 topology continuity delta gate
        run: node scripts/run-xml-cii-issue-903-p2810042-topology-delta-e2e.mjs
      - name: Upload final C06 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-905-c06-5-final-exact-head
          path: |
            c06-changed-files.txt
            c06-diff-stat.txt
            ValidationRecords/xml-cii-issue-902-p2810042-combined.json
            ValidationRecords/xml-cii-issue-902-p2810042-final.xml
            ValidationRecords/xml-cii-issue-902-p2810042.cii
            ValidationRecords/xml-cii-issue-903-p2810042-topology-delta.json
            ValidationRecords/xml-cii-issue-903-p2810042-final.xml
            /tmp/issue-905-http.log
          if-no-files-found: error
