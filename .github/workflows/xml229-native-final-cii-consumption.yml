name: XML229 Native Final to CII Mass Consumption (nonreleasing)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'converters/scripts/xml229_native_final_mass_binding.py'
      - 'converters/scripts/xml_to_cii2019_patched.py'
      - 'converters/scripts/xml_to_cii2019_runtime_custody.py'
      - 'converters/xml-cii-2019-standalone/{engine.js,invocation-builder.js}'
      - 'converters/xml-cii2019-core/xml229-native-cii-independent-reconciliation.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-{client,worker}.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-cii-candidate-run.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js'
      - 'docs/converters/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml229-native-final-mass-consumption.test.py'
      - 'tests/xml229-native-cii-independent-reconciliation.test.mjs'
      - 'tests/xml229-native-cii-real-cli-e2e.test.mjs'
      - '.github/workflows/xml229-native-final-cii-consumption.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python-source-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Python script compile and served mirror
        run: |
          python3 -m py_compile converters/scripts/{xml229_native_final_mass_binding.py,xml_to_cii2019_patched.py,xml_to_cii2019_runtime_custody.py}
          for f in xml229_native_final_mass_binding.py xml_to_cii2019_patched.py xml_to_cii2019_runtime_custody.py; do
            diff -u "converters/scripts/$f" "docs/converters/scripts/$f"
          done
      - name: Accepted kg into exact original owner and native RIGID pointer
        run: python3 tests/xml229-native-final-mass-consumption.test.py
  independent-js-cii-mass-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Separate independent CII parser, manifest and native Run status
        run: |
          node --check converters/xml-cii2019-core/xml229-native-cii-independent-reconciliation.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-cii-candidate-run.mjs
          node --check converters/xml-cii-2019-standalone/engine.js
          node --check converters/xml-cii-2019-standalone/invocation-builder.js
          node --check tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs
          node --test tests/xml229-native-cii-independent-reconciliation.test.mjs tests/xml229-native-cii-real-cli-e2e.test.mjs tests/xml229-run-hold-audit.test.mjs
      - name: Verify root and live-served modules are identical
        run: |
          for f in             converters/xml-cii2019-core/xml229-native-cii-independent-reconciliation.mjs             converters/xml-cii-2019-standalone/engine.js             converters/xml-cii-2019-standalone/invocation-builder.js             tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs             tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-cii-candidate-run.mjs             tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js; do
            diff -u "$f" "docs/$f"
          done
