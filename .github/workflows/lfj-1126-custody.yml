name: LFJ 1126 custody native Chromium acceptance
on:
  pull_request:
    branches:
      - lfj/1120-w2-unified-indexed-source
    paths:
      - 'lfj/runtime/unified-*'
      - '.github/workflows/lfj-1126-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-custody-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert tested source is literal proposed PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native browser setup
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve real source modules
        shell: bash
        run: |
          python3 -m http.server 4188 --bind 127.0.0.1 >/tmp/lfj-1126.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4188/lfj/runtime/unified-source-fault-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-1126.log
          exit 1
      - name: Original File/Blob Worker and source/selection positive control
        run: node lfj/runtime/unified-source-qualification.mjs
      - name: Exact native IndexedDB expired leases and restartable recovery faults
        run: node lfj/runtime/unified-source-fault-qualification.mjs
      - name: Source tree clean after qualification
        run: test -z "$(git status --porcelain)"
