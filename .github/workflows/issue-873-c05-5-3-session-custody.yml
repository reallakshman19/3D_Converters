name: Issue 873 C05.5.3 Session Custody Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.5.3 session custody contracts
        run: node --test tests/xml-cii-issue-873-session-custody.test.mjs
