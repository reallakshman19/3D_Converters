name: PSI116 Component Topology

on:
  pull_request:
    paths:
      - 'converters/scripts/xml_to_cii2019_contracted_direction.py'
      - 'converters/scripts/xml_to_cii2019.py'
      - 'converters/scripts/xml_to_cii2019_direction.py'
      - 'converters/scripts/xml_to_cii2019_patched.py'
      - 'tests/xml_to_cii_psi116_component_topology_regression.py'
      - 'tests/xml_to_cii_short_span_contraction_regression.py'
      - 'Benchmarks/1885Sjson/FirstpassXML'
      - '.github/workflows/psi116-component-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-topology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m py_compile \
            converters/scripts/xml_to_cii2019.py \
            converters/scripts/xml_to_cii2019_patched.py \
            converters/scripts/xml_to_cii2019_direction.py \
            converters/scripts/xml_to_cii2019_contracted_direction.py \
            tests/xml_to_cii_psi116_component_topology_regression.py

      - name: Component occurrence and 1885 regression
        run: python tests/xml_to_cii_psi116_component_topology_regression.py

      - name: Existing short-span regression
        run: python tests/xml_to_cii_short_span_contraction_regression.py

      - name: Generate real Firstpass CII
        run: |
          python converters/scripts/xml_to_cii2019_contracted_direction.py \
            --input Benchmarks/1885Sjson/FirstpassXML \
            --output /tmp/firstpass-component-topology.cii \
            --coords-mode first \
            --diagnostics-out /tmp/firstpass-component-topology.log
          test -s /tmp/firstpass-component-topology.cii
          grep -q 'PSI116 COMPONENT TOPOLOGY' /tmp/firstpass-component-topology.log
