name: XML229 Issue 364 Descriptor Gap Native
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/xml-cii-mds-restraint-closure.js'
      - 'converters/scripts/xml229_prefinal_restraints.py'
      - 'tests/xml229-description-only-restraint-gap-native.test.mjs'
      - '.github/workflows/xml229-issue364-descriptor-gap.yml'

jobs:
  descriptor-gap-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Description-only pre-Final plus emitted-CII witness
        run: node --test tests/xml229-description-only-restraint-gap-native.test.mjs
      - name: Datum offset, coordinate tolerance and staged NODETYPE mutation
        run: node --test tests/xml229-datum-node-type-mutation.test.mjs
      - name: Native independent Datum and configured NODETYPE replay
        run: python -m unittest discover -s tests -p test_xml229_datum_node_type_mutation.py -v
      - name: Existing original JSON transfer and native tamper negatives
        run: node --test tests/xml229-json-restraint-body-transfer.test.mjs
      - name: Exact original BM2 GT/ST source witness census
        run: python -m unittest discover -s tests -p test_xml229_bm2_old_support_ref.py -v
      - name: Exact PS-4131 source JSON/branch/gap witness audit
        run: python -m unittest discover -s tests -p test_xml229_ps4131_source_audit.py -v
      - name: Historical configurable support gap and axis contracts
        run: python converters/scripts/test_support_restraint.py
      - name: Historical support confidence mapper static rules
        run: node tests/xml-cii-support-confidence-static.test.js
      - name: Historical support confidence runtime resolution
        run: node tests/xml-cii-support-confidence-runtime-resolution.test.js
      - name: Historical multi-occurrence mapper trace (separate diagnostic)
        continue-on-error: true
        run: node tests/xml-cii-support-confidence-resolver-trace.test.js
