name: XML229 Issue 364 Descriptor Gap Native
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/xml-cii-mds-restraint-closure.js'
      - 'converters/scripts/xml229_prefinal_restraints.py'
      - 'tests/xml229-description-only-restraint-gap-native.test.mjs'
      - '.github/workflows/xml229-issue364-descriptor-gap.yml'

jobs:
  descriptor-gap-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Description-only pre-Final plus emitted-CII witness
        run: node --test tests/xml229-description-only-restraint-gap-native.test.mjs
      - name: Existing original JSON transfer and native tamper negatives
        run: node --test tests/xml229-json-restraint-body-transfer.test.mjs
      - name: Exact original BM2 GT/ST source witness census
        run: python -m unittest discover -s tests -p test_xml229_bm2_old_support_ref.py -v
