name: XML-CII GC-PW v1 Contract
on:
  pull_request:
    paths:
      - 'contracts/gc-pw-v1/**'
      - 'tests/gc-pw-v1*.test.mjs'
      - 'docs/architecture/gc-pw-v1.md'
      - '.github/workflows/xml-cii-gc-pw-contract.yml'
  workflow_dispatch:
jobs:
  contract-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run strict GC-PW contract oracles
        run: node --test tests/gc-pw-v1-contract.test.mjs
