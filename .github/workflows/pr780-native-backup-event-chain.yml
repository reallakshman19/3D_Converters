name: PR780 Worker Event Chain Pre-Edit Backup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr780-native-backup-event-chain.yml'

permissions:
  contents: write

jobs:
  native-backup:
    if: github.event.pull_request.number == 780 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Run repository-native event-chain backups
        shell: bash
        run: |
          set -euo pipefail
          marker='PR780 worker Preview search event-chain pre-edit backup'
          if grep -Fq "${marker}" .backups/log.json; then
            echo "Native event-chain backup marker already present; nothing to do."
            exit 0
          fi
          files=(
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-consolidated-review-v2.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-consolidated-review-v2.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-cii-zip.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-cii-zip.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-smart.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-smart.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js
          )
          for file in "${files[@]}"; do
            node utils/backup.js save "$file" "${marker}: $file"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "chore(pr780): record worker event-chain backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
