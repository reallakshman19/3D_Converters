name: XML CII Standalone Performance Batch A Qualification

on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-state.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf.js'
      - 'converters/xml-cii2019-core/support-mapping.js'
      - 'converters/xml-cii2019-core/support-mapping-config.js'
      - 'tests/xml-cii-standalone-master-perf.test.mjs'
      - 'tests/xml-cii-standalone-config-cache-custody.test.mjs'
      - 'tests/xml-cii-standalone-support-gap-equivalence.test.mjs'
      - '.github/workflows/xml-cii-standalone-perf-batch-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Batch A browser module syntax
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-state.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf.js
          node --check tests/xml-cii-standalone-master-perf.test.mjs
          node --check tests/xml-cii-standalone-config-cache-custody.test.mjs
          node --check tests/xml-cii-standalone-support-gap-equivalence.test.mjs

      - name: Qualify master runtime operation counts and restart custody
        run: node --test tests/xml-cii-standalone-master-perf.test.mjs

      - name: Guard cached support-config authority synchronization
        run: node --test tests/xml-cii-standalone-config-cache-custody.test.mjs

      - name: Prove support and GAP semantic equivalence
        run: node --test tests/xml-cii-standalone-support-gap-equivalence.test.mjs

      - name: Protect immutable InputXML CII core
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Fx 'converters/scripts/inputxml_to_cii2019.py'; then
            echo 'ERROR: immutable inputxml_to_cii2019.py is present in Batch A diff.' >&2
            exit 1
          fi
