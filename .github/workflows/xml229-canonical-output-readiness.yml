name: XML229 Canonical Verified Output Readiness
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml-cii-229-canonical-output-run-readiness.test.mjs'
      - 'tests/xml-cii-229-canonical-readiness-worker.test.mjs'
      - 'tests/xml-cii-229-live-preview-restoration.test.mjs'
      - 'tests/xml-cii-229-run-stage-truth.test.mjs'
      - 'tests/xml-cii-229-p4-weight-presentation-adapter.test.mjs'
      - '.github/workflows/xml229-canonical-output-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-worker-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Parse exact served modules
        run: |
          node --check tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js
          node --check tabs/xml-cii-2019-standalone/integration/xml229-verified-output-readiness.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-live-preview-restoration.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml229-canonical-output-header-badges.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js
      - name: Run canonical readiness, session and Run hold regression
        run: |
          node --test tests/xml-cii-229-canonical-output-run-readiness.test.mjs
          node --test tests/xml-cii-229-canonical-readiness-worker.test.mjs
          node --test tests/xml-cii-229-live-preview-restoration.test.mjs
          node --test tests/xml-cii-229-run-stage-truth.test.mjs
          node --test tests/xml-cii-229-p4-weight-presentation-adapter.test.mjs
          node --test tests/xml-cii-229-run-stage-truth-entrypoints.test.mjs
      - name: Verify source/docs asset parity
        run: |
          diff -u tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js docs/tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml229-canonical-output-header-badges.mjs docs/tabs/xml-cii-2019-standalone/ui-adapted/xml229-canonical-output-header-badges.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-verified-output-readiness.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-verified-output-readiness.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-live-preview-restoration.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-live-preview-restoration.mjs
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js
  existing-stages-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual app
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xml229-canonical-run-http.log 2>&1 &
      - name: Original Preview to Weight browser regression
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/xml-cii-229-four-real-masters-existing-workflow-browser.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-canonical-output-readiness-browser
          path: |
            ValidationRecords/xml229-*.json
            /tmp/xml229-canonical-run-http.log
          if-no-files-found: warn
          retention-days: 30
