name: Issue 980 Mode B Combined Node Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/xml-cii-2019-standalone/xml-cii-run-parity-evidence.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-run-parity-evidence.js'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js'
      - 'tests/xml-cii-mode-b-parity-node-custody.test.mjs'
      - '.github/workflows/issue-980-mode-b-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-node-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run combined Mode B node-custody regressions
        run: >-
          node --test
          tests/xml-cii-mode-b-parity-node-custody.test.mjs
          tests/xml-cii-weight-output-authority.test.mjs
      - name: Verify production/docs parity
        run: |
          cmp tabs/xml-cii-2019-standalone/xml-cii-run-parity-evidence.js docs/tabs/xml-cii-2019-standalone/xml-cii-run-parity-evidence.js
          cmp tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js docs/tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js
