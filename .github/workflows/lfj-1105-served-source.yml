name: LFJ 1108 U03 actual deployed docs source-value RED
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/qualification/provisional/served-source-session-qualification.mjs'
      - '.github/workflows/lfj-1105-served-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-served-real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal PR head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install precise real Chromium engine
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual docs publication root, never canonical source tree
        run: |
          (cd docs && python3 -m http.server 4184 --bind 127.0.0.1 >/tmp/lfj-1108-u03.log 2>&1) &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4184/lfj/served-durable-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-1108-u03.log
          exit 1
      - name: Exact docs-served native Worker IDB original-source-byte contract
        run: |
          git rev-parse HEAD
          node lfj/qualification/provisional/served-source-session-qualification.mjs
      - name: No tracked file modified
        run: test -z "$(git status --porcelain)"
