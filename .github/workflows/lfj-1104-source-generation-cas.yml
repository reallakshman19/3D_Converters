name: LFJ 1104 app-owned source generation CAS sink
on:
  pull_request:
    branches: [main, test/1104-a03-served-receiver-h1, feat/1104-i3-consumer-source-facts-receiver]
    paths:
      - 'lfj/consumers/3d-converters/source-generation-store*.mjs'
      - '.github/workflows/lfj-1104-source-generation-cas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-source-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require literal candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Full source-only CAS and actual receiver suite
        run: node --test lfj/consumers/3d-converters/source-generation-store.test.mjs lfj/consumers/3d-converters/source-facts-receiver.test.mjs
      - name: No source mutations
        run: test -z "$(git status --porcelain)"
