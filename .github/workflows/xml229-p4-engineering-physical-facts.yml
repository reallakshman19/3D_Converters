name: XML229 P4 Engineering physical FactRecords
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs'
      - 'tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs'
      - '.github/workflows/xml229-p4-engineering-physical-facts.yml'
permissions:
  contents: read
jobs:
  p4-positive-and-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify actual PR head and source/docs parity
        run: |
          git rev-parse HEAD
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs
          node --check tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs
      - name: Real XML dryrun and GC-PW positive/negative regression
        run: |
          node --test tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs tests/gc-pw-preview-worker-fact-port.test.mjs
