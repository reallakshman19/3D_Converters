name: XML229 P4 Engineering physical FactRecords
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js'
      - 'tests/xml-cii-229-p4-worker-held-weight-panel-browser.mjs'
      - 'tests/xml-cii-229-p4-native-run-gate.test.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-gate.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-gate.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a-fast.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a-fast.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-advisory.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-advisory.js'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs'
      - 'tests/xml-cii-229-p4-worker-held-blob-review-browser.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-physical-census-worker.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-original-physical-census-worker.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker-client.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker-client.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-session-orchestrator.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-session-orchestrator.mjs'
      - 'tests/xml-cii-229-p4-real-worker-weight-session-browser.mjs'
      - 'tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs'
      - '.github/workflows/xml229-p4-engineering-physical-facts.yml'
permissions:
  contents: read
jobs:
  p4-positive-and-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify actual PR head and source/docs parity
        run: |
          git rev-parse HEAD
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs
          node --check tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-fact-producer.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-original-physical-census-worker.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-original-physical-census-worker.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-gate.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-gate.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a-fast.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a-fast.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-advisory.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-advisory.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-run-gate.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-mode-a-fast.js
          node --check tests/xml-cii-229-p4-native-run-gate.test.mjs
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
          node --check tests/xml-cii-229-p4-worker-held-weight-panel-browser.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs
          node --check tests/xml-cii-229-p4-worker-held-blob-review-browser.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-original-physical-census-worker.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker-client.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker-client.mjs
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-session-orchestrator.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-session-orchestrator.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-engineering-worker-client.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-session-orchestrator.mjs
          node --check tests/xml-cii-229-p4-real-worker-weight-session-browser.mjs
      - name: Real XML dryrun and GC-PW positive/negative regression
        run: |
          node --test tests/xml-cii-229-p4-real-engineering-fact-producer.test.mjs tests/gc-pw-preview-worker-fact-port.test.mjs tests/xml-cii-229-p4-native-run-gate.test.mjs

  p4-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Native isolated Worker → canonical physical facts → GC-PW session
        run: |
          git rev-parse HEAD
          node tests/xml-cii-229-p4-real-worker-weight-session-browser.mjs
          node tests/xml-cii-229-p4-worker-held-blob-review-browser.mjs
          node tests/xml-cii-229-p4-worker-held-weight-panel-browser.mjs
