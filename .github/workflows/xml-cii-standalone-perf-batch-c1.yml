name: XML CII Standalone Performance Batch C1 Qualification

on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dom-sync.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf-evidence.js'
      - 'tests/xml-cii-standalone-render-scope.test.mjs'
      - 'tests/xml-cii-standalone-master-dom-sync.test.mjs'
      - 'tests/xml-cii-standalone-perf-evidence.test.mjs'
      - '.github/workflows/xml-cii-standalone-perf-batch-c1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Batch C1 module syntax
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dom-sync.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf-evidence.js
          node --check tests/xml-cii-standalone-render-scope.test.mjs
          node --check tests/xml-cii-standalone-master-dom-sync.test.mjs
          node --check tests/xml-cii-standalone-perf-evidence.test.mjs

      - name: Qualify fail-closed render-scope classification
        run: node --test tests/xml-cii-standalone-render-scope.test.mjs

      - name: Qualify master-local draft DOM sync
        run: node --test tests/xml-cii-standalone-master-dom-sync.test.mjs

      - name: Qualify aggregate performance evidence
        run: node --test tests/xml-cii-standalone-perf-evidence.test.mjs

      - name: Re-run Batch A authority gates
        run: |
          node --test tests/xml-cii-standalone-master-perf.test.mjs
          node --test tests/xml-cii-standalone-config-cache-custody.test.mjs
          node --test tests/xml-cii-standalone-support-gap-equivalence.test.mjs

      - name: Protect immutable InputXML CII core
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Fx 'converters/scripts/inputxml_to_cii2019.py'; then
            echo 'ERROR: immutable inputxml_to_cii2019.py is present in Batch C1 diff.' >&2
            exit 1
          fi
