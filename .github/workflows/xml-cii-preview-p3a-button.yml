name: Agent P P3-A Actual Preview Button
on:
  push:
    branches:
      - 'agent-p/1000-preview-button-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-button-session.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-button-session.js'
      - 'tests/browser/xml-cii-preview-p3a-button.html'
      - 'tests/xml-cii-preview-button-basis.test.mjs'
      - 'scripts/run-xml-cii-preview-p3a-button.mjs'
      - '.github/workflows/xml-cii-preview-p3a-button.yml'
jobs:
  actual-button:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full byte/master/override basis oracles and mirrored renderer
        run: |
          node --test tests/xml-cii-preview-button-basis.test.mjs \
            tests/xml-cii-preview-job-controller.test.mjs \
            tests/xml-cii-preview-facts-read-model.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Real button with rejected staging and synthetic owner-scale masters
        run: node scripts/run-xml-cii-preview-p3a-button.mjs
