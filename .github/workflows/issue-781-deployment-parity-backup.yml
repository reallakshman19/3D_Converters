name: Issue 781 Deployment Parity Native Backup

on:
  push:
    branches:
      - agent/issue-781-worker-weight-api-mapping-projection-20260930
    paths:
      - .github/workflows/issue-781-deployment-parity-backup.yml

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-781-worker-weight-api-mapping-projection-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save repository-native pre-edit backup
        run: |
          set -euo pipefail
          node utils/backup.js save tests/xml-cii-issue-776-deployment-parity.test.mjs "issue-781 worker Weight API cache-chain expectation"
          git add -f .backups
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(issue-781): backup deployment parity assertion'
          git push origin HEAD:agent/issue-781-worker-weight-api-mapping-projection-20260930
