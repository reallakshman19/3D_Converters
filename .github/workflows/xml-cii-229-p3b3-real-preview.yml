name: XML229 P3B.3 Actual 4 Preview original Worker
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-worker.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-execution.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-button-session.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'scripts/xml-cii-229-p3b3-authored-preview-browser.mjs'
      - '.github/workflows/xml-cii-229-p3b3-real-preview.yml'
      - 'tests/xml-cii-229-p3b3-owner-scope-failclosed.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin committed originals and code parity
        run: |
          echo "P3B3_HEAD=$(git rev-parse HEAD)"
          printf '6b2c8b01ab0ba6ec8e9e7c42eb4a719668ffd2dc4dbe4790d27cf426a1f60288  Benchmarks/1885Sjson/Sjson.json\n' | sha256sum --check -
          for name in \
            integration/xml229-preview-original-blob-worker.mjs \
            integration/xml229-preview-original-blob-execution.mjs; do
            diff -u "tabs/xml-cii-2019-standalone/$name" "docs/tabs/xml-cii-2019-standalone/$name"
          done
          for name in \
            xml-cii-adapted-preview-renderer-v7.js \
            xml-cii-adapted-preview-diagnostics-audit-v7.js \
            xml-cii-adapted-preview-facts-button-session.js \
            xml-cii-adapted-lfj-o1-intake.js; do
            diff -u "tabs/xml-cii-2019-standalone/ui-adapted/$name" "docs/tabs/xml-cii-2019-standalone/ui-adapted/$name"
          done
          node --check scripts/xml-cii-229-p3b3-authored-preview-browser.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-worker.mjs
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-execution.mjs
      - name: Reconciled original Owner/zone selection guard
        run: |
          node --test tests/xml-cii-229-p3b3-owner-scope-failclosed.test.mjs
      - name: Install real Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual authored app
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xml229-p3b3-http.log 2>&1 &
      - name: Click real 4 Preview and verify invalid replacement denies old rights
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/xml-cii-229-p3b3-authored-preview-browser.mjs
      - name: Preserve full original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-p3b3-authored-preview
          path: |
            ValidationRecords/xml229-p3b3-authored-preview.json
            /tmp/xml229-p3b3-http.log
          if-no-files-found: warn
          retention-days: 30
