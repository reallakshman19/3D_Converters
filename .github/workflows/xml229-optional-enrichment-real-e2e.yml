name: XML229 Optional Enrichment Real E2E
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/xml229-optional-enrichment-e2e.mjs'
      - 'scripts/xml229-optional-preview-chromium.mjs'
      - 'scripts/xml229-optional-xmlonly-ui-e2e.mjs'
      - '.github/workflows/xml229-optional-enrichment-real-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-optional-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - no-masters
          - missing-line-list
          - missing-piping-class
          - missing-mat-map
          - unassigned-regex
          - conflicting-regex
          - missing-rating
          - all-present
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact-head test source
        run: |
          git rev-parse HEAD
          node --check scripts/xml229-optional-enrichment-e2e.mjs
      - name: Real Python XML to CII plus independent 2019 syntax
        env:
          XML229_OPTIONAL_VARIANT: ${{ matrix.scenario }}
        run: node scripts/xml229-optional-enrichment-e2e.mjs
      - name: Upload source-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-optional-${{ matrix.scenario }}
          path: ValidationRecords/xml229-optional-enrichment-${{ matrix.scenario }}.json
          if-no-files-found: warn
          retention-days: 14
  chromium-preview-two-passes:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Actual EF05 Preview computation in Chromium
        run: node scripts/xml229-optional-preview-chromium.mjs
      - name: Upload source-safe review-pass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-optional-preview-chromium
          path: ValidationRecords/xml229-optional-preview-chromium.json
          if-no-files-found: warn
          retention-days: 14

  real-browser-xml-only-output:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve exact source build
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xml229-optional-browser-server.log 2>&1 &
      - name: Load EF05 original XML without uploading masters and download real CII
        run: node scripts/xml229-optional-xmlonly-ui-e2e.mjs
      - name: Preserve actual browser output and syntax receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-optional-xmlonly-browser-e2e
          path: |
            ValidationRecords/xml229-optional-xmlonly-ui-e2e.json
            ValidationRecords/xml229-optional-xmlonly-ui-syntax.json
          if-no-files-found: warn
          retention-days: 14
