name: Agent P Preview RED Diagnostic
on:
  push:
    branches:
      - agent-p/1000-preview-red-p0
  pull_request:
    paths:
      - tests/browser/xml-cii-preview-p0-red.html
      - scripts/run-xml-cii-preview-p0-red.mjs
      - .github/workflows/xml-cii-preview-p0-red.yml
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start exact-source static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/preview-p0-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/tests/browser/xml-cii-preview-p0-red.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview-p0-http.log
          exit 1
      - name: Reproduce original click with owner-scale synthetic masters
        env:
          PREVIEW_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/run-xml-cii-preview-p0-red.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-p-preview-p0-red-chromium
          path: |
            ValidationRecords/xml-cii-preview-p0-red.json
            /tmp/preview-p0-http.log
          if-no-files-found: warn
          retention-days: 30
