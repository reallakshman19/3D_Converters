name: Topo Node Registry Publication Recovery

on:
  pull_request:
    paths:
      - 'node-history/operations/**'
      - 'tests/fixtures/node-history/operations/**'
      - 'tests/node-history-registry-publication.test.mjs'
      - 'tests/node-history-registry-recovery.test.mjs'
      - 'tests/node-history-registry-operations-adversarial.test.mjs'
      - 'docs/architecture/topo-enriched-xml/te-015-registry-publication-recovery.md'
      - '.github/workflows/topo-node-registry-publication-recovery.yml'
  workflow_dispatch:

jobs:
  validate-registry-publication-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce TE-015 source bounds
        run: |
          files=(
            node-history/operations/registry-operations-common.js
            node-history/operations/registry-publication/registry-filesystem.js
            node-history/operations/registry-publication/registry-snapshot-io.js
            node-history/operations/registry-publication/registry-publication-authority.js
            node-history/operations/registry-publication/registry-publication-package.js
            node-history/operations/registry-publication/registry-publication.js
            node-history/operations/registry-recovery/registry-recovery.js
            tests/fixtures/node-history/operations/operations-fixture.mjs
            tests/node-history-registry-publication.test.mjs
            tests/node-history-registry-recovery.test.mjs
            tests/node-history-registry-operations-adversarial.test.mjs
          )
          for file in "${files[@]}"; do
            lines=$(wc -l < "$file")
            echo "$file: $lines"
            test "$lines" -le 300
          done
      - name: Syntax check TE-015 slice
        run: |
          node --check node-history/operations/registry-operations-common.js
          node --check node-history/operations/registry-publication/registry-filesystem.js
          node --check node-history/operations/registry-publication/registry-snapshot-io.js
          node --check node-history/operations/registry-publication/registry-publication-authority.js
          node --check node-history/operations/registry-publication/registry-publication-package.js
          node --check node-history/operations/registry-publication/registry-publication.js
          node --check node-history/operations/registry-recovery/registry-recovery.js
          node --check tests/fixtures/node-history/operations/operations-fixture.mjs
          node --check tests/node-history-registry-publication.test.mjs
          node --check tests/node-history-registry-recovery.test.mjs
          node --check tests/node-history-registry-operations-adversarial.test.mjs
      - name: Run TE-015 publication proof
        run: node --test tests/node-history-registry-publication.test.mjs
      - name: Run TE-015 recovery proof
        run: node --test tests/node-history-registry-recovery.test.mjs
      - name: Run TE-015 adversarial proof
        run: node --test tests/node-history-registry-operations-adversarial.test.mjs
      - name: Protect TE-005 registry foundation
        run: node --test tests/node-history-registry-foundation.test.mjs
      - name: Protect TE-012 registry bootstrap
        run: |
          node --test tests/node-history-registry-bootstrap.test.mjs
          node --test tests/fixtures/node-history/bootstrap/orchestrator-regressions.test.mjs
      - name: Protect TE-005 orchestrator regressions
        run: node --test tests/fixtures/node-history/registry/orchestrator-regressions.test.mjs
