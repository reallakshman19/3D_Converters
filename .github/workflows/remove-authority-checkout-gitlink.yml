name: Remove Authority Checkout Gitlink

on:
  pull_request:
    paths:
      - '.github/workflows/remove-authority-checkout-gitlink.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/sync-categorized-inputxml-authority
          fetch-depth: 0

      - name: Remove unintended checkout tree entry
        shell: bash
        run: |
          git rm -f XML_Compare_Utilities
          rm -f .github/workflows/remove-authority-checkout-gitlink.yml
          if git ls-files --stage XML_Compare_Utilities | grep -q .; then
            echo 'XML_Compare_Utilities remains tracked.' >&2
            exit 1
          fi

      - name: Commit clean authority scope
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(categorized): remove temporary authority checkout'
          git push origin HEAD:agent/sync-categorized-inputxml-authority
