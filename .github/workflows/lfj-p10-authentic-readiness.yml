name: LFJ P10 authentic original fixture and two-CSV readiness (author-only)
on:
  pull_request:
    paths:
      - '.github/workflows/lfj-p10-authentic-readiness.yml'
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/**'
      - 'Benchmarks/1885Sjson/**'
      - 'Benchmarks/1885_NC/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-original-source-readiness:
    name: authentic source + ledger + CSV readiness (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin raw commit and unmodified source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git status --porcelain
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify original fixtures and source oracle syntax
        run: |
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/firstpass-source-parity-oracle.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/large-authentic-source-parity-oracle.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-owner-large-manifest.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-metamorphic-source-attestation.test.mjs
      - name: Authentic Firstpass positive full ledger and both frozen CSV digests
        run: node --max-old-space-size=2048 lfj/qualification/experiments/consumer-sparse-b0-xml-match/firstpass-source-parity-oracle.mjs
      - name: Authentic 10.23 MB zero-match negative full ledger and both frozen CSV digests
        run: node --max-old-space-size=2048 lfj/qualification/experiments/consumer-sparse-b0-xml-match/large-authentic-source-parity-oracle.mjs
      - name: Original XML semantic metamorphic negatives (author regression, NOT independent #141)
        run: node --test lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-metamorphic-source-attestation.test.mjs
      - name: Owner 30/90 MB manifest validation negatives (NOT proof Owner inputs exist)
        run: node --test lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-owner-large-manifest.test.mjs
      - name: Explicit nonacceptance evidence
        run: |
          {
            echo '## LFJ P10 author fixture-readiness only'
            echo '- Checkout: ${{ github.event.pull_request.head.sha || github.sha }}'
            echo '- Authentic Firstpass: original positive and shipping CSV oracle'
            echo '- Authentic 10.23 MB: **negative zero-match** and shipping CSV oracle, NOT a real 30MB positive'
            echo '- Independent #141 full held-out semantic acceptance: **NOT PERFORMED**'
            echo '- Genuine Owner ~30 MB / distinct 90 MB: **NOT STAGED / NOT RUN**'
            echo '- Multi Owner zone positive and deployed Pages/Opera: **NOT ATTESTED**'
            echo '- Preview/Weight/Mode A/B/CII/release: **NOT AUTHORIZED**'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure no tracked fixture or source changed
        run: test -z "$(git status --porcelain)"
