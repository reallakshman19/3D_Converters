name: LFJ 1104 A04 source-only typed own-attributes preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/consumers/3d-converters/typed-own-attributes*.mjs'
      - '.github/workflows/lfj-1104-a04-typed-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-source-node-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal PR candidate head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Source-only R05 to typed R02 preflight tests
        run: node --test lfj/consumers/3d-converters/typed-own-attributes.test.mjs
      - name: Retain hermetic checkout
        run: test -z "$(git status --porcelain)"
