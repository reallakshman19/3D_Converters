name: T2.9 Controlled Source Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/t29-controlled-source.yml'
      - 'scripts/locate-vibration-t29-controlled-source.mjs'
      - 'scripts/extract-vibration-master-source.mjs'
      - 'scripts/vibration-master-source-register.mjs'
      - 'docs/Masters/Vibration/source-register.json'
      - 'ValidationRecords/VibrationMasters/t29-pf01-source-extraction-request-v1.json'
      - 'ValidationRecords/VibrationMasters/t29-pf01-source-contract-v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 3D Converters candidate
        uses: actions/checkout@v4

      - name: Checkout exact controlled EI source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: fb549185b9b27edc2379734240320a85c5bef9f6
          path: Common
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deterministic PDF text extractor
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Validate qualification scripts
        run: |
          node --check scripts/locate-vibration-t29-controlled-source.mjs
          node --check scripts/extract-vibration-master-source.mjs

      - name: Locate T2.9 on exact controlled bytes
        shell: bash
        run: |
          node scripts/locate-vibration-t29-controlled-source.mjs \
            'Common/EI - AVIFF Guidelines 2nd Edition.pdf' \
            --out "$RUNNER_TEMP/t29-controlled-locator.json"
          cat "$RUNNER_TEMP/t29-controlled-locator.json"

      - name: Attempt reviewer-selected T2.9 extraction
        shell: bash
        run: |
          set +e
          node scripts/extract-vibration-master-source.mjs \
            'Common/EI - AVIFF Guidelines 2nd Edition.pdf' \
            --request ValidationRecords/VibrationMasters/t29-pf01-source-extraction-request-v1.json \
            --out "$RUNNER_TEMP/t29-controlled-extraction.json" \
            --private-review-out "$RUNNER_TEMP/t29-controlled-private-review.txt"
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/t29-extraction-exit-code.txt"
          if [ "$code" -eq 0 ]; then
            cat "$RUNNER_TEMP/t29-controlled-extraction.json"
          else
            echo "T2.9 provisional reviewer selection did not reconcile; locator artifact remains authoritative navigation evidence only."
          fi

      - name: Upload controlled-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t29-controlled-source-pf01
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/t29-controlled-locator.json
            ${{ runner.temp }}/t29-controlled-extraction.json
            ${{ runner.temp }}/t29-controlled-private-review.txt
            ${{ runner.temp }}/t29-extraction-exit-code.txt

      - name: Enforce exact extraction gate
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/t29-extraction-exit-code.txt"
          code="$(cat "$RUNNER_TEMP/t29-extraction-exit-code.txt")"
          if [ "$code" -ne 0 ]; then
            echo "Controlled source located, but reviewer-selected extraction remains unresolved."
            exit "$code"
          fi
          test -f "$RUNNER_TEMP/t29-controlled-extraction.json"
          node - "$RUNNER_TEMP/t29-controlled-extraction.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.schema !== 'VibrationMasterSourceExtraction.v1') throw new Error('Unexpected extraction schema.');
          if (manifest.masterId !== 'EI_AVIFF.T2.9.VALVE_RECOVERY_FACTORS.v1') throw new Error('Unexpected master ID.');
          if (manifest.source.gitBlobSha1 !== 'sha1:9d3eccc56429411e17c07a579bdebbd13cb0bdc5') throw new Error('Controlled source blob mismatch.');
          if (manifest.source.sizeBytes !== 10348594) throw new Error('Controlled source size mismatch.');
          if (manifest.authority.masterValuesPublished !== false) throw new Error('Source extraction may not publish master values.');
          if (manifest.authority.screeningAuthority !== 'NOT_AUTHORIZED') throw new Error('Source extraction may not grant Screening authority.');
          console.log('T29_CONTROLLED_SOURCE_EXTRACTION=PASS');
          NODE
