name: Issue 776 XML-CII Authority Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # PR780_APPLY_JOB_START
  pr780-apply-worker-search:
    if: github.event.pull_request.number == 780 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic worker-search patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/requestGeneration != generation/requestGeneration !== generation/' scripts/pr780-apply-worker-search.py
          python3 scripts/pr780-apply-worker-search.py
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js
          node --test \
            tests/xml-cii-master-dataset-config.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-dataset-worker.test.mjs \
            tests/xml-cii-master-preview-worker-search.test.mjs \
            tests/xml-cii-master-worker-integration.test.mjs \
            tests/xml-cii-issue-776-deployment-parity.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf(xml-cii): move dataset Preview search off main thread"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
  # PR780_APPLY_JOB_END

  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Issue 776 focused regressions
        id: focused
        shell: bash
        run: |
          set +e
          node --test \
            tests/xml-cii-issue-776-benchmark-basis.test.mjs \
            tests/xml-cii-issue-776-topology-runtime.test.mjs \
            tests/xml-cii-issue-776-weight-review-authority.test.mjs \
            tests/xml-cii-issue-776-weight-acceptance-validation.test.mjs \
            tests/xml-cii-issue-776-regex-index-cache.test.mjs \
            tests/xml-cii-issue-776-b313-central-api-parity.test.mjs \
            tests/xml-cii-issue-776-weight-unit-custody.test.mjs \
            tests/xml-cii-issue-776-match1-provenance.test.mjs \
            tests/xml-cii-issue-776-match1-acceptance-paths.test.mjs \
            tests/xml-cii-issue-776-downstream-match1-validation.test.mjs \
            tests/xml-cii-issue-776-mode-a-weight-canonical-geometry.test.mjs \
            tests/xml-cii-issue-776-stale-match1-no-auto-rerank.test.mjs \
            tests/xml-cii-issue-776-stale-match1-review-ux.test.mjs \
            tests/xml-cii-issue-776-post-run-weight-authority.test.mjs \
            tests/xml-cii-issue-776-standalone-run-match1-custody.test.mjs \
            tests/xml-cii-issue-776-workflow-weight-master-revision.test.mjs \
            tests/xml-cii-issue-776-junction-enrichment-authority.test.mjs \
            tests/xml-cii-issue-776-mode-a-acceptance-label.test.mjs \
            tests/xml-cii-issue-776-mode-a-weight-canonical-geometry.test.mjs \
            tests/xml-cii-issue-776-flange-weight-geometry.test.mjs \
            tests/xml-cii-issue-776-deployment-parity.test.mjs \
            tests/xml-cii-mode-a-preview-restoration.test.mjs 2>&1 | tee issue-776-focused.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run PR780 master dataset regressions
        id: dataset
        shell: bash
        run: |
          set +e
          node --test \
            tests/xml-cii-master-dataset-config.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-dataset-worker.test.mjs \
            tests/xml-cii-master-worker-integration.test.mjs 2>&1 | tee issue-776-dataset-worker.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run adjacent authority regressions on PR head
        id: adjacent_head
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap \
            tests/xml-cii-smart-ui-preflight.test.mjs \
            tests/xml-cii-regex-confidence-buckets.test.mjs \
            tests/xml-cii-b313-preview-od-selection.test.mjs \
            tests/xml-cii-b313-preview-pressure-unit.test.mjs \
            tests/xml-cii-b313-preview-blocker-ui-static.test.mjs \
            tests/engineering-calculation-core.test.mjs 2>&1 | tee issue-776-adjacent-head.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Checkout PR base for adjacent baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: __issue776_base

      - name: Run adjacent authority regressions on PR base
        id: adjacent_base
        shell: bash
        working-directory: __issue776_base
        run: |
          set +e
          node --test --test-reporter=tap \
            tests/xml-cii-smart-ui-preflight.test.mjs \
            tests/xml-cii-regex-confidence-buckets.test.mjs \
            tests/xml-cii-b313-preview-od-selection.test.mjs \
            tests/xml-cii-b313-preview-pressure-unit.test.mjs \
            tests/xml-cii-b313-preview-blocker-ui-static.test.mjs \
            tests/engineering-calculation-core.test.mjs 2>&1 | tee ../issue-776-adjacent-base.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Classify adjacent regressions against baseline
        id: adjacent_diff
        if: always()
        shell: bash
        run: |
          set -u
          head_status="${{ steps.adjacent_head.outputs.status }}"
          base_status="${{ steps.adjacent_base.outputs.status }}"

          normalize_failures() {
            sed -nE 's/^[[:space:]]*not ok [0-9]+ - (.*)$/\1/p' "$1" \
              | sed -E 's/[[:space:]]+#.*$//' \
              | sort
          }

          normalize_failures issue-776-adjacent-head.log > issue-776-adjacent-head.failures.txt
          normalize_failures issue-776-adjacent-base.log > issue-776-adjacent-base.failures.txt
          comm -23 issue-776-adjacent-head.failures.txt issue-776-adjacent-base.failures.txt \
            > issue-776-adjacent-new.failures.txt

          status=0
          classification="head-pass"

          if [ "${head_status}" != "0" ]; then
            if [ ! -s issue-776-adjacent-head.failures.txt ]; then
              status=1
              classification="unclassified-head-failure"
            elif [ "${base_status}" = "0" ]; then
              status=1
              classification="new-head-failure"
            elif [ -s issue-776-adjacent-new.failures.txt ]; then
              status=1
              classification="new-failure-identity"
            else
              classification="baseline-only-failures"
            fi
          fi

          echo "Adjacent applicability: head=${head_status} base=${base_status} classification=${classification}"
          if [ -s issue-776-adjacent-new.failures.txt ]; then
            echo "New adjacent failures introduced by PR head:"
            cat issue-776-adjacent-new.failures.txt
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "classification=${classification}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-776-validation-logs
          path: |
            issue-776-focused.log
            issue-776-dataset-worker.log
            issue-776-adjacent-head.log
            issue-776-adjacent-base.log
            issue-776-adjacent-head.failures.txt
            issue-776-adjacent-base.failures.txt
            issue-776-adjacent-new.failures.txt
          if-no-files-found: error

      - name: Enforce applicable regression result
        if: always()
        shell: bash
        run: |
          echo "focused=${{ steps.focused.outputs.status }} dataset=${{ steps.dataset.outputs.status }} adjacent=${{ steps.adjacent_diff.outputs.status }} classification=${{ steps.adjacent_diff.outputs.classification }}"
          test "${{ steps.focused.outputs.status }}" = "0"
          test "${{ steps.dataset.outputs.status }}" = "0"
          test "${{ steps.adjacent_diff.outputs.status }}" = "0"

  wsw-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-776-http.log 2>&1 &
      - name: Run exact-head WSW browser conversion
        run: node scripts/run-xml-cii-issue-776-wsw-e2e.mjs
      - name: Upload WSW exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-776-wsw-e2e
          path: |
            ValidationRecords/xml-cii-issue-776-wsw-e2e.json
            /tmp/issue-776-http.log
          if-no-files-found: warn
