name: Issue 776 XML-CII Authority Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Issue 776 focused regressions
        id: focused
        shell: bash
        run: |
          set +e
          node --test \
            tests/xml-cii-issue-776-benchmark-basis.test.mjs \
            tests/xml-cii-issue-776-topology-runtime.test.mjs \
            tests/xml-cii-issue-776-weight-review-authority.test.mjs \
            tests/xml-cii-issue-776-weight-acceptance-validation.test.mjs \
            tests/xml-cii-issue-776-regex-index-cache.test.mjs \
            tests/xml-cii-issue-776-b313-central-api-parity.test.mjs \
            tests/xml-cii-issue-776-weight-unit-custody.test.mjs \
            tests/xml-cii-mode-a-preview-restoration.test.mjs 2>&1 | tee issue-776-focused.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Run adjacent authority regressions
        id: adjacent
        shell: bash
        run: |
          set +e
          node --test \
            tests/xml-cii-smart-ui-preflight.test.mjs \
            tests/xml-cii-regex-confidence-buckets.test.mjs \
            tests/xml-cii-b313-preview-od-selection.test.mjs \
            tests/xml-cii-b313-preview-pressure-unit.test.mjs \
            tests/xml-cii-b313-preview-blocker-ui-static.test.mjs \
            tests/engineering-calculation-core.test.mjs 2>&1 | tee issue-776-adjacent.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-776-validation-logs
          path: |
            issue-776-focused.log
            issue-776-adjacent.log
          if-no-files-found: error
      - name: Enforce regression result
        if: always()
        shell: bash
        run: |
          echo "focused=${{ steps.focused.outputs.status }} adjacent=${{ steps.adjacent.outputs.status }}"
          test "${{ steps.focused.outputs.status }}" = "0"
          test "${{ steps.adjacent.outputs.status }}" = "0"
