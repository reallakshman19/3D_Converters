name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outcome == 'success' && steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Prepare site
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='Benchmarks' \
            --exclude='docs' \
            --exclude='tests' \
            --exclude='.github' \
            . /tmp/site/
          touch /tmp/site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site'
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry GitHub Pages deploy
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment_retry
        uses: actions/deploy-pages@v4
      - name: Fail if GitHub Pages deploy did not succeed
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        run: exit 1
