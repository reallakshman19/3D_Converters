name: LFJ 1108 U03 provisional served closure (NOT docs publication)
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/qualification/provisional/stage-public-runtime.mjs'
      - '.github/workflows/lfj-1105-provisional-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-derived-served:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert immutable candidate checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage independent canonical ESM and Worker closure OUTSIDE repository
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d "${RUNNER_TEMP}/lfj-provisional-XXXXXX")"
          echo "LFJ_STAGE_ROOT=${stage_dir}" >> "${GITHUB_ENV}"
          node lfj/qualification/provisional/stage-public-runtime.mjs --stage-dir "${stage_dir}"
          cat "${stage_dir}/lfj/source-derived-staging-report.json"
          test ! -e docs/lfj/runtime/source-session.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve generated candidate (not authored docs tree)
        shell: bash
        run: |
          set -euo pipefail
          (cd "${LFJ_STAGE_ROOT}" && python3 -m http.server 4184 --bind 127.0.0.1 >/tmp/lfj-u03-staged.log 2>&1) &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4184/lfj/served-durable-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-u03-staged.log
          exit 1
      - name: Native Worker IDB and source-value from staged publication
        run: node lfj/qualification/provisional/served-source-session-qualification.mjs
      - name: Preserve provisional SHA inventory and honesty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfj-1105-provisional-source-derived-closure
          path: ${{ env.LFJ_STAGE_ROOT }}/lfj/source-derived-staging-report.json
          if-no-files-found: warn
      - name: Source files unchanged
        run: test -z "$(git status --porcelain)"
