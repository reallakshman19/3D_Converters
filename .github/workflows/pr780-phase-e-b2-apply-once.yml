name: PR780 phase E-B2 apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply metadata-only import custody
        run: python3 scripts/_pr780_phase_e_b2_apply.py
      - name: Syntax checks
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-mapping-events.js
      - name: Run applicable Phase E-B2 regressions
        run: |
          node --test \
            tests/xml-cii-master-dataset-ready-commit.test.mjs \
            tests/xml-cii-master-dataset-mapping-apply.test.mjs \
            tests/xml-cii-master-worker-metadata-import.test.mjs \
            tests/xml-cii-master-dataset-remap.test.mjs \
            tests/xml-cii-master-worker-integration.test.mjs \
            tests/xml-cii-master-dataset-config.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            tests/xml-cii-master-config-compaction.test.mjs \
            tests/xml-cii-master-run-config-compaction.test.mjs \
            tests/xml-cii-workflow-job-dataset-materialization.test.mjs \
            tests/xml-cii-readonly-consumer-dataset-config.test.mjs
      - name: Enforce source/docs parity
        shell: bash
        run: |
          cmp tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js
          cmp tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js
          cmp tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-mapping-events.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-mapping-events.js
      - name: Enforce file size policy
        shell: bash
        run: |
          test "$(wc -l < tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js)" -lt 300
          test "$(wc -l < tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-mapping-events.js)" -lt 300
          test "$(wc -l < tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js)" -lt 300
      - name: Commit protected Phase E-B2 result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_pr780_phase_e_b2_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-commit.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-mapping-events.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-mapping-events.js \
            tests/xml-cii-master-dataset-ready-commit.test.mjs \
            tests/xml-cii-master-dataset-mapping-apply.test.mjs \
            tests/xml-cii-master-worker-metadata-import.test.mjs \
            tests/xml-cii-master-worker-integration.test.mjs \
            scripts/_pr780_phase_e_b2_apply.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(xml-cii): keep imported datasets off main-thread row custody'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
