name: XML229 Weight Review Source Lease Navigation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'tests/xml-cii-229-review-session-live-basis.test.mjs'
      - '.github/workflows/xml229-weight-review-session-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-lease:
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify Weight live InputBasis on phase navigation
        run: |
          node --test tests/xml-cii-229-review-session-live-basis.test.mjs
          node --test tests/xml-cii-229-p263-integration-correction.test.mjs
      - name: Verify production served mirror
        run: diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js
