name: LFJ R03 source custody exact-head checks

on:
  pull_request:
    branches:
      - lfj/structured-data-plan-v4
      - main
    paths:
      - 'lfj/source/**'
      - '.github/workflows/lfj-r03-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-custody:
    name: R03 Node ${{ matrix.node }} exact-byte source oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record exact tested merge tree
        run: |
          echo "R03_TESTED_SHA=$(git rev-parse HEAD)"
          node --version
      - name: Execute independent R03 byte and revision oracles
        run: node --test lfj/source/*.test.mjs
      - name: Check tests leave source tree unchanged
        run: test -z "$(git status --porcelain)"
