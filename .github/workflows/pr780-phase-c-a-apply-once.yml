name: PR780 phase C-A apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Weight fingerprint authority slice
        run: python3 scripts/_pr780_phase_c_a_apply.py
      - name: Syntax checks
        run: |
          node --check converters/xml-cii2019-core/rigid-weight-authority.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js
      - name: Run applicable Phase C-A regressions
        run: |
          node --test \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            tests/xml-cii-issue-776-match1-provenance.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-issue-776-workflow-weight-master-revision.test.mjs
      - name: Commit protected Phase C-A result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_pr780_phase_c_a_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            converters/xml-cii2019-core/rigid-weight-authority.js \
            docs/converters/xml-cii2019-core/rigid-weight-authority.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            scripts/_pr780_phase_c_a_apply.py
          if git diff --cached --quiet; then
            echo 'No Phase C-A changes to commit.'
            exit 0
          fi
          git commit -m 'perf(xml-cii): preserve Weight authority without resident master rows'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
