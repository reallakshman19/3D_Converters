name: Issue 893 C05.6.2 Consumer Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-authority-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused authority and predecessor contracts
        run: |
          node --test \
            tests/xml-cii-issue-893-consumer-authority.test.mjs \
            tests/xml-cii-issue-858-hydrated-weight-match.test.mjs \
            tests/xml-cii-issue-882-session-precedence.test.mjs \
            tests/xml-cii-issue-883-restore-failure-identity.test.mjs \
            tests/xml-cii-workflow-job-dataset-materialization.test.mjs

  consumer-authority-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-893-http.log 2>&1 &
      - name: Run real three-master consumer authority lifecycle
        run: node scripts/run-xml-cii-issue-893-consumer-authority-e2e.mjs
      - name: Upload consumer authority receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-893-c05-6-2-consumer-authority
          path: |
            ValidationRecords/xml-cii-issue-893-consumer-authority.json
            /tmp/issue-893-http.log
          if-no-files-found: error
