name: LFJ V4.1 deployed docs Worker and mirror parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/lfj/**'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-json-hierarchy-scope.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-scope.js'
      - '.github/workflows/lfj-v41-deploy.yml'
  push:
    branches: [lfj/v41-served-resolver-deploy]
    paths:
      - 'docs/lfj/**'
      - '.github/workflows/lfj-v41-deploy.yml'
permissions:
  contents: read
jobs:
  source-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and deployed SHA parity for every module, UI scope mirror
        run: |
          git rev-parse HEAD
          node --test docs/lfj/deployment-parity.test.mjs
  real-browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve the ACTUAL docs/ deployment root
        run: |
          python3 -m http.server 4182 --bind 127.0.0.1 --directory docs >/tmp/lfj-v41-docs.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4182/lfj/served-worker-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-v41-docs.log
          exit 1
      - name: Confirm served ES module Worker and original-source SHA
        run: |
          git rev-parse HEAD
          node docs/lfj/served-worker-qualification.mjs
