name: LFJ 226 O1 W15 joint 100MiB plus 2m original boundary
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/lfj-226-o1-w15-joint-boundary-browser.mjs'
      - '.github/workflows/lfj-226-o1-w15-joint-boundary.yml'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-*.js'
      - 'tabs/xml-cii-2019-standalone/workers/lfj-o1-*.mjs'
      - 'lfj/ports/source-*.mjs'
      - 'lfj/index/source-occurrence-index.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'docs/lfj/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-maximum-source-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        route: [root-raw, docs-raw]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify pinned direct-main baseline and script syntax
        run: |
          test "$(git merge-base HEAD origin/main)" = "4f14beb37bc0b719453c52a116c1c5d7183d2fd0"
          node --check scripts/lfj-226-o1-w15-joint-boundary-browser.mjs
          echo "W15_HEAD=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for actual product Chromium route
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve original root + checked-in raw docs assets
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lfj226-w15-http.log 2>&1 &
      - name: Independently prove 104857600 original bytes AND 2000000 values then full Worker trace
        env:
          W15_ROUTE: ${{ matrix.route }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/lfj-226-o1-w15-joint-boundary-browser.mjs
      - name: Preserve red-or-green external input oracle and browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfj-226-o1-W15-${{ matrix.route }}
          path: |
            ValidationRecords/lfj-226-o1-W15-${{ matrix.route }}.json
            /tmp/lfj226-w15-http.log
          if-no-files-found: warn
          retention-days: 30
