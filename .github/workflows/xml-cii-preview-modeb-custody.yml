name: Agent P B3-A Mode B Source Custody
on:
  push:
    branches:
      - 'agent-p/1000-preview-modeb-source-custody-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-modeb-custody.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-modeb-custody.js'
      - 'tests/xml-cii-preview-modeb-custody.test.mjs'
      - '.github/workflows/xml-cii-preview-modeb-custody.yml'
      - 'scripts/run-xml-cii-preview-modeb-custody.mjs'
      - 'tests/browser/xml-cii-preview-modeb-custody.html'
jobs:
  attest-mode-b:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent original-source Mode B custody and existing source-oracle checks
        run: |
          node --test tests/xml-cii-preview-modeb-custody.test.mjs \
            tests/xml-cii-preview-facts-occurrence.test.mjs \
            tests/gc-pw-v1-contract.test.mjs
      - name: Install native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Launch static source server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p3b3-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/tests/browser/xml-cii-preview-modeb-custody.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/p3b3-http.log
          exit 1
      - name: Native browser Mode B per-source content and offset oracle
        run: node scripts/run-xml-cii-preview-modeb-custody.mjs
