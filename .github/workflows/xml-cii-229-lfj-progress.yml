name: XML CII 229 LFJ Honest Source Progress

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-progress.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-progress.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js'
      - 'tests/xml-cii-229-lfj-progress.test.mjs'
      - 'tests/xml-cii-229-lfj-progress-browser.mjs'
      - '.github/workflows/xml-cii-229-lfj-progress.yml'

permissions:
  contents: read

jobs:
  lfj-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify progress lifecycle has no false completion
        run: node --test tests/xml-cii-229-lfj-progress.test.mjs
      - name: Check root and served parity
        run: |
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-progress.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-progress.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Real authored LFJ source scan and corrupt replacement
        run: node tests/xml-cii-229-lfj-progress-browser.mjs
