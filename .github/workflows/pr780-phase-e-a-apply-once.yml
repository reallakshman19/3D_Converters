name: PR780 phase E-A apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply metadata-only startup restore
        run: python3 scripts/_pr780_phase_e_a_apply.py
      - name: Syntax checks
        run: |
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-store.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js
      - name: Run applicable Phase E-A regressions
        run: |
          node --test \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            tests/xml-cii-workflow-job-dataset-materialization.test.mjs \
            tests/xml-cii-readonly-consumer-dataset-config.test.mjs \
            tests/xml-cii-preview-dataset-operation.test.mjs \
            tests/xml-cii-output-run-metadata-readiness.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs
      - name: Commit protected Phase E-A result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_pr780_phase_e_a_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tabs/xml-cii-2019-standalone/workers/master-dataset-store.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-store.js \
            tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            scripts/_pr780_phase_e_a_apply.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(xml-cii): restore persisted masters as metadata-only custody'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
