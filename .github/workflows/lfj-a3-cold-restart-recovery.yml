name: LFJ A3 cold restart orphan custody and original full CSV recovery
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-cold-recovery.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-cold-recovery.test.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-db-cleanup.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js'
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-cold-restart-browser.mjs'
      - '.github/workflows/lfj-a3-cold-restart-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-generation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        node: [22,24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Web Lock and IDB custody syntax and negative tests
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-cold-recovery.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-cold-restart-browser.mjs
          node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-cold-recovery.test.mjs
          node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-cancel-cleanup.test.mjs
          node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.test.mjs
      - name: Git source unchanged
        run: test -z "$(git status --porcelain)"
  real-unclean-tab-restart-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install genuine Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve source-owned static original LFJ fixtures
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/lfj-cold-recovery.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-original.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-cold-recovery.log
          exit 1
      - name: Actually close active source-index tab, recover only orphan and re-verify both original CSVs
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-cold-restart-browser.mjs
      - name: Existing original UI indexed two CSV byte oracle
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-indexed-csv-browser.mjs
      - name: Git source unchanged
        run: test -z "$(git status --porcelain)"
