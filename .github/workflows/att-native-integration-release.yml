name: ATT Native H1-H5 Integration Qualification

on:
  pull_request:
    paths:
      - 'tabs/model-converters/**'
      - 'docs/tabs/model-converters/**'
      - 'converters/rmss-attribute-parser.js'
      - 'docs/converters/rmss-attribute-parser.js'
      - 'tests/model-converters/test-att-native-*.mjs'
      - 'scripts/att-native-aml-golden-check.mjs'
      - '.github/workflows/att-native-integration-release.yml'
  push:
    branches: [main]
    paths:
      - 'tabs/model-converters/att-native-*.js'
      - 'tabs/model-converters/legacy-adapter.js'
      - '.github/workflows/att-native-integration-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scope-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full-source mirror and runtime entry integrity
        run: |
          set -eu
          for f in tabs/model-converters/att-native-hierarchy-index.js tabs/model-converters/att-native-tree-projection.js tabs/model-converters/att-native-scope-selection.js tabs/model-converters/att-native-scope-popup.js tabs/model-converters/legacy-adapter.js tabs/model-converters/converters/rvmattr-to-xml.js tabs/model-converters/ModelConvertersTab.js tabs/model-converters/ModelConvertersTab-fbx2-managed-reference.js tabs/model-converters/index.js tabs/model-converters-tab.js converters/rmss-attribute-parser.js; do
            cmp "$f" "docs/$f"
          done
      - name: Full native H1-H5 and actual converter-output oracle
        run: |
          set -eu
          node --check tabs/model-converters/att-native-scope-popup.js
          node --check tabs/model-converters/att-native-scope-selection.js
          node --check tabs/model-converters/legacy-adapter.js
          node --check tabs/model-converters/converters/rvmattr-to-xml.js
          node --check scripts/att-native-aml-golden-check.mjs
          node tests/model-converters/test-att-native-hierarchy-index.mjs
          node tests/model-converters/test-att-native-tree-projection.mjs
          node tests/model-converters/test-att-native-scope-selection.mjs
          node tests/model-converters/test-att-native-conversion-scope.mjs
          node tests/model-converters/test-att-native-runtime-cache-chain.mjs
          node tests/model-converters/test-att-native-converter-outputs.mjs
          node tests/model-converters/test-rvmattr-scope-tree.mjs
      - name: Evidence boundary (private AML + native RVM remain unqualified)
        run: |
          echo "PASS: synthetic native hierarchy and ATT XML/JSON/STP selection parity"
          echo "UNKNOWN: 90MB owner AML Chromium result; selected binary RVM to REV"
