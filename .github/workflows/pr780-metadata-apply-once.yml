name: PR780 metadata consumer phase A apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch, validate, and push bounded phase A
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq 'perf(xml-cii): migrate metadata-only master consumers'; then
            echo 'Implementation commit observed; no-op.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          OLD = '20260929-pr780-worker-search-1'
          NEW = '20260929-pr780-metadata-1'

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              hits = text.count(old)
              if count is not None and hits != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, found {hits}')
              if not hits:
                  raise SystemExit(f'{path}: missing expected text {old!r}')
              p.write_text(text.replace(old, new))

          def mirror(path):
              src = Path(path)
              dst = Path('docs') / src
              dst.write_text(src.read_text())

          render_scope = Path('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js')
          text = render_scope.read_text()
          old_scope = '''function sameMasterRows(previous, next) {
            for (const key of ['lineRows', 'pipingClassRows', 'materialMapRows', 'weightMasterRows']) {
              if (previous?.[key] !== next?.[key]) return false;
            }
            for (const key of MASTER_KEYS) {
              if (previous?.rawRows?.[key] !== next?.rawRows?.[key]) return false;
              if (Number(previous?.appliedMappingRevision?.[key] || 0) !== Number(next?.appliedMappingRevision?.[key] || 0)) return false;
            }
            return true;
          }
          '''
          new_scope = '''const MASTER_ROW_KEYS = Object.freeze({
            lineList: 'lineRows',
            pipingClass: 'pipingClassRows',
            materialMap: 'materialMapRows',
            weight: 'weightMasterRows',
          });

          function datasetIdentity(context, key) {
            const ref = context?.datasetRefs?.[key];
            if (!ref?.datasetId) return '';
            return [
              String(ref.datasetId),
              Number(ref.rowCount || context?.rowCounts?.[key] || 0),
              String(ref.fileName || ''),
              String(ref.sheetName || ''),
              String(ref.persistence || ''),
            ].join('|');
          }

          function sameMasterRows(previous, next) {
            for (const key of MASTER_KEYS) {
              const previousDataset = datasetIdentity(previous, key);
              const nextDataset = datasetIdentity(next, key);
              if (previousDataset || nextDataset) {
                if (!previousDataset || previousDataset !== nextDataset) return false;
                if (Number(previous?.rowCounts?.[key] || 0) !== Number(next?.rowCounts?.[key] || 0)) return false;
              } else {
                const rowsKey = MASTER_ROW_KEYS[key];
                if (previous?.[rowsKey] !== next?.[rowsKey]) return false;
                if (previous?.rawRows?.[key] !== next?.rawRows?.[key]) return false;
              }
              if (Number(previous?.appliedMappingRevision?.[key] || 0) !== Number(next?.appliedMappingRevision?.[key] || 0)) return false;
            }
            return true;
          }
          '''
          if old_scope not in text:
              raise SystemExit('render-scope: expected sameMasterRows block not found')
          render_scope.write_text(text.replace(old_scope, new_scope))
          mirror(render_scope)

          diagnostics = Path('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js')
          text = diagnostics.read_text()
          old_counts = '''  const llCount = state.masterContext?.lineRows?.length || 0, pcCount = state.masterContext?.pipingClassRows?.length || 0;
            const matCount = state.masterContext?.materialMapRows?.length || 0, wtCount = state.masterContext?.weightMasterRows?.length || 0;'''
          new_counts = '''  const masterCounts = state.masterContext?.rowCounts || {};
            const llCount = Number(masterCounts.lineList ?? state.masterContext?.lineRows?.length ?? 0);
            const pcCount = Number(masterCounts.pipingClass ?? state.masterContext?.pipingClassRows?.length ?? 0);
            const matCount = Number(masterCounts.materialMap ?? state.masterContext?.materialMapRows?.length ?? 0);
            const wtCount = Number(masterCounts.weight ?? state.masterContext?.weightMasterRows?.length ?? 0);'''
          if old_counts not in text:
              raise SystemExit('diagnostics-audit: expected count block not found')
          diagnostics.write_text(text.replace(old_counts, new_counts))
          mirror(diagnostics)

          # Direct dependency cache keys for the changed modules.
          replace('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js',
                  'xml-cii-adapted-render-scope.js?v=20260818-perf-c1',
                  f'xml-cii-adapted-render-scope.js?v={NEW}', 1)
          mirror('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js')

          replace('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js',
                  "} from './xml-cii-adapted-preview-diagnostics-audit.js';",
                  f"}} from './xml-cii-adapted-preview-diagnostics-audit.js?v={NEW}';", 1)
          mirror('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js')

          # Active Mode-A warm-cache chain.
          chain = [
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js',
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js',
              'tabs/xml-cii-2019-standalone-tab.js',
              'core/app-standalone-runtime.js',
              'core/app.js',
              'main-rhbg-fitguard.js',
              'index.html',
          ]
          for path in chain:
              replace(path, OLD, NEW)
              mirror(path)

          deployment = Path('tests/xml-cii-issue-776-deployment-parity.test.mjs')
          d = deployment.read_text().replace(f"const release = '{OLD}';", f"const release = '{NEW}';")
          pair_anchor = '["tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js","docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js"]'
          extra_pairs = pair_anchor + ',["tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js","docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js"],["tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js","docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js"],["tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js","docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js"]'
          if pair_anchor not in d:
              raise SystemExit('deployment parity: pair anchor missing')
          d = d.replace(pair_anchor, extra_pairs, 1)
          deployment.write_text(d)

          render_test = Path('tests/xml-cii-standalone-render-scope.test.mjs')
          t = render_test.read_text()
          addition = '''

          test('dataset-backed authority ignores full row-array identity while preserving dataset/revision changes', () => {
            const previous = basis();
            previous.masterContext.datasetRefs = {
              lineList: { datasetId: 'ds-line-1', rowCount: 1, fileName: 'line.xlsx', sheetName: 'Line List', persistence: 'indexeddb' },
            };
            const next = draftOnlyNext(previous);
            next.masterContext.lineRows = [];
            next.masterContext.rawRows.lineList = [];
            assert.deepEqual(classifyXmlCiiRenderScope(previous, next), { kind: 'master-draft', masterKey: 'lineList' });

            const changedDataset = draftOnlyNext(previous);
            changedDataset.masterContext.datasetRefs = {
              ...previous.masterContext.datasetRefs,
              lineList: { ...previous.masterContext.datasetRefs.lineList, datasetId: 'ds-line-2' },
            };
            changedDataset.masterContext.lineRows = [];
            changedDataset.masterContext.rawRows.lineList = [];
            assert.equal(classifyXmlCiiRenderScope(previous, changedDataset).kind, 'full');
          });
          '''
          if 'dataset-backed authority ignores full row-array identity' in t:
              raise SystemExit('render-scope test already contains dataset-backed case')
          render_test.write_text(t.rstrip() + addition + '\n')

          replace('tests/cii-v11-v14-ui-static.test.mjs', OLD, NEW, 1)
          replace('tests/fbx/test-fbx2-runtime-cache-chain.mjs', OLD, NEW, 1)
          PY

          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js
          node --check tabs/xml-cii-2019-standalone-tab.js
          node --check core/app-standalone-runtime.js
          node --check core/app.js
          node --check main-rhbg-fitguard.js
          node --test tests/xml-cii-standalone-render-scope.test.mjs tests/xml-cii-issue-776-deployment-parity.test.mjs

          python3 - <<'PY'
          from pathlib import Path
          src = Path('tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js').read_text()
          assert 'masterContext?.rowCounts' in src
          assert 'masterCounts.lineList ?? state.masterContext?.lineRows?.length' in src
          for path in [
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js',
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js',
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js',
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js',
              'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js',
              'tabs/xml-cii-2019-standalone-tab.js', 'core/app-standalone-runtime.js', 'core/app.js',
              'main-rhbg-fitguard.js', 'index.html',
          ]:
              assert Path(path).read_text() == (Path('docs') / path).read_text(), path
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js \
            tabs/xml-cii-2019-standalone-tab.js docs/tabs/xml-cii-2019-standalone-tab.js \
            core/app-standalone-runtime.js docs/core/app-standalone-runtime.js \
            core/app.js docs/core/app.js \
            main-rhbg-fitguard.js docs/main-rhbg-fitguard.js \
            index.html docs/index.html \
            tests/xml-cii-standalone-render-scope.test.mjs \
            tests/xml-cii-issue-776-deployment-parity.test.mjs \
            tests/cii-v11-v14-ui-static.test.mjs \
            tests/fbx/test-fbx2-runtime-cache-chain.mjs
          git commit -m 'perf(xml-cii): migrate metadata-only master consumers'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
