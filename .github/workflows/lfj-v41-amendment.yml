name: LFJ V4.1 STORE and DEPLOY additive gate authority
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/governance/amendments/v4.1-store-deploy.json'
      - '.github/workflows/lfj-v41-amendment.yml'
      - 'lfj/governance/structured-data-v4.execution-graph.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-programme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original V3.2 graph and separately authorize additional vetoes
        run: |
          python3 lfj/governance/pinned-v32/delp_projection_v32.py validate-graph --graph lfj/governance/structured-data-v4.execution-graph.json
          python3 lfj/governance/pinned-v32/delp_projection_v32.py decompose-check --graph lfj/governance/structured-data-v4.execution-graph.json --mode ENFORCED --json > /tmp/decompose-v41.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          g=json.loads(Path('lfj/governance/structured-data-v4.execution-graph.json').read_text())
          a=json.loads(Path('lfj/governance/amendments/v4.1-store-deploy.json').read_text())
          d=json.loads(Path('/tmp/decompose-v41.json').read_text())
          p=g['programme']['decomposition_proposal']
          assert a['schema']=='LFJ.V4.1.OwnerApprovedGateAmendment.v1'
          assert a['record_type']=='VERSIONED_ADDITIVE_RELEASE_GATES'
          assert a['ancestor']['released_proposal_digest']==p['released_proposal_digest']
          assert a['ancestor']['graph_git_blob']==subprocess.check_output(['git','hash-object','lfj/governance/structured-data-v4.execution-graph.json'],text=True).strip()
          assert g['programme']['total_weight']==130 and len(p['responsibilities'])==24
          assert sum(q['weight'] for r in p['responsibilities'] for q in r['claim_allocations'])==130
          assert a['points_policy']['allocated_to_new_gates']==0
          assert d['release_state']=='RELEASEABLE' and d['summary']['not_releasable']==0
          assert sorted(x['id'] for x in a['gates'])==['DEPLOY-GATE','STORE-GATE']
          sourcepaths=[w for r in p['responsibilities'] for w in r['write_surface']]
          gates=a['gates']
          def overlap(p,q):
              p=p.removesuffix('/**').removesuffix('/')
              q=q.removesuffix('/**').removesuffix('/')
              return p==q or p.startswith(q+'/') or q.startswith(p+'/')
          all_gate_paths=[s for gate in gates for s in gate['write_surface']]
          for path in all_gate_paths:
              assert not any(overlap(path,q) for q in sourcepaths),f'original writer conflict: {path}'
          for i,p0 in enumerate(all_gate_paths):
              assert not any(overlap(p0,q) for q in all_gate_paths[i+1:]),f'new gate writer conflict: {p0}'
          assert all(gate['completion']=='NOT_VERIFIED' for gate in gates)
          assert all(x['writer_authorization']=='REQUIRES_FURTHER_VERSIONED_AMENDMENT' for x in a['unresolved'])
          print('V4.1_GATE_ADMISSION: PASS (2 distinct zero-weight release vetoes)')
          print('V3.2_ORIGINAL_RELEASE:',d['release_state'],d['proposal_digest'])
          print('V4.1_STORAGE_AND_DEPLOY_PRODUCT: NOT_VERIFIED')
          PY
