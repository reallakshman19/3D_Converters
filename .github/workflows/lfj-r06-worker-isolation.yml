name: LFJ R06 Worker-required execution isolation
on:
  push:
    branches: ['lfj/r06-worker-isolation']
    paths:
      - 'lfj/transport/execution/**'
      - '.github/workflows/lfj-r06-worker-isolation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lfj/transport/execution/**'
      - '.github/workflows/lfj-r06-worker-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  required-worker:
    name: R06 Node ${{ matrix.node }} strict WorkerThreads source admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Attest exact Worker execution tested source
        run: |
          echo "R06_TESTED_SHA=$(git rev-parse HEAD)"
          node --version
      - name: Independent U01 off-main Worker and no-fallback negatives
        run: node --test lfj/transport/execution/*.test.mjs
      - name: Verify no test source side effects
        run: test -z "$(git status --porcelain)"
