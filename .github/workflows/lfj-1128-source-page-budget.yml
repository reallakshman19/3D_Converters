name: LFJ 1128 source page byte/count contract RED
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/qualification/provisional/source-page-wire-budget.test.mjs'
      - '.github/workflows/lfj-1128-source-page-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-page-native-node:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal tested commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Independent original-source RED on actual Worker and R05 source
        run: node --test lfj/qualification/provisional/source-page-wire-budget.test.mjs
      - name: No production/source changes during RED
        run: test -z "$(git status --porcelain)"
