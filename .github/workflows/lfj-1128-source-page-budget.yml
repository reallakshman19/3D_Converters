name: LFJ 1128 R05-R10 exact source page count and bytes
on:
  pull_request:
    branches: [main, lfj/1120-w2-unified-indexed-source]
    paths:
      - 'lfj/qualification/provisional/source-page-wire-budget.test.mjs'
      - 'lfj/index/**'
      - 'lfj/ports/**'
      - '.github/workflows/lfj-1128-source-page-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-page-native-node:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal tested commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Independent original-source count/UTF8 byte regression
        run: node --test lfj/qualification/provisional/source-page-wire-budget.test.mjs
      - name: Full R05 original byte/identity/revision/pointer native Node suite
        run: node --test lfj/index/*.test.mjs
      - name: Full R10 source port and selected-worker parity native Node suite
        run: node --test lfj/ports/*.test.mjs
      - name: Source tree unchanged after exact-head native tests
        run: test -z "$(git status --porcelain)"
