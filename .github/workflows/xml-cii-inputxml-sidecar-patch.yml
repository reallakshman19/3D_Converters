name: XML CII InputXML Sidecar Guarded Patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/xml-cii-inputxml-sidecar-workpack-patch.py'
      - '.github/workflows/xml-cii-inputxml-sidecar-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Work Pack branch
        uses: actions/checkout@v4
        with:
          ref: agent/xml-to-cii-inputxml-sidecar-audit-fix
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Apply exact patch
        run: |
          python -m py_compile scripts/xml-cii-inputxml-sidecar-workpack-patch.py
          python scripts/xml-cii-inputxml-sidecar-workpack-patch.py
      - name: Syntax and structure checks
        run: |
          node --check converters/xml-cii-inputxml-sidecar-worker.js
          node --check converters/py-worker.js
          node --check tabs/model-converters/xml-cii-inputxml-sidecar-diagnostics-panel.js
          node --check tabs/model-converters/ModelConvertersTab.js
          node --check tests/xml-cii-inputxml-sidecar-workpack.test.js
          python -m py_compile converters/scripts/xml_to_inputxml_debug.py
          python -m py_compile converters/scripts/xml_to_cii_inputxml_sidecar_diagnostics.py
          test "$(wc -l < converters/xml-cii-inputxml-sidecar-worker.js)" -lt 300
          test "$(wc -l < tabs/model-converters/xml-cii-inputxml-sidecar-diagnostics-panel.js)" -lt 300
          test "$(wc -l < converters/scripts/xml_to_cii_inputxml_sidecar_diagnostics.py)" -lt 300
      - name: Focused sidecar contracts
        run: |
          node tests/xml-cii-inputxml-sidecar-workpack.test.js
          python -m pytest -q \
            converters/scripts/test_xml_to_cii_inputxml_sidecar_workpack.py \
            converters/scripts/test_xml_to_inputxml_debug.py
      - name: Commit audited implementation and remove scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add converters/py-worker.js \
            converters/scripts/xml_to_inputxml_debug.py \
            tabs/model-converters/ModelConvertersTab.js
          git rm -f scripts/xml-cii-inputxml-sidecar-workpack-patch.py \
            .github/workflows/xml-cii-inputxml-sidecar-patch.yml
          git diff --cached --check
          git commit -m "fix: expose XML to CII InputXML sidecar parity"
          git push origin HEAD:agent/xml-to-cii-inputxml-sidecar-audit-fix
