name: XML229 Historical Weight UI with verified GC-PW
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-row-adapter.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-source-weight-bulk-review.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml229-source-weight-bulk-review.mjs'
      - 'tests/xml-cii-229-qualified-blank-bulk-confirmation.test.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml229-p4-weight-review-presentation.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-p4-verified-weight-panel.js'
      - 'tests/xml-cii-229-original-weight-ui-wiring.test.mjs'
      - '.github/workflows/xml229-original-weight-ui-wiring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-proof-and-13-column-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: |
          node --test tests/xml-cii-229-qualified-blank-bulk-confirmation.test.mjs
          node --test tests/xml-cii-229-original-weight-ui-wiring.test.mjs
          node --test tests/xml-cii-229-p4-weight-presentation-adapter.test.mjs
          node --test tests/xml-cii-229-engineering-basis-authority.test.mjs
          node --test tests/gc-pw-v1-occurrence-bridge.test.mjs
      - name: Validate root/served parity
        run: |
          diff -qr tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-row-adapter.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-verified-weight-row-adapter.mjs
          diff -qr tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-worker.mjs
          diff -qr tabs/xml-cii-2019-standalone/integration/xml229-source-weight-bulk-review.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-source-weight-bulk-review.mjs
          diff -qr tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-original-blob-gcpw-client.mjs
