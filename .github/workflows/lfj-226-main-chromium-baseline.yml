name: LFJ 226 O1 exact-main Chromium baseline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/browser/lfj-226-main-baseline.html'
      - 'scripts/lfj-226-main-chromium-baseline.mjs'
      - '.github/workflows/lfj-226-main-chromium-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-and-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 8
      - name: Exact source and Node
        run: |
          echo "LFJ226_TESTED_SHA=$(git rev-parse HEAD)"
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "4f14beb37bc0b719453c52a116c1c5d7183d2fd0"
          git diff --name-only origin/main...HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check baseline script syntax
        run: node --check scripts/lfj-226-main-chromium-baseline.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start exact-head HTTP host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lfj226-http.log 2>&1 &
          echo $! > /tmp/lfj226-http.pid
      - name: Real standalone File upload, source trace, CSV and frame/memory timing
        run: node scripts/lfj-226-main-chromium-baseline.mjs
      - name: Attach baseline, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfj-226-exact-main-chromium-baseline
          path: |
            ValidationRecords/lfj-226-main-browser-baseline.json
            /tmp/lfj226-http.log
          if-no-files-found: warn
          retention-days: 30
