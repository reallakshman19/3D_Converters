name: XML229 Ledger Architecture Safety Model (NONPRODUCTION)

on:
  pull_request:
    paths:
      - 'tests/xml229_ledger_architecture_model.py'
      - 'tests/test_xml229_ledger_architecture_contract.py'
      - '.github/workflows/xml229-ledger-architecture-contract.yml'
      - 'docs/architecture/xml229-canonical-support-ownership-ledger-rfc.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable-model-safety-properties:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Label architectural evidence as NONPRODUCTION
        run: |
          echo "SAFETY_MODEL_ONLY: synthetic source and abstract CII fields"
          echo "NOT a deployed XML229 verifier; NOT Owner 21-claim replay"
          echo "No .cii release authority"
      - name: Compile isolated reference model
        run: |
          python -m py_compile tests/xml229_ledger_architecture_model.py tests/test_xml229_ledger_architecture_contract.py
      - name: Positive + adversarial ledger safety model
        run: python -m unittest discover -s tests -p 'test_xml229_ledger_architecture_contract.py' -v
