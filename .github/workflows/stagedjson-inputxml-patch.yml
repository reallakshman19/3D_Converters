name: StagedJSON InputXML Guarded Patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/stagedjson-inputxml-workpack-patch.py'
      - 'scripts/repair-stagedjson-inputxml-patch.py'
      - '.github/workflows/stagedjson-inputxml-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Work Pack branch
        uses: actions/checkout@v4
        with:
          ref: agent/stagedjson-inputxml-audit-fix
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          npm ci --omit=dev
          python -m pip install --disable-pip-version-check pytest
      - name: Validate and apply exact patch
        id: exact_patch
        shell: bash
        run: |
          set +e
          {
            python -m py_compile scripts/repair-stagedjson-inputxml-patch.py scripts/stagedjson-inputxml-workpack-patch.py &&
            python scripts/repair-stagedjson-inputxml-patch.py &&
            python -m py_compile scripts/stagedjson-inputxml-workpack-patch.py &&
            python scripts/stagedjson-inputxml-workpack-patch.py
          } > stagedjson-inputxml-patch.log 2>&1
          status=$?
          cat stagedjson-inputxml-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact-patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stagedjson-inputxml-patch-log
          path: stagedjson-inputxml-patch.log
      - name: Enforce exact-patch success
        if: steps.exact_patch.outputs.status != '0'
        run: exit 1
      - name: Syntax checks
        id: syntax_checks
        shell: bash
        run: |
          set +e
          {
            python -m py_compile \
              converters/scripts/inputxml_bookmark.py \
              converters/scripts/stagedjson_inputxml_diagnostics.py \
              converters/scripts/stagedjson_to_inputxml.py \
              converters/scripts/test_stagedjson_inputxml_workpack.py &&
            node --check converters/invocation-builder.js &&
            node --check converters/py-worker.js &&
            node --check tabs/model-converters/converter-registry.js &&
            node --check tabs/model-converters/ModelConvertersTab.js &&
            node --check tabs/model-converters/stagedjson-inputxml-diagnostics-panel.js &&
            node --check tests/stagedjson-inputxml-workpack.test.js
          } > stagedjson-inputxml-syntax.log 2>&1
          status=$?
          cat stagedjson-inputxml-syntax.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload syntax log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stagedjson-inputxml-syntax-log
          path: stagedjson-inputxml-syntax.log
      - name: Enforce syntax success
        if: steps.syntax_checks.outputs.status != '0'
        run: exit 1
      - name: Focused authority and integration tests
        id: focused_tests
        shell: bash
        run: |
          set +e
          {
            python -m pytest -q converters/scripts/test_stagedjson_inputxml_workpack.py &&
            python converters/scripts/test_coord_transform.py &&
            python converters/scripts/test_chain_g4_g5.py &&
            node tests/stagedjson-inputxml-workpack.test.js
          } > stagedjson-inputxml-focused-tests.log 2>&1
          status=$?
          cat stagedjson-inputxml-focused-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stagedjson-inputxml-focused-test-log
          path: stagedjson-inputxml-focused-tests.log
      - name: Enforce focused-test success
        if: steps.focused_tests.outputs.status != '0'
        run: exit 1
      - name: Commit audited capability and remove scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add converters/scripts/inputxml_bookmark.py \
            converters/scripts/stagedjson_inputxml_diagnostics.py \
            converters/scripts/stagedjson_to_inputxml.py \
            converters/scripts/test_stagedjson_inputxml_workpack.py \
            converters/invocation-builder.js \
            converters/py-worker.js \
            tabs/model-converters/converter-registry.js \
            tabs/model-converters/ModelConvertersTab.js \
            tabs/model-converters/stagedjson-inputxml-diagnostics-panel.js \
            tests/stagedjson-inputxml-workpack.test.js
          git rm -f scripts/stagedjson-inputxml-workpack-patch.py scripts/repair-stagedjson-inputxml-patch.py .github/workflows/stagedjson-inputxml-patch.yml
          git diff --cached --check
          git commit -m "fix: harden StagedJSON InputXML generation"
          git push origin HEAD:agent/stagedjson-inputxml-audit-fix
