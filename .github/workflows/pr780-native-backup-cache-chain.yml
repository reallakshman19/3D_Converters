name: PR780 Search Cache Chain Pre-Edit Backup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr780-native-backup-cache-chain.yml'

permissions:
  contents: write

jobs:
  native-backup:
    if: github.event.pull_request.number == 780 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Run repository-native cache-chain backups
        shell: bash
        run: |
          set -euo pipefail
          marker='PR780 worker Preview search cache-chain pre-edit backup'
          if grep -Fq "${marker}" .backups/log.json; then
            echo "Native cache-chain backup marker already present; nothing to do."
            exit 0
          fi
          files=(
            tabs/xml-cii-2019-standalone-tab.js
            docs/tabs/xml-cii-2019-standalone-tab.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-smart.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-smart.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
            tests/xml-cii-issue-776-deployment-parity.test.mjs
          )
          for file in "${files[@]}"; do
            node utils/backup.js save "$file" "${marker}: $file"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "chore(pr780): record search cache-chain backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
