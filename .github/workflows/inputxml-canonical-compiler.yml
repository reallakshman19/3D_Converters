name: InputXML Canonical Compiler

on:
  pull_request:
    paths:
      - 'contracts/inputxml/v1/**'
      - 'docs/inputxml/**'
      - 'scripts/inputxml_canonical_compiler.py'
      - 'scripts/inputxml_compiler/**'
      - 'scripts/validate-inputxml-contract-catalogs.py'
      - 'scripts/validate-inputxml-schema-suite.py'
      - 'tests/test_inputxml_canonical_compiler*.py'
      - 'tests/test_inputxml_family_profiles.py'
      - 'tests/test_inputxml_family_review_regressions.py'
      - 'tests/test_inputxml_contract_bundle_gate.py'
      - 'tests/test_inputxml_compiler_state_machine.py'
      - 'tests/test_inputxml_resolver_contract.py'
      - 'tests/test_inputxml_publication.py'
      - 'tests/test_inputxml_deterministic_serialization.py'
      - 'tests/test_inputxml_deterministic_hash_golden.py'
      - 'tests/test_inputxml_xml_builder_adapter.py'
      - 'tests/test_inputxml_seljson_adapter.py'
      - 'tests/test_inputxml_root_topology_strict.py'
      - 'tests/test_inputxml_topology_*.py'
      - 'tests/strict-root-topology.test.cjs'
      - 'tests/test_inputxml_managed_stage_adapter.py'
      - 'tests/test_inputxml_pdf_input_echo_adapter.py'
      - 'tests/test_inputxml_uxml_rvm_adapter.py'
      - 'tests/xml-cii-node-to-inputxml-core.test.js'
      - 'tests/component-topology-*.test.*'
      - 'tabs/model-converters/xml-cii-node-to-inputxml-*.js'
      - 'tabs/model-converters/converters/component-topology/**'
      - 'tabs/stagedjson-to-enrichxml/**'
      - 'converters/scripts/pdf_to_inputxml*.py'
      - 'converters/scripts/pdf_to_inputxml_profiles.json'
      - 'converters/xml-cii2019-core/custom-input-*.js'
      - 'converters/xml-cii2019-core/restraint-type-*.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-inputxml-enrichment.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-types.js'
      - 'uxml/**'
      - 'rvm-pcf-extract/**'
      - '.github/workflows/inputxml-canonical-compiler.yml'
  workflow_dispatch:

jobs:
  validate-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XML and PDF validation runtime
        run: python -m pip install --disable-pip-version-check lxml==5.4.0 pypdf==5.4.0
      - name: Validate merged field and component catalogs
        run: python scripts/validate-inputxml-contract-catalogs.py
      - name: Validate merged XSD, Schematron, registry, and golden corpus
        run: python scripts/validate-inputxml-schema-suite.py
      - name: Validate strict Root topology engine
        run: |
          node --check scripts/inputxml_compiler/node_xml_builder_bridge.cjs
          node --check scripts/inputxml_compiler/strict_root_topology.cjs
          node tests/strict-root-topology.test.cjs
          node tests/xml-cii-node-to-inputxml-core.test.js
      - name: Validate authoritative managed-stage component topology engine
        run: |
          node --check scripts/inputxml_compiler/node_managed_stage_bridge.mjs
          node tests/component-topology-static.test.js
          node tests/component-topology-support-policy.test.mjs
      - name: Validate compiler architecture and adapter syntax
        run: |
          python -m py_compile \
            converters/scripts/pdf_to_inputxml.py \
            scripts/inputxml_compiler/family_profiles.py \
            scripts/inputxml_compiler/family_resolution.py \
            scripts/inputxml_compiler/family_accounting.py \
            scripts/inputxml_compiler/family_counts.py \
            scripts/inputxml_compiler/family_auxiliary.py \
            scripts/inputxml_compiler/family_element.py \
            scripts/inputxml_compiler/family_categorized.py \
            scripts/inputxml_compiler/family_resolver.py \
            scripts/inputxml_compiler/topology_profiles.py \
            scripts/inputxml_compiler/topology_diagnostics.py \
            scripts/inputxml_compiler/topology_inventory.py \
            scripts/inputxml_compiler/topology_source.py \
            scripts/inputxml_compiler/topology_bridge.py \
            scripts/inputxml_compiler/topology_engineering.py \
            scripts/inputxml_compiler/topology_components.py \
            scripts/inputxml_compiler/topology_candidate.py \
            scripts/inputxml_compiler/topology_candidate_policy.py \
            scripts/inputxml_compiler/topology_accounting.py \
            scripts/inputxml_compiler/topology_resolver.py \
            scripts/inputxml_compiler/pdf_input_echo.py \
            scripts/inputxml_compiler/pdf_input_echo_bindings.py \
            scripts/inputxml_compiler/uxml_rvm.py \
            scripts/inputxml_compiler/contract_bundle.py \
            scripts/inputxml_compiler/state_machine.py \
            scripts/inputxml_compiler/resolver_contract.py \
            scripts/inputxml_compiler/dispatcher.py \
            scripts/inputxml_compiler/compiler.py \
            scripts/inputxml_compiler/serialization_policy.py \
            scripts/inputxml_compiler/serialization.py \
            scripts/inputxml_compiler/publication_state.py \
            scripts/inputxml_compiler/publication_contract.py \
            scripts/inputxml_compiler/publication.py \
            scripts/inputxml_compiler/publication_io.py \
            scripts/inputxml_compiler/publication_verify.py \
            scripts/inputxml_compiler/cli.py \
            tests/test_inputxml_family_profiles.py \
            tests/test_inputxml_family_review_regressions.py \
            tests/test_inputxml_canonical_compiler_family_corpus.py \
            tests/test_inputxml_root_topology_strict.py \
            tests/test_inputxml_topology_bridge_contract.py \
            tests/test_inputxml_topology_corpus.py \
            tests/test_inputxml_topology_determinism.py
          node --check scripts/inputxml_compiler/node_uxml_rvm_bridge.mjs
      - name: Run canonical compiler unit and integration tests
        run: |
          set +e
          python -m unittest -v \
            tests/test_inputxml_canonical_compiler.py \
            tests/test_inputxml_canonical_compiler_family_corpus.py \
            tests/test_inputxml_family_profiles.py \
            tests/test_inputxml_family_review_regressions.py \
            tests/test_inputxml_canonical_compiler_integration.py \
            tests/test_inputxml_contract_bundle_gate.py \
            tests/test_inputxml_compiler_state_machine.py \
            tests/test_inputxml_resolver_contract.py \
            tests/test_inputxml_publication.py \
            tests/test_inputxml_deterministic_serialization.py \
            tests/test_inputxml_deterministic_hash_golden.py \
            tests/test_inputxml_xml_builder_adapter.py \
            tests/test_inputxml_seljson_adapter.py \
            tests/test_inputxml_root_topology_strict.py \
            tests/test_inputxml_topology_bridge_contract.py \
            tests/test_inputxml_topology_corpus.py \
            tests/test_inputxml_topology_determinism.py \
            tests/test_inputxml_managed_stage_adapter.py \
            tests/test_inputxml_pdf_input_echo_adapter.py \
            tests/test_inputxml_uxml_rvm_adapter.py \
            2>&1 | tee /tmp/inputxml-compiler-tests.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload compiler test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inputxml-compiler-test-log
          path: /tmp/inputxml-compiler-tests.log
          if-no-files-found: warn
      - name: Run direct canonical CLI smoke
        run: |
          rm -rf /tmp/inputxml-canonical-compiler
          python scripts/inputxml_canonical_compiler.py \
            --input contracts/inputxml/v1/golden/positive/minimal.canonical.input.xml \
            --output-dir /tmp/inputxml-canonical-compiler \
            --dialect canonical-inputxml-v1 \
            --source-repository reallaksh19/3D_Converters \
            --source-path contracts/inputxml/v1/golden/positive/minimal.canonical.input.xml
          python - <<'PY'
          from pathlib import Path
          from scripts.inputxml_compiler.publication import verify_committed_bundle
          result = verify_committed_bundle(
              Path('/tmp/inputxml-canonical-compiler'),
              'minimal.canonical.input',
          )
          assert result['status'] == 'PASS'
          assert result['serializationPolicy']['policyId'] == (
              'inputxml-deterministic-serialization-v1'
          )
          PY

  deterministic-serialization-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic serializer runtime
        run: python -m pip install --disable-pip-version-check lxml==5.4.0 pypdf==5.4.0
      - name: Run deterministic serializer, hash-seed, and topology proof
        run: >-
          python -m unittest -v
          tests/test_inputxml_deterministic_serialization.py
          tests/test_inputxml_deterministic_hash_golden.py
          tests/test_inputxml_topology_determinism.py
