name: tmp-extract-kd3

on:
  push:
    branches:
      - agent/hp-class-standardization-tool
    paths:
      - .github/workflows/tmp-extract-kd3.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact controlled KD-3 PDF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/reallaksh19/Common/f4d49f2a47d970ae0abf913b537193e324556177/kd-3.pdf' \
            -o kd-3.pdf
          sha256sum kd-3.pdf | tee kd-3.sha256
          file kd-3.pdf

      - name: Extract text and metadata
        shell: bash
        run: |
          set -euo pipefail
          command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
          pdfinfo kd-3.pdf > pdfinfo.txt || true
          pdftotext -layout kd-3.pdf kd-3.txt
          printf '\n--- section index ---\n' > section-index.txt
          grep -nE 'KD-300|KD-310|KD-311|KD-312|KD-313|KD-320|KD-321|KD-322|KD-323|KD-330|KD-340|KD-350|KD-360|KD-370|SECTION VIII|DIVISION 3' kd-3.txt >> section-index.txt || true
          wc -l -c kd-3.txt
          cat pdfinfo.txt
          head -120 section-index.txt

      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: kd3-controlled-extraction
          path: |
            kd-3.txt
            pdfinfo.txt
            section-index.txt
            kd-3.sha256
          if-no-files-found: error
          retention-days: 1
