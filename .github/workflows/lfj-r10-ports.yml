name: LFJ R10 real Node/browser Worker source port parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/ports/**'
      - '.github/workflows/lfj-r10-ports.yml'
  push:
    branches: [lfj/r10-worker-source-ports]
    paths:
      - 'lfj/ports/**'
      - '.github/workflows/lfj-r10-ports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worker:
    name: R10 native Worker original source Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Attest exact source head and real native Worker source test
        run: |
          git rev-parse HEAD
          node --test lfj/ports/*.test.mjs
      - name: No written fixture data
        run: test -z "$(git status --porcelain)"
