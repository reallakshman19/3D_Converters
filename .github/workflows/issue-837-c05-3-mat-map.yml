name: Issue 837 C05.3 Mat Map Cold Hydration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mat-map-cold-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.3 focused lifecycle contract
        run: node --test tests/xml-cii-issue-837-mat-map-cold-hydration.test.mjs
