name: Issue 837 C05.3 Mat Map Cold Hydration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mat-map-cold-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.3 focused lifecycle contract
        run: node --test tests/xml-cii-issue-837-mat-map-cold-hydration.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-837-http.log 2>&1 &
      - name: Run Mat_Map first-load -> reload -> fresh-worker lifecycle
        run: node scripts/run-xml-cii-issue-837-mat-map-cold-reload-e2e.mjs
      - name: Upload C05.3 browser receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-837-c05-3-mat-map-cold-reload
          path: ValidationRecords/xml-cii-issue-837-mat-map-cold-reload.json
          if-no-files-found: warn
