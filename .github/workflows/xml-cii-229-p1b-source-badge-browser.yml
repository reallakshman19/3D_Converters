name: XML229 P1B real original JSON Worker badge
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js'
      - 'scripts/xml-cii-229-p1b-original-source-badge-browser.mjs'
      - '.github/workflows/xml-cii-229-p1b-source-badge-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p1b-authored-original-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm source and served parity, syntax, contract and progress
        run: |
          echo "P1B_HEAD=$(git rev-parse HEAD)"
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-staged-source-receipt.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-staged-source-receipt.mjs
          node --check scripts/xml-cii-229-p1b-original-source-badge-browser.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-o1-intake.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
          node --test tests/xml-cii-229-p1-source-receipt-contract.test.mjs tests/xml-cii-229-lfj-progress.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve actual authored application
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xml229-p1b-http.log 2>&1 &
      - name: Prove source badge, replacement refusal, domain and synthetic 28 Run
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/xml-cii-229-p1b-original-source-badge-browser.mjs
      - name: Preserve evidence on PASS or RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-p1b-authored-original-browser
          path: |
            ValidationRecords/xml229-p1b-original-source-badge-browser.json
            /tmp/xml229-p1b-http.log
          if-no-files-found: warn
          retention-days: 30
