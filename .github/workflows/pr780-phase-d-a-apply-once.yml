name: PR780 phase D-A apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply transient Weight dataset materialization slice
        run: python3 scripts/_pr780_phase_d_a_apply.py
      - name: Syntax checks
        run: |
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js
      - name: Run applicable Phase D-A regressions
        run: |
          node --test \
            tests/xml-cii-weight-match-dataset-materialization.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-config-compaction.test.mjs \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            tests/xml-cii-issue-776-match1-provenance.test.mjs \
            tests/xml-cii-issue-776-weight-review-authority.test.mjs \
            tests/xml-cii-issue-776-workflow-weight-master-revision.test.mjs
      - name: Commit protected Phase D-A result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_pr780_phase_d_a_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js \
            docs/tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match-v2.js \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-weight-match-dataset-materialization.test.mjs \
            scripts/_pr780_phase_d_a_apply.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(xml-cii): materialize Weight dataset only for Weight Match'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
