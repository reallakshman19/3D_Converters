name: ATT Native Zone Tree H2
on:
  pull_request:
    paths:
      - 'tabs/model-converters/att-native-hierarchy-index.js'
      - 'tabs/model-converters/att-native-tree-projection.js'
      - 'docs/tabs/model-converters/att-native-tree-projection.js'
      - 'tests/model-converters/test-att-native-tree-projection.mjs'
      - '.github/workflows/att-native-tree-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-zone-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: source/docs identical
        run: cmp tabs/model-converters/att-native-tree-projection.js docs/tabs/model-converters/att-native-tree-projection.js
      - name: syntax and independent native oracle
        run: |
          node --check tabs/model-converters/att-native-tree-projection.js
          node tests/model-converters/test-att-native-hierarchy-index.mjs
          node tests/model-converters/test-att-native-tree-projection.mjs
