name: PR780 Coordinator Pre-Edit Backup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr780-native-backup-coordinator.yml'

permissions:
  contents: write

jobs:
  native-backup:
    if: github.event.pull_request.number == 780 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Run repository-native coordinator backups
        shell: bash
        run: |
          set -euo pipefail
          marker='PR780 worker Preview search coordinator pre-edit backup'
          if grep -Fq "${marker}" .backups/log.json; then
            echo "Native coordinator backup marker already present; nothing to do."
            exit 0
          fi
          node utils/backup.js save tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js "${marker}: source coordinator"
          node utils/backup.js save docs/tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js "${marker}: deployed coordinator mirror"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "chore(pr780): record coordinator pre-edit backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
