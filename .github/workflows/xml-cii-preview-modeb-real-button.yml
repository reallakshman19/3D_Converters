name: Agent P B3-B2B Actual Mode B Preview Button
on:
  push:
    branches:
      - 'agent-p/1000-preview-modeb-button-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-button-session.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-button-session.js'
      - 'tests/browser/xml-cii-preview-modeb-real-button.html'
      - 'scripts/run-xml-cii-preview-modeb-real-button.mjs'
      - '.github/workflows/xml-cii-preview-modeb-real-button.yml'
jobs:
  real-button:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression — existing Build Preview and protected worker tests
        run: |
          node --test tests/xml-cii-preview-modeb-session.test.mjs tests/xml-cii-preview-modeb-basis.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Exact source server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p3b2b-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/tests/browser/xml-cii-preview-modeb-real-button.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/p3b2b-http.log
          exit 1
      - name: Actual Mode B button, classified original failure, retry and no node truncation
        run: node scripts/run-xml-cii-preview-modeb-real-button.mjs
