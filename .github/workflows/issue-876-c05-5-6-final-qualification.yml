name: Issue 876 C05.5.6 Final Persistence Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c05-5-node-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run descendant-compatible persistence, durable-master, and C04 contracts
        run: |
          node --test \
            tests/xml-cii-issue-875-persistence-status-retry.test.mjs \
            tests/xml-cii-issue-872-worker-session-fallback.test.mjs \
            tests/xml-cii-issue-873-session-custody.test.mjs \
            tests/xml-cii-issue-881-per-master-restore-isolation.test.mjs \
            tests/xml-cii-issue-882-session-precedence.test.mjs \
            tests/xml-cii-issue-883-restore-failure-identity.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-weight-fingerprint-metadata.test.mjs \
            tests/xml-cii-issue-860-valve-weight-final-contract.test.mjs \
            tests/xml-cii-issue-858-hydrated-weight-match.test.mjs \
            tests/xml-cii-issue-821-rigid-weight-eligibility.test.mjs

  c05-5-browser-lifecycles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-876-http.log 2>&1 &
      - name: Piping Class first-load reload fresh-worker lifecycle
        run: node scripts/run-xml-cii-issue-836-piping-class-cold-reload-e2e.mjs
      - name: Mat Map first-load reload fresh-worker lifecycle
        run: node scripts/run-xml-cii-issue-837-mat-map-cold-reload-e2e.mjs
      - name: Valve Weight first-load reload fresh-worker and ranking lifecycle
        env:
          XML_CII_ISSUE_859_OUTPUT: ValidationRecords/xml-cii-issue-876-valve-weight-final.json
        run: node scripts/run-xml-cii-issue-859-valve-weight-cold-reload-e2e.mjs
      - name: C04 P2810042 rigid owner lifecycle
        run: node scripts/run-xml-cii-issue-821-p2810042-rigid-weight-e2e.mjs
      - name: Upload C05.5 final browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-876-c05-5-final-browser-receipts
          path: |
            ValidationRecords/xml-cii-issue-836-piping-class-cold-reload.json
            ValidationRecords/xml-cii-issue-837-mat-map-cold-reload.json
            ValidationRecords/xml-cii-issue-876-valve-weight-final.json
            ValidationRecords/xml-cii-issue-821-p2810042-rigid-weight.json
            /tmp/issue-876-http.log
          if-no-files-found: error
