name: PR780 Cache Contract Test Pre-Edit Backup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr780-native-backup-cache-contract-tests.yml'

permissions:
  contents: write

jobs:
  native-backup:
    if: github.event.pull_request.number == 780 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Run repository-native backups
        shell: bash
        run: |
          set -euo pipefail
          marker='PR780 app-shell cache contract test pre-edit backup'
          if grep -Fq "${marker}" .backups/log.json; then
            echo "Backup marker already present."
            exit 0
          fi
          node utils/backup.js save tests/cii-v11-v14-ui-static.test.mjs "${marker}: CAESAR cache contract"
          node utils/backup.js save tests/fbx/test-fbx2-runtime-cache-chain.mjs "${marker}: FBX cache contract"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .backups
          git commit -m "chore(pr780): record cache-contract test backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
