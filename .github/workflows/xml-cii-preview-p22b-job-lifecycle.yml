name: Agent P Preview P2.2-B Job Lifecycle
on:
  push:
    branches:
      - 'agent-p/1000-preview-job-control-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-job-controller.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-job-controller.js'
      - 'tests/xml-cii-preview-job-controller.test.mjs'
      - 'tests/browser/xml-cii-preview-p22b-controller.html'
      - 'scripts/run-xml-cii-preview-p22b-controller.mjs'
      - '.github/workflows/xml-cii-preview-p22b-job-lifecycle.yml'
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cancellable queued/running state and stale-basis negative tests
        run: |
          node --test tests/xml-cii-preview-job-controller.test.mjs \
            tests/xml-cii-preview-local-execution.test.mjs \
            tests/xml-cii-preview-facts-read-model.test.mjs
      - name: Install hosted Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Actual Worker mid-compute cancellation and explicit retry
        run: node scripts/run-xml-cii-preview-p22b-controller.mjs
