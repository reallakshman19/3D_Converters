name: LFJ R08 exact source occurrence selection

on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/query/selection/**'
      - '.github/workflows/lfj-r08-selection.yml'
  push:
    branches: [lfj/r08-exact-occurrence-selection]
    paths:
      - 'lfj/query/selection/**'
      - '.github/workflows/lfj-r08-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-selection:
    name: R08 committed occurrence Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Independent R08 original source and committed selection tests
        run: node --test lfj/query/selection/*.test.mjs
      - name: No uncommitted modifications
        run: test -z "$(git status --porcelain)"
