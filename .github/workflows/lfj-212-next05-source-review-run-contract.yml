name: LFJ 212 NEXT-05 source review Run contract (negative only)
on:
  pull_request:
    paths:
      - '.github/workflows/lfj-212-next05-source-review-run-contract.yml'
      - 'tests/recovery-final-cii/xml-cii-next05-source-review-run-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next05-contract-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact head and unchanged protected original source hashes
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo 'feee5a5a6399207337e63bc56c8afb001fe37ab30c6a7a9283333ec60f6eea38  Benchmarks/1885Sjson/FirstpassXML' | sha256sum --check
          echo '6b2c8b01ab0ba6ec8e9e7c42eb4a719668ffd2dc4dbe4790d27cf426a1f60288  Benchmarks/1885Sjson/Sjson.json' | sha256sum --check
          node --check tests/recovery-final-cii/xml-cii-next05-source-review-run-contract.test.mjs
      - name: NEXT-05 focused source to review to real Run veto
        run: |
          node --test \
            tests/recovery-final-cii/xml-cii-next05-source-review-run-contract.test.mjs \
            tests/recovery-final-cii/xml-cii-gcpw-selected-source-boundary.test.mjs \
            tests/gc-pw-v1-contract.test.mjs \
            tests/recovery-final-cii/xml-cii-indexed-run-authority.test.mjs
