name: Topo Node Registered Global Matcher

on:
  pull_request:
    paths:
      - 'node-history/matching/registered-*.js'
      - 'node-history/matching/global-history-assignment.js'
      - 'tests/node-history-registered-global-matcher.test.mjs'
      - 'tests/fixtures/node-history/registered-global/**'
      - 'node-history/matching/exact-*.js'
      - 'node-history/matching/identity-normalizer.js'
      - 'node-history/registry/**'
      - 'contracts/topo-enriched-xml/**'
      - 'schemas/topo-enriched-xml/**'
      - '.github/workflows/topo-node-registered-global-matcher.yml'
  workflow_dispatch:

jobs:
  validate-registered-global-matcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate TE-008 file and function bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('node-history/matching/registered-coordinate-evidence.js'),
              Path('node-history/matching/registered-candidate-graph.js'),
              Path('node-history/matching/global-history-assignment.js'),
              Path('node-history/matching/registered-global-matcher.js'),
              Path('node-history/matching/registered-matcher-policy.js'),
              Path('tests/node-history-registered-global-matcher.test.mjs'),
              Path('tests/fixtures/node-history/registered-global/registered-global-fixture.mjs'),
              Path('tests/fixtures/node-history/registered-global/registered-global-suite.mjs'),
          ]
          for path in files:
              lines = path.read_text().splitlines()
              assert len(lines) <= 300, f'{path}: {len(lines)} lines'
              for start, line in enumerate(lines):
                  match = re.match(r'(?:export\s+)?(?:async\s+)?function\s+(\w+)\s*\(', line)
                  if not match:
                      continue
                  depth = line.count('{') - line.count('}')
                  end = start
                  while depth > 0 and end + 1 < len(lines):
                      end += 1
                      depth += lines[end].count('{') - lines[end].count('}')
                  assert end - start + 1 <= 40, f'{path}:{start + 1} {match.group(1)} exceeds 40 lines'
          PY
      - name: Syntax check TE-008 slice
        run: |
          node --check node-history/matching/registered-coordinate-evidence.js
          node --check node-history/matching/registered-candidate-graph.js
          node --check node-history/matching/global-history-assignment.js
          node --check node-history/matching/registered-global-matcher.js
          node --check node-history/matching/registered-matcher-policy.js
          node --check tests/node-history-registered-global-matcher.test.mjs
          node --check tests/fixtures/node-history/registered-global/registered-global-fixture.mjs
          node --check tests/fixtures/node-history/registered-global/registered-global-suite.mjs
      - name: Enforce TE-008 non-goals
        run: |
          ! grep -Ein 'engineeringNodeNumber|allocateNode|nextFree|writeFile|serializeXml|mutateLifecycle|nearestNeighbor' \
            node-history/matching/registered-coordinate-evidence.js \
            node-history/matching/registered-candidate-graph.js \
            node-history/matching/global-history-assignment.js \
            node-history/matching/registered-global-matcher.js \
            node-history/matching/registered-matcher-policy.js
      - name: Run TE-008 registered and global matching tests
        run: node --test tests/node-history-registered-global-matcher.test.mjs
      - name: Protect TE-007 exact matching
        run: node --test tests/node-history-exact-matcher.test.mjs
      - name: Protect TE-005 registry foundation
        run: |
          node --test tests/node-history-registry-foundation.test.mjs
          node --test tests/fixtures/node-history/registry/draft-schema-validation.test.mjs
          node --test tests/fixtures/node-history/registry/orchestrator-regressions.test.mjs
      - name: Protect TE-002 frozen contracts
        run: node --test tests/topo-enriched-xml-contracts.test.mjs
