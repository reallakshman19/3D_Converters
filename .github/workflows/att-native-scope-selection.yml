name: ATT Native Scope H3
on:
  pull_request:
    paths:
      - 'tabs/model-converters/att-native-scope-*.js'
      - 'docs/tabs/model-converters/att-native-scope-*.js'
      - 'tabs/model-converters/legacy-adapter.js'
      - 'docs/tabs/model-converters/legacy-adapter.js'
      - 'tests/model-converters/test-att-native-scope-selection.mjs'
      - '.github/workflows/att-native-scope-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mirrors
        run: |
          cmp tabs/model-converters/att-native-scope-selection.js docs/tabs/model-converters/att-native-scope-selection.js
          cmp tabs/model-converters/att-native-scope-popup.js docs/tabs/model-converters/att-native-scope-popup.js
          cmp tabs/model-converters/legacy-adapter.js docs/tabs/model-converters/legacy-adapter.js
      - name: H3 selection authority
        run: |
          node --check tabs/model-converters/att-native-scope-selection.js
          node --check tabs/model-converters/att-native-scope-popup.js
          node --check tabs/model-converters/legacy-adapter.js
          node tests/model-converters/test-att-native-scope-selection.mjs
          node tests/model-converters/test-att-native-tree-projection.mjs
