name: PR780 phase B native backup

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save repository-native backups
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq 'native backup: PR780 bounded UI phase'; then
            echo 'Backup commit observed; no-op.'
            exit 0
          fi
          files=(
            'tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js'
            'tabs/xml-cii-2019-standalone/workers/master-dataset-client.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-client.js'
            'tabs/xml-cii-2019-standalone/workers/master-dataset-service.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-service.js'
            'tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js'
            'tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js'
            'tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-smart.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-smart.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-cii-zip.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-cii-zip.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-consolidated-review-v2.js'
