            'core/app-standalone-runtime.js'
            'docs/core/app-standalone-runtime.js'
            'core/app.js'
            'docs/core/app.js'
            'main-rhbg-fitguard.js'
            'docs/main-rhbg-fitguard.js'
            'index.html'
            'docs/index.html'
            'tests/xml-cii-master-dataset-worker.test.mjs'
            'tests/xml-cii-master-dataset-coordinator.test.mjs'
            'tests/xml-cii-master-preview-worker-search.test.mjs'
            'tests/xml-cii-master-dataset-startup-hydration.test.mjs'
            'tests/xml-cii-issue-776-deployment-parity.test.mjs'
          )
          for file in "${files[@]}"; do
            node utils/backup.js save "$file" "PR780 bounded UI phase before edit"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .backups
          if git diff --cached --quiet; then
            echo 'No new backup files generated.'
            exit 0
          fi
          git commit -m 'chore: native backup: PR780 bounded UI phase'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
