name: XML229 BC4 Original Workbook Fixture
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/fixtures/xml229/**'
      - 'tests/xml229-bc4-linelist-fixture.test.mjs'
      - 'scripts/xml229-install-bc4-fixture.mjs'
      - '.github/workflows/xml229-bc4-fixture.yml'
permissions:
  contents: read
jobs:
  exact-original-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail closed unless exact uploaded BC4 binary is committed
        run: |
          test -f tests/fixtures/xml229/BC4.xlsx || {
            echo 'BC4_BINARY_REQUIRED: use the Owner exact-byte git patch, commit the XLSX, and rerun';
            exit 1;
          }
          node --test tests/xml229-bc4-linelist-fixture.test.mjs
      - name: Verify no review ledgers were written
        run: |
          test -z "$(git status --porcelain -- tests/fixtures/xml229/BC4.xlsx)"
