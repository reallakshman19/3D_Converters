name: XML229 BC4 JSON LineList Fixture
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/fixtures/xml229/**'
      - 'tests/xml229-bc4-linelist-fixture.test.mjs'
      - '.github/workflows/xml229-bc4-fixture.yml'
permissions:
  contents: read
jobs:
  source-json-load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Load exact BC4 JSON through production LineList parser and normalizer
        run: |
          test -f tests/fixtures/xml229/BC4.LineList.json
          node --check tests/xml229-bc4-linelist-fixture.test.mjs
          node --test tests/xml229-bc4-linelist-fixture.test.mjs
      - name: Assert no review ledger or generated fixture changes
        run: |
          test -z "$(git status --porcelain -- tests/fixtures/xml229)"
