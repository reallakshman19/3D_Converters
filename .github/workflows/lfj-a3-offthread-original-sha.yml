name: LFJ A3 original source SHA off browser main thread
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-*.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-*.mjs'
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-indexed-csv-browser.mjs'
      - '.github/workflows/lfj-a3-offthread-original-sha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hash-worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22,24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Native Worker module syntax and hash, abort, timeout, source capacity
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-sha.worker.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-source-sha.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-export.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js
          node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-source-sha.test.mjs
          node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-export.test.mjs
          node --test tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.test.mjs
      - name: Source unchanged
        run: test -z "$(git status --porcelain)"
  authentic-csv-offthread-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve true original Firstpass source and actual product UI
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/a3-hash.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-original.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/a3-hash.log
          exit 1
      - name: Original SHA Worker only and two exact genuine CSV downloads
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-indexed-csv-browser.mjs
      - name: No source mutation
        run: test -z "$(git status --porcelain)"
