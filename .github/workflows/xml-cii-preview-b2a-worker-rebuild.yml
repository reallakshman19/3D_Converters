name: Agent P B2-A Fenced Internal Rebuilds
on:
  push:
    branches:
      - 'agent-p/1000-preview-b2a-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js'
      - 'tests/xml-cii-preview-b2a-worker-rebuild.test.mjs'
      - 'tests/browser/xml-cii-preview-b2a-worker-rebuild.html'
      - 'scripts/run-xml-cii-preview-b2a-worker-rebuild.mjs'
      - '.github/workflows/xml-cii-preview-b2a-worker-rebuild.yml'
jobs:
  fenced-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-level class rollback and source/docs binding guard
        run: |
          node --test tests/xml-cii-preview-b2a-worker-rebuild.test.mjs \
            tests/xml-cii-preview-button-basis.test.mjs \
            tests/xml-cii-preview-job-controller.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Chromium synthetic owner-scale worker rebuild and class rollback
        run: node scripts/run-xml-cii-preview-b2a-worker-rebuild.mjs
