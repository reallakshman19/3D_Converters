name: Agent P Preview Basis Contract
on:
  push:
    branches:
      - 'agent-p/1000-preview-basis-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-basis.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-basis.js'
      - 'tests/xml-cii-preview-facts-basis.test.mjs'
      - '.github/workflows/xml-cii-preview-basis-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview basis collision and custody oracles
        run: node --test tests/xml-cii-preview-facts-basis.test.mjs
