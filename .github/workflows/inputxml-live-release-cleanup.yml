name: Normalize InputXML Live Release Integration

on:
  push:
    branches:
      - agent/inputxml-live-release-diagnostics
    paths:
      - '.github/workflows/inputxml-live-release-cleanup.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/inputxml-live-release-diagnostics
          fetch-depth: 0

      - name: Apply byte-exact cleanup
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          version = b'20260729-inputxml-live-release-1'

          bridge_path = 'tabs/model-converters/xml-cii-workflow-bridge.js'
          bridge = subprocess.check_output(['git', 'show', f'origin/main:{bridge_path}'])
          old_bridge = b'./legacy-adapter.js?v=20260725-fbx-source-graph-preview-1'
          new_bridge = b'./legacy-adapter.js?v=' + version
          if bridge.count(old_bridge) != 1:
              raise SystemExit('Unexpected workflow bridge import count.')
          Path(bridge_path).write_bytes(bridge.replace(old_bridge, new_bridge))

          legacy_path = Path('tabs/model-converters/legacy-adapter.js')
          legacy = legacy_path.read_bytes()
          replacements = [
              (
                  b"setStatus(`BLOCKED: ${output.name}`, 'bad');",
                  b"setStatus(`BLOCKED: ${response.blockedSummary?.headline || output.name}`, 'bad');",
              ),
              (
                  b"message: response.blocked ? `${converter.label} blocked; no CII was emitted.` : `${converter.label} completed.`",
                  b"message: response.blocked ? `${converter.label} blocked: ${response.blockedSummary?.headline || 'no CII was emitted.'}` : `${converter.label} completed.`",
              ),
          ]
          for old, new in replacements:
              if legacy.count(old) != 1:
                  raise SystemExit(f'Unexpected legacy-adapter replacement count for {old!r}.')
              legacy = legacy.replace(old, new)
          legacy_path.write_bytes(legacy)

          Path('.github/workflows/inputxml-live-release-cleanup.yml').unlink()
          PY

      - name: Verify exact diff scope
        run: |
          git diff --check
          test "$(git diff --numstat origin/main -- tabs/model-converters/xml-cii-workflow-bridge.js | awk '{print $1":"$2}')" = '1:1'
          grep -F 'BLOCKED: ${response.blockedSummary?.headline || output.name}' tabs/model-converters/legacy-adapter.js

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(inputxml): show blocking code with byte-exact module alignment'
          git push origin HEAD:agent/inputxml-live-release-diagnostics
