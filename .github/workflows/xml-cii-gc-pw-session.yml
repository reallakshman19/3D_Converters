name: XML-CII GC-PW Preview Weight Session
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/integration/gc-pw-preview-weight-session.js'
      - 'docs/tabs/xml-cii-2019-standalone/integration/gc-pw-preview-weight-session.js'
      - 'tests/gc-pw-preview-weight-session.test.mjs'
      - 'docs/contracts/gc-pw-v1/contract.mjs'
      - 'docs/contracts/gc-pw-v1/occurrence-bridge.mjs'
      - 'docs/architecture/gc-pw-preview-weight-session.md'
      - '.github/workflows/xml-cii-gc-pw-session.yml'
  workflow_dispatch:
jobs:
  integrated-real-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify merged Preview basis to attested Weight review job
        run: node --test tests/gc-pw-preview-weight-session.test.mjs
