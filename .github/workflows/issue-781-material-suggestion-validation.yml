name: Issue 781 Material Suggestion Authority Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-editable-preview-table.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-editable-preview-table.js'
      - 'tests/xml-cii-issue-781-material-suggestion-presentation.test.mjs'
      - '.github/workflows/issue-781-material-suggestion-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-suggestion-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Issue 781 material suggestion presentation regression
        run: node --test tests/xml-cii-issue-781-material-suggestion-presentation.test.mjs
      - name: Run material authority regressions
        run: |
          node --test tests/xml-cii-material-code-fuzzy-authority.test.mjs
          node --test tests/xml-cii-process-material-authority.test.mjs
          node --test tests/xml-cii-preview-material-authority-index.test.mjs
      - name: Run B31.3 fail-closed material provenance regression
        run: node --test tests/xml-cii-b313-preview-blocker-provenance.test.mjs
