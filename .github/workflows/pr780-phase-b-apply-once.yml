name: PR780 phase B bounded UI apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch bounded UI phase
        run: python3 .github/pr780-phase-b-apply.py
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tabs/xml-cii-2019-standalone/workers/master-dataset-protocol.js
            tabs/xml-cii-2019-standalone/workers/master-dataset-client.js
            tabs/xml-cii-2019-standalone/workers/master-dataset-service.js
            tabs/xml-cii-2019-standalone/workers/master-dataset-import-coordinator.js
            tabs/xml-cii-2019-standalone/workers/master-dataset-worker.js
            tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-dataset-runtime.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-runtime.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-events.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-smart.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-cii-zip.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events-mode-a-consolidated-review-v2.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-smart.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js
            tabs/xml-cii-2019-standalone-tab.js
            core/app-standalone-runtime.js
            core/app.js
            main-rhbg-fitguard.js
          )
          for file in "${files[@]}"; do node --check "$file"; done
      - name: Run applicable PR780 tests
        run: |
          node --test \
            tests/xml-cii-master-dataset-config.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-dataset-persistence.test.mjs \
            tests/xml-cii-master-dataset-rollback-custody.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-master-dataset-worker.test.mjs \
            tests/xml-cii-master-preview-worker-search.test.mjs \
            tests/xml-cii-master-worker-integration.test.mjs \
            tests/xml-cii-issue-776-deployment-parity.test.mjs
      - name: Commit protected phase B result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr780-phase-b-apply.py .github/workflows/pr780-phase-b-apply-once.yml
          git add \
            tabs/xml-cii-2019-standalone docs/tabs/xml-cii-2019-standalone \
            core/app-standalone-runtime.js docs/core/app-standalone-runtime.js \
            core/app.js docs/core/app.js \
            main-rhbg-fitguard.js docs/main-rhbg-fitguard.js \
            index.html docs/index.html \
            tests/xml-cii-master-dataset-worker.test.mjs \
            tests/xml-cii-master-dataset-coordinator.test.mjs \
            tests/xml-cii-master-preview-worker-search.test.mjs \
            tests/xml-cii-master-dataset-startup-hydration.test.mjs \
            tests/xml-cii-issue-776-deployment-parity.test.mjs
          git commit -m 'perf(xml-cii): bound master preview and mapping reads'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
