name: LFJ 212 exact original text scope cache guard
on:
  pull_request:
    paths:
      - '.github/workflows/lfj-212-scope-cache-identity.yml'
      - 'tests/lfj-212-scope-cache-identity.test.mjs'
      - 'tests/recovery-final-cii/xml-cii-indexed-run-authority.test.mjs'
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-source-fact-handoff.mjs'
      - 'docs/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-source-fact-handoff.mjs'
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-parity.mjs'
      - 'docs/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-parity.mjs'
      - 'tabs/xml-cii-2019-standalone/xml-cii-preview-diagnostics-audit.js'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-preview-diagnostics-audit.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js'
      - 'tests/recovery-final-cii/xml-cii-source-fact-preview.test.mjs'
      - 'tests/recovery-final-cii/xml-cii-t6-extended-original-negative.test.mjs'
      - 'tests/recovery-final-cii/xml-cii-authentic-source-fact-handoff.test.mjs'
      - 'tabs/xml-cii-2019-standalone/integration/xml-cii-lfj-engineering-authority.js'
      - 'docs/tabs/xml-cii-2019-standalone/integration/xml-cii-lfj-engineering-authority.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-ui-adapter.js'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-workflow-ui-adapter.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-scope.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-scope.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-cache:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact raw candidate identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Original JSON scope identity negative and existing owner/ALL semantics
        run: node --test tests/lfj-212-scope-cache-identity.test.mjs tests/lfj-208-unsupported-owner-scope.test.mjs tests/recovery-final-cii/xml-cii-indexed-run-authority.test.mjs tests/recovery-final-cii/xml-cii-source-fact-preview.test.mjs tests/recovery-final-cii/xml-cii-authentic-source-fact-handoff.test.mjs tests/recovery-final-cii/xml-cii-t6-extended-original-negative.test.mjs
      - name: Original source/docs scope implementation byte identity
        run: cmp -s tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-scope.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-scope.js
      - name: Exact authored/docs engineering guard parity
        run: |
          cmp -s tabs/xml-cii-2019-standalone/integration/xml-cii-lfj-engineering-authority.js docs/tabs/xml-cii-2019-standalone/integration/xml-cii-lfj-engineering-authority.js
          cmp -s tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js docs/tabs/xml-cii-2019-standalone/xml-cii-output-run-readiness.js
          cmp -s tabs/xml-cii-2019-standalone/xml-cii-workflow-ui-adapter.js docs/tabs/xml-cii-2019-standalone/xml-cii-workflow-ui-adapter.js
      - name: Source-only Preview source/docs byte parity
        run: |
          cmp -s lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-source-fact-handoff.mjs docs/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-source-fact-handoff.mjs
          cmp -s lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-parity.mjs docs/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-parity.mjs
          cmp -s tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-lfj-indexed-preview.js
          cmp -s tabs/xml-cii-2019-standalone/xml-cii-preview-diagnostics-audit.js docs/tabs/xml-cii-2019-standalone/xml-cii-preview-diagnostics-audit.js
      - name: No tracked mutation
        run: test -z "$(git status --porcelain)"
