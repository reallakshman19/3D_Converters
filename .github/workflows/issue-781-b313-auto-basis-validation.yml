name: Issue 781 B31.3 Auto Basis Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-auto-basis.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-auto-basis.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js'
      - 'tests/xml-cii-issue-781-b313-auto-basis.test.mjs'
      - '.github/workflows/issue-781-b313-auto-basis-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b313-auto-basis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Issue 781 B31.3 automatic-basis regression
        run: node --test tests/xml-cii-issue-781-b313-auto-basis.test.mjs
      - name: Run B31.3 Preview wall composition regression
        run: node --test tests/xml-cii-b313-preview-wall-update.test.mjs
      - name: Run B31.3 fail-closed provenance regression
        run: node --test tests/xml-cii-b313-preview-blocker-provenance.test.mjs
