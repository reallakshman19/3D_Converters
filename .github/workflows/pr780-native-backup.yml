name: PR780 Native Pre-Edit Backup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr780-native-backup.yml'

permissions:
  contents: write

jobs:
  native-backup:
    if: github.event.pull_request.number == 780 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Run repository-native backups
        shell: bash
        run: |
          set -euo pipefail
          marker='PR780 worker Preview search pre-edit backup'
          if grep -Fq "${marker}" .backups/log.json; then
            echo "Native backup marker already present; nothing to do."
            exit 0
          fi
          node utils/backup.js save tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js "${marker}: source Preview UI"
          node utils/backup.js save tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js "${marker}: source worker event facade"
          node utils/backup.js save docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-import-masters.js "${marker}: deployed Preview UI mirror"
          node utils/backup.js save docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-master-worker-events.js "${marker}: deployed worker event facade mirror"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "chore(pr780): record native pre-edit backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
