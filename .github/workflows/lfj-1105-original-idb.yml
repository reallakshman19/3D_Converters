name: LFJ 1108 U02 original-value real IndexedDB Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/runtime/**'
      - '.github/workflows/lfj-1105-original-idb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-chromium-source-value:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert actual candidate SHA, not synthetic PR merge
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve original source modules (not docs deployment)
        run: |
          python3 -m http.server 4183 --bind 127.0.0.1 >/tmp/lfj-1108-u02.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4183/lfj/runtime/original-idb-value-qualification.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-1108-u02.log
          exit 1
      - name: Independent real browser native Worker + IndexedDB source byte oracle
        run: |
          git rev-parse HEAD
          node lfj/runtime/original-idb-value-qualification.mjs
          node lfj/runtime/indexed-pair-fault-qualification.mjs
      - name: Test must not mutate tracked sources
        run: test -z "$(git status --porcelain)"
