name: CategorizedInputXML Authority Pin

on:
  pull_request:
    paths:
      - 'xml-compare/CategorizedInputXmlConverter.js'
      - 'xml-compare/XmlCompareCoordinateSideload.js'
      - 'xml-compare/XmlCompareCoordinateDiagnostics.js'
      - 'xml-compare/CategorizedInputXmlConverter.pin.json'
      - 'tests/categorized-inputxml-authority-pin.test.mjs'
      - '.github/workflows/categorized-inputxml-authority-pin.yml'
  push:
    branches:
      - main
    paths:
      - 'xml-compare/CategorizedInputXmlConverter.js'
      - 'xml-compare/XmlCompareCoordinateSideload.js'
      - 'xml-compare/XmlCompareCoordinateDiagnostics.js'
      - 'xml-compare/CategorizedInputXmlConverter.pin.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 3D Converters
        uses: actions/checkout@v6

      - name: Checkout exact Node 140 benchmark commit
        uses: actions/checkout@v4
        with:
          ref: 432c87e022674822cc4ddaf2faddeffd68fe883e
          path: node140-exact-source
          fetch-depth: 1

      - name: Verify and stage exact Node 140 benchmark artifact
        shell: bash
        run: |
          set -euo pipefail
          cd node140-exact-source
          test "$(git rev-parse HEAD)" = "432c87e022674822cc4ddaf2faddeffd68fe883e"
          test "$(git hash-object Benchmarks/css/SYS-0010.xml)" = "1c6e2d817c9488839d1743da46927e8e104fa824"
          test "$(git hash-object Benchmarks/css/css3_managed_stage.zip)" = "86da3f48cb53b7cb7f3520072edcf0d3ed0d1806"
          mkdir -p ../node140-exact-benchmark
          cp Benchmarks/css/SYS-0010.xml ../node140-exact-benchmark/
          cp Benchmarks/css/css3_managed_stage.zip ../node140-exact-benchmark/
          sha256sum Benchmarks/css/SYS-0010.xml Benchmarks/css/css3_managed_stage.zip > ../node140-exact-benchmark/SHA256SUMS
          printf 'commit=432c87e022674822cc4ddaf2faddeffd68fe883e\nxml_blob=1c6e2d817c9488839d1743da46927e8e104fa824\nzip_blob=86da3f48cb53b7cb7f3520072edcf0d3ed0d1806\n' > ../node140-exact-benchmark/PROVENANCE.txt

      - name: Upload exact Node 140 benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: node140-exact-benchmark-432c87e
          path: node140-exact-benchmark/
          if-no-files-found: error
          retention-days: 1

      - name: Checkout pinned XML Utilities authority
        uses: actions/checkout@v6
        with:
          repository: reallaksh19/XML_Compare_Utilities
          ref: dd7e62c2dc879d0ac4916303f9c41ff863b50cbc
          path: XML_Compare_Utilities
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify exact vendored bytes
        shell: bash
        run: |
          cmp xml-compare/CategorizedInputXmlConverter.js XML_Compare_Utilities/xml-compare/CategorizedInputXmlConverter.js
          cmp xml-compare/XmlCompareCoordinateSideload.js XML_Compare_Utilities/xml-compare/XmlCompareCoordinateSideload.js
          cmp xml-compare/XmlCompareCoordinateDiagnostics.js XML_Compare_Utilities/xml-compare/XmlCompareCoordinateDiagnostics.js

      - name: Run pinned authority regression
        run: |
          node --experimental-default-type=module tests/categorized-inputxml-authority-pin.test.mjs
          node tests/xml-builder-inputxml-ui.test.js
          git diff --check
