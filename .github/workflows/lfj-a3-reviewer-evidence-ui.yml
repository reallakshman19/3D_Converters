name: 'LFJ A3 #209 Reviewer Evidence UI'
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-json-trace.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-json-trace.js'
      - 'tests/xml-cii-a3-reviewer-evidence-ui.test.mjs'
      - 'tests/xml-cii-a3-reviewer-evidence-browser.mjs'
      - '.github/workflows/lfj-a3-reviewer-evidence-ui.yml'
  push:
    branches:
      - 'lfj/a3-209-sourcewide-evidence-review-20261011'
permissions:
  contents: read
jobs:
  reviewer-evidence-ui:
    name: Node ${{ matrix.node }} source-wide reviewer UI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Require exact candidate HEAD, not synthetic PR merge
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Test production renderer with synthetic large-row UI data and mirror equality
        run: node --test tests/xml-cii-a3-reviewer-evidence-ui.test.mjs
      - name: Tests do not modify repository
        run: test -z "$(git status --porcelain)"
  reviewer-native-chromium:
    name: Native Chromium authored docs reviewer UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and browser driver
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve real authored docs/index.html
        run: |
          (python3 -m http.server 4201 --bind 127.0.0.1 --directory docs >"$RUNNER_TEMP/a3-209-docs-http.log" 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4201/index.html >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/a3-209-docs-http.log"
          exit 1
      - name: Search original-index-view rows in genuine Chromium DOM
        run: node tests/xml-cii-a3-reviewer-evidence-browser.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-209-sourcewide-reviewer-browser
          path: a3-209-reviewer-ui-chromium.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify repo unchanged by UI browser
        run: test -z "$(git status --porcelain)"
