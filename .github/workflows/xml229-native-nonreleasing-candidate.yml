name: XML229 Native Candidate Nonreleasing
on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-ui-adapter.js'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-nonreleasing-native-candidate.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml229-nonreleasing-native-candidate.test.mjs'
      - 'tests/xml-cii-229-r2-physical-transfer.test.mjs'
      - 'tests/xml229-native-cii-output-reconcile.test.mjs'
      - 'tests/xml229-native-candidate-witness.test.py'
      - 'tests/xml229-native-candidate-run-panel-browser.mjs'
      - 'tests/xml229-native-candidate-real-workflow-hook.test.mjs'
      - 'tests/xml229-real-worker-native-candidate-browser.mjs'
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-service.js'
      - 'converters/scripts/xml229_native_candidate_witness.py'
      - 'converters/scripts/xml_to_cii2019_runtime_custody.py'
      - 'converters/scripts/xml_to_cii2019_patched.py'
      - 'converters/xml-cii-2019-standalone/engine.js'
      - 'converters/xml-cii-2019-standalone/invocation-builder.js'
      - '.github/workflows/xml229-native-nonreleasing-candidate.yml'
  workflow_dispatch:
jobs:
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/xml229-nonreleasing-native-candidate.test.mjs tests/xml-cii-229-r2-physical-transfer.test.mjs tests/xml229-native-cii-output-reconcile.test.mjs tests/xml229-native-candidate-real-workflow-hook.test.mjs tests/xml-cii-preview-run-parity-closure.test.mjs
      - run: python3 tests/xml229-native-candidate-witness.test.py
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/xml229-nonreleasing-native-candidate.test.mjs tests/xml-cii-229-r2-physical-transfer.test.mjs tests/xml229-native-cii-output-reconcile.test.mjs tests/xml229-native-candidate-real-workflow-hook.test.mjs tests/xml-cii-preview-run-parity-closure.test.mjs
      - run: python3 tests/xml229-native-candidate-witness.test.py
  served-chromium-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: [node22, node24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install genuine Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Real served root/docs Run panel with governed native HOLD
        run: node tests/xml229-native-candidate-run-panel-browser.mjs
  full-worker-native-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [node22, node24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install genuine Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Real current GC-PW Worker → reviewed source-kg → exact R2 → Pyodide native CII
        run: node tests/xml229-real-worker-native-candidate-browser.mjs
