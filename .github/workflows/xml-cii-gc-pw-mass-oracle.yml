name: XML-CII GC-PW Mass Review Oracle
on:
  pull_request:
    paths:
      - 'scripts/gc-pw-v1-cii-mass-oracle.py'
      - 'tests/gc-pw-v1-cii-mass-oracle.test.py'
      - 'docs/architecture/gc-pw-v1-cii-mass-oracle.md'
      - '.github/workflows/xml-cii-gc-pw-mass-oracle.yml'
  workflow_dispatch:
jobs:
  independent-cii-mass-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Challenge CII RIGID allocations and review authority
        run: python3 tests/gc-pw-v1-cii-mass-oracle.test.py
