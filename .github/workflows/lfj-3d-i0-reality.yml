name: LFJ 3D I0 Source Reality (RED only; not app release)
on:
  pull_request:
    paths:
      - 'lfj/acceptance/3d-converters/**'
      - '.github/workflows/lfj-3d-i0-reality.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  independent-i0:
    name: Legacy characterization + intentional integration RED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Characterize actual old source functions and real benchmark files
        run: node --test lfj/acceptance/3d-converters/source-reality-baseline.test.mjs
      - name: Require known integration RED (do NOT interpret this as product pass)
        run: |
          if LFJ_I0_ACCEPTANCE=1 node --test lfj/acceptance/3d-converters/source-reality-baseline.test.mjs; then
            echo "Old RED probe changed: audit live browser path before reporting PASS"
            exit 1
          fi
          echo "KNOWN SOURCE DEFECTS REPRODUCED; LIVE INTEGRATION IS NOT VERIFIED."

  legacy-enrichment-browser:
    name: Actual docs Enrichment UI file to engineering to downloads (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium for UI journey
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve genuine deployment root, not test fixture app
        run: |
          python3 -m http.server 4182 --bind 127.0.0.1 --directory docs >/tmp/lfj-3d-docs.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4182/tabs/stagedjson-to-enrichxml/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-3d-docs.log
          exit 1
      - name: Actual user journey and source-domain output receipt (NOT LFJ release pass)
        env:
          LFJ_I0_RECEIPT_DIR: ${{ runner.temp }}/lfj-3d-receipts
        run: |
          git rev-parse HEAD
          node lfj/acceptance/3d-converters/enrichment-browser-baseline.mjs
      - name: Real deployed Resolver XML and staged JSON to scope, node-wise CSV (legacy baseline)
        env:
          LFJ_I0_RECEIPT_DIR: ${{ runner.temp }}/lfj-3d-receipts
        run: |
          git rev-parse HEAD
          node lfj/acceptance/3d-converters/resolver-live-browser-baseline.mjs
      - name: Upload independently inspectable browser result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfj-3d-enrichment-browser-baseline
          path: ${{ runner.temp }}/lfj-3d-receipts/
          if-no-files-found: warn
