name: PR780 phase D-D apply

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Preview and Output consumer migration
        run: python3 scripts/_pr780_phase_d_d_apply.py
      - name: Syntax checks
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js
      - name: Run applicable Phase D-D regressions
        run: |
          node --test \
            tests/xml-cii-preview-dataset-operation.test.mjs \
            tests/xml-cii-output-run-metadata-readiness.test.mjs \
            tests/xml-cii-readonly-consumer-dataset-config.test.mjs \
            tests/xml-cii-workflow-job-dataset-materialization.test.mjs \
            tests/xml-cii-master-config-compaction.test.mjs \
            tests/xml-cii-master-run-config-compaction.test.mjs \
            tests/xml-cii-mode-a-preview-restoration.test.mjs \
            tests/xml-cii-issue-776-weight-review-authority.test.mjs \
            tests/xml-cii-issue-776-post-run-weight-authority.test.mjs
      - name: Commit protected Phase D-D result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_pr780_phase_d_d_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js \
            tests/xml-cii-preview-dataset-operation.test.mjs \
            tests/xml-cii-output-run-metadata-readiness.test.mjs \
            scripts/_pr780_phase_d_d_apply.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(xml-cii): detach Preview and Output UI from resident masters'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
