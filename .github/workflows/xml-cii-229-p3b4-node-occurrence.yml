name: XML229 P3B.4 Source node occurrence integrity
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-node-occurrence-ledger.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dryrun-core.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dryrun.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-bore-wall-authority.js'
      - 'tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-execution.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'tests/xml-cii-229-p3b4-source-node-ledger.test.mjs'
      - '.github/workflows/xml-cii-229-p3b4-node-occurrence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-node-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Capture exact head
        run: git rev-parse HEAD
      - name: Syntax and served mirror parity
        run: |
          node --check tests/xml-cii-229-p3b4-source-node-ledger.test.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-node-occurrence-ledger.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dryrun-core.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-bore-wall-authority.js
          node --check tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-execution.mjs
          for name in xml-cii-adapted-preview-node-occurrence-ledger.js xml-cii-adapted-preview-dryrun-core.js xml-cii-adapted-preview-dryrun.js xml-cii-adapted-preview-bore-wall-authority.js; do
            diff -u "tabs/xml-cii-2019-standalone/ui-adapted/$name" "docs/tabs/xml-cii-2019-standalone/ui-adapted/$name"
          done
          diff -u tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-execution.mjs docs/tabs/xml-cii-2019-standalone/integration/xml229-preview-original-blob-execution.mjs
      - name: Source ordinal safety and existing duplicate occurrence regressions
        run: |
          node --test tests/xml-cii-229-p3b4-source-node-ledger.test.mjs tests/xml-cii-mode-b-preview-occurrence.test.mjs tests/xml-cii-229-p3b3-owner-scope-failclosed.test.mjs
