name: Issue 781 Weight Build Protected Apply

on:
  push:
    branches:
      - agent/issue-781-weight-build-singleflight-20260930
    paths:
      - .github/workflows/issue-781-weight-build-apply.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-781-weight-build-singleflight-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded Weight Build repair
        run: python3 scripts/tmp_issue_781_weight_build_patch.py
      - name: Syntax check changed runtime
        run: |
          node --check converters/xml-cii2019-core/weight-valve-hints.js
          node --check tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-validation-report.js
      - name: Run focused Weight Build and authority regressions
        run: |
          node --test \
            tests/xml-cii-issue-781-weight-build-performance.test.mjs \
            tests/empirical-weight-validation-report.test.js \
            tests/xml-cii-issue-776-weight-review-authority.test.mjs \
            tests/xml-cii-issue-776-weight-acceptance-validation.test.mjs \
            tests/xml-cii-issue-776-match1-provenance.test.mjs \
            tests/xml-cii-issue-776-match1-acceptance-paths.test.mjs \
            tests/xml-cii-issue-776-stale-match1-no-auto-rerank.test.mjs
      - name: Commit only qualified production/test delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            converters/xml-cii2019-core/weight-valve-hints.js \
            docs/converters/xml-cii2019-core/weight-valve-hints.js \
            tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js \
            docs/tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js \
            tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-validation-report.js \
            docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-validation-report.js \
            tests/xml-cii-issue-781-weight-build-performance.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(issue-781): stop Weight Build runaway work"
          git push origin HEAD:agent/issue-781-weight-build-singleflight-20260930
