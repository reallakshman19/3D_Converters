name: Issue 855 C05.4.1 Valve Weight RED Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valve-weight-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.4.1 RED baseline contract
        run: node --test tests/xml-cii-issue-855-valve-weight-red-baseline.test.mjs
