name: XML Builder Restraint Authority Correction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/xml-builder-restraint-authority-correction.yml'

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Work Pack branch
        uses: actions/checkout@v4
        with:
          ref: agent/xml-builder-inputxml-audit-fix
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Apply exact restraint authority correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise RuntimeError(f"Expected one {label} anchor, found {count}")
              return text.replace(before, after, 1)

          core_path = Path('tabs/model-converters/xml-cii-node-to-inputxml-core.js')
          core = core_path.read_text(encoding='utf-8')
          core = replace_once(
              core,
              "import { buildNodeToInputXmlDiagnosticRecords } from './xml-cii-node-to-inputxml-audit.js?v=20260713-xml-builder-audit-1';",
              "import { buildNodeToInputXmlDiagnosticRecords } from './xml-cii-node-to-inputxml-audit.js?v=20260713-xml-builder-audit-1';\nimport { restraintTypeToCaesarCode } from '../../converters/xml-cii2019-core/restraint-type-codes.js';",
              'shared restraint mapper import',
          )
          core = replace_once(
              core,
              "const RESTRAINT_TYPE_MAP = Object.freeze({ '+Y': 17, Y: 17, LIM: 12, GUI: 9, ANC: 0, ANCHOR: 0 });\n",
              '',
              'private restraint map',
          )
          core = replace_once(
              core,
              "  const typeKey = text(typeText).toUpperCase();\n  const directionKey = text(directionText).toUpperCase();\n  const direct = RESTRAINT_TYPE_MAP[typeKey] ?? maybeNum(typeKey);\n  if (direct !== null && direct !== undefined) return { typeCode: direct, resolution: 'type' };\n  const directional = RESTRAINT_TYPE_MAP[directionKey] ?? maybeNum(directionKey);\n  if (directional !== null && directional !== undefined) return { typeCode: directional, resolution: 'direction' };",
              "  const direct = restraintTypeToCaesarCode(typeText);\n  if (direct !== null && direct !== undefined) return { typeCode: direct, resolution: 'type' };\n  const directional = restraintTypeToCaesarCode(directionText);\n  if (directional !== null && directional !== undefined) return { typeCode: directional, resolution: 'direction' };",
              'restraint resolution logic',
          )
          core_path.write_text(core, encoding='utf-8')

          test_path = Path('tests/xml-cii-node-to-inputxml-core.test.js')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              "TYPE=\"17.000000\"'), 'node-level +Y support should generate a CAESAR restraint at node 30'",
              "TYPE=\"14.000000\"'), 'node-level +Y support should use the Python-synchronized signed-axis code at node 30'",
              'launcher restraint assertion',
          )
          test = replace_once(
              test,
              "TYPE=\"17.000000\"'), 'generic REST with +Y direction should emit mapped restraint type 17'",
              "TYPE=\"14.000000\"'), 'generic REST with +Y direction should emit the authoritative mapped restraint type 14'",
              'XML Builder restraint assertion',
          )
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Syntax and focused tests
        run: |
          node --check tabs/model-converters/xml-cii-node-to-inputxml-core.js
          node --check tests/xml-cii-node-to-inputxml-core.test.js
          node tests/xml-cii-node-to-inputxml-core.test.js
          node tests/xml-cii-node-to-inputxml-benchmark.test.js
          node tests/xml-cii-node-to-inputxml-fillers.test.js
          node tests/xml-builder-inputxml-ui.test.js
          node tests/xml-builder-inputxml-diagnostics.test.mjs
      - name: Commit correction and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs/model-converters/xml-cii-node-to-inputxml-core.js tests/xml-cii-node-to-inputxml-core.test.js
          git rm .github/workflows/xml-builder-restraint-authority-correction.yml
          git diff --cached --check
          git commit -m "fix: use authoritative restraint type mapping"
          git push origin HEAD:agent/xml-builder-inputxml-audit-fix
