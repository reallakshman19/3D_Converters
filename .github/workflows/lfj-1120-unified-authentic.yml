name: LFJ 1120 W2 authentic unified IDB populated sources
on:
  pull_request:
    branches: [main]
    paths:
      - 'lfj/runtime/unified-*'
      - 'lfj/qualification/provisional/authentic-unified-idb.*'
      - '.github/workflows/lfj-1120-unified-authentic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-unified:
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - Benchmarks/1885Sjson/Sjson.json
          - Benchmarks/1885_NC/1885_NC.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage canonical LFJ modules and actual tracked fixture in temporary served tree
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d "${RUNNER_TEMP}/lfj-w2-real-XXXXXX")"
          echo "LFJ_STAGE_ROOT=${stage_dir}" >> "${GITHUB_ENV}"
          node lfj/qualification/provisional/stage-public-runtime.mjs --stage-dir "${stage_dir}"
          mkdir -p "${stage_dir}/lfj/runtime" "${stage_dir}/lfj/qualification/provisional" "${stage_dir}/fixtures"
          cp lfj/runtime/unified-indexed-source-store.mjs "${stage_dir}/lfj/runtime/"
          cp lfj/runtime/unified-generation-custody.mjs "${stage_dir}/lfj/runtime/"
          cp lfj/qualification/provisional/authentic-unified-idb.html "${stage_dir}/lfj/qualification/provisional/"
          cp "${{ matrix.fixture }}" "${stage_dir}/fixtures/$(basename "${{ matrix.fixture }}")"
          sha256sum "${{ matrix.fixture }}"
          cmp lfj/runtime/unified-indexed-source-store.mjs "${stage_dir}/lfj/runtime/unified-indexed-source-store.mjs"
          cmp lfj/runtime/unified-generation-custody.mjs "${stage_dir}/lfj/runtime/unified-generation-custody.mjs"
      - name: Install native Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve staged native source and real benchmark
        shell: bash
        run: |
          (cd "${LFJ_STAGE_ROOT}" && python3 -m http.server 4189 --bind 127.0.0.1 >/tmp/lfj-w2-real.log 2>&1) &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4189/lfj/qualification/provisional/authentic-unified-idb.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-w2-real.log
          exit 1
      - name: Independent Node source census vs actual Chromium Worker/IndexedDB
        run: node lfj/qualification/provisional/authentic-unified-idb.mjs --fixture "${{ matrix.fixture }}"
      - name: Source tree unchanged
        run: test -z "$(git status --porcelain)"
