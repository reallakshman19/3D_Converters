name: XML CII Standalone Performance Batch C3 Source Parse Cache Qualification

on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-derived-context.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-mode.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-preview.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf-evidence.js'
      - 'tests/xml-cii-standalone-source-parse-cache.test.mjs'
      - 'tests/xml-cii-standalone-source-parse-cache-integration.test.mjs'
      - '.github/workflows/xml-cii-standalone-perf-batch-c3-source-parse-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check C3 module syntax
        run: |
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-derived-context.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-mode.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-source-preview.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-perf-evidence.js
          node --check tests/xml-cii-standalone-source-parse-cache.test.mjs
          node --check tests/xml-cii-standalone-source-parse-cache-integration.test.mjs

      - name: Prove exact-source parse reuse and basis invalidation
        run: node --test tests/xml-cii-standalone-source-parse-cache.test.mjs

      - name: Pin Source Mode consumers to shared parse custody
        run: node --test tests/xml-cii-standalone-source-parse-cache-integration.test.mjs

      - name: Re-run Preview search scale gates
        run: |
          node --test tests/xml-cii-standalone-preview-search-perf.test.mjs
          node --test tests/xml-cii-standalone-preview-search-lazy.test.mjs

      - name: Re-run C1 render/evidence gates
        run: |
          node --test tests/xml-cii-standalone-render-scope.test.mjs
          node --test tests/xml-cii-standalone-master-dom-sync.test.mjs
          node --test tests/xml-cii-standalone-perf-evidence.test.mjs

      - name: Re-run Batch A authority gates
        run: |
          node --test tests/xml-cii-standalone-master-perf.test.mjs
          node --test tests/xml-cii-standalone-config-cache-custody.test.mjs
          node --test tests/xml-cii-standalone-support-gap-equivalence.test.mjs

      - name: Protect immutable InputXML CII core
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Fx 'converters/scripts/inputxml_to_cii2019.py'; then
            echo 'ERROR: immutable inputxml_to_cii2019.py is present in Batch C3 diff.' >&2
            exit 1
          fi
