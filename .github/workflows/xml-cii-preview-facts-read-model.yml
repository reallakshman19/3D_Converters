name: Agent P Preview Fact Page Conformance
on:
  push:
    branches:
      - 'agent-p/1000-preview-fact-pages-*'
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-*'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-*'
      - 'tests/xml-cii-preview-facts-*.test.mjs'
      - '.github/workflows/xml-cii-preview-facts-read-model.yml'
jobs:
  fact-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent core, source custody and integrator contract tests
        run: |
          node --test tests/gc-pw-v1-contract.test.mjs \
            tests/xml-cii-preview-facts-basis.test.mjs \
            tests/xml-cii-preview-facts-occurrence.test.mjs \
            tests/xml-cii-preview-facts-read-model.test.mjs
