name: PR780 closure evidence native backup

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save repository-native backup
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq 'native backup: PR780 closure evidence'; then exit 0; fi
          node utils/backup.js save 'tests/browser/xml-cii-master-dataset-scale-e2e.html' 'PR780 closure evidence: qualify metadata-only dataset-backed import custody at 10k/50k/100k before edit'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .backups
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: native backup: PR780 closure evidence'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
