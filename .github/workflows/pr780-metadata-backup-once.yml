name: PR780 metadata slice native backup

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save repository-native backups
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq 'native backup: PR780 metadata consumer slice'; then
            echo 'Backup commit observed; no-op.'
            exit 0
          fi
          files=(
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-render-scope.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-diagnostics-audit-v7.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-phase-panels-mode-a.js'
            'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js'
            'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-workflow-shell-mode-a-easy-bulk-v6.js'
            'tabs/xml-cii-2019-standalone-tab.js'
            'docs/tabs/xml-cii-2019-standalone-tab.js'
            'core/app-standalone-runtime.js'
            'docs/core/app-standalone-runtime.js'
            'core/app.js'
            'docs/core/app.js'
            'main-rhbg-fitguard.js'
            'docs/main-rhbg-fitguard.js'
            'index.html'
            'docs/index.html'
            'tests/xml-cii-standalone-render-scope.test.mjs'
            'tests/xml-cii-issue-776-deployment-parity.test.mjs'
            'tests/cii-v11-v14-ui-static.test.mjs'
          )
          for file in "${files[@]}"; do
            node utils/backup.js save "$file" "PR780 metadata consumer slice before edit"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .backups
          if git diff --cached --quiet; then
            echo 'No new backup files generated.'
            exit 0
          fi
          git commit -m 'chore: native backup: PR780 metadata consumer slice'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
