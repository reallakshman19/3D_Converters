name: LFJ 1147 B0-07 source+projection HEAD fencing and XML/CSV parity
on:
  push:
    branches: ['lfj/1147-b0-07-read-fencing']
    paths:
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/**'
      - 'lfj/qualification/experiments/consumer-sparse-b0-query/**'
      - 'lfj/qualification/experiments/consumer-sparse-b0-consumer/**'
      - '.github/workflows/lfj-1147-b0-xml-csv-parity.yml'
      - '.github/workflows/lfj-1147-b0-07-head-fencing.yml'
  pull_request:
    paths:
      - 'lfj/qualification/experiments/consumer-sparse-b0-xml-match/**'
      - 'lfj/qualification/experiments/consumer-sparse-b0-query/**'
      - 'lfj/qualification/experiments/consumer-sparse-b0-consumer/**'
      - '.github/workflows/lfj-1147-b0-xml-csv-parity.yml'
      - '.github/workflows/lfj-1147-b0-07-head-fencing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-xml-csv-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: SMALL
            mode: AUTHENTIC
          - size: SMALL
            mode: SOURCE_DERIVED_CONTROL
          - size: LARGE
            mode: AUTHENTIC
          - size: LARGE
            mode: SOURCE_DERIVED_CONTROL
          - size: FIRSTPASS
            mode: AUTHENTIC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static files and source schema/capture contracts
        run: |
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-parity.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-query/paged-query.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/matching.worker.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-xml-match/real-xml-csv-oracle.mjs
          node --check lfj/qualification/experiments/consumer-sparse-b0-consumer/branch-sliced-projection.mjs
          node lfj/qualification/experiments/consumer-sparse-b0/verify-consumer-manifest.mjs
      - name: Install real Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: H06 exact raw-head full source, goldens and native Worker qualification
        if: matrix.size == 'FIRSTPASS' && matrix.mode == 'AUTHENTIC'
        shell: bash
        env:
          OWNER_PINNED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          REPORT=/tmp/lfj-h06-all-ci.json
          code=0
          node lfj/qualification/experiments/consumer-sparse-b0-xml-match/lfj-local-qualification.mjs --expected-head="$OWNER_PINNED_SHA" --mode=all --report="$REPORT" || code=$?
          if test -f "$REPORT"; then
            cat "$REPORT"
          else
            echo "H06 runner did not write expected report"
          fi
          exit "$code"
      - name: Preserve H06 exact-head machine-readable evidence
        if: always() && matrix.size == 'FIRSTPASS' && matrix.mode == 'AUTHENTIC'
        uses: actions/upload-artifact@v4
        with:
          name: lfj-h06-full-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/lfj-h06-all-ci.json
          if-no-files-found: warn
          retention-days: 30
      - name: Serve original tracked XML and JSON from source worktree
        shell: bash
        run: |
          (python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/lfj-1147-xml-csv.log 2>&1) &
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/lfj/qualification/experiments/consumer-sparse-b0-xml-match/xml-csv-original.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lfj-1147-xml-csv.log
          exit 1
      - name: Actual original XML Node-wise and Evidence Tree SHA parity
        env:
          B0_SIZE: ${{ matrix.size }}
          B0_XML_MODE: ${{ matrix.mode }}
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/real-xml-csv-oracle.mjs
      - name: H09 original Firstpass opt-in research handoff capsule and both real CSV byte goldens
        if: matrix.size == 'FIRSTPASS' && matrix.mode == 'AUTHENTIC'
        env:
          B0_SIZE: FIRSTPASS
          B0_XML_MODE: AUTHENTIC
          B0_RESEARCH_HANDOFF: '1'
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/real-xml-csv-oracle.mjs
      - name: A3 native Chromium original Build, both CSVs and stale-source download veto
        if: matrix.size == 'FIRSTPASS' && matrix.mode == 'AUTHENTIC'
        run: node lfj/qualification/experiments/consumer-sparse-b0-xml-match/a3-resolver-stale-browser.mjs
      - name: Source tree unchanged
        run: test -z "$(git status --porcelain)"
