name: Issue 860 C05.4.6 Valve Weight Final Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valve-weight-final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C05.4 and C04 focused Node contracts
        run: |
          node --test \
            tests/xml-cii-issue-856-valve-weight-restart-custody.test.mjs \
            tests/xml-cii-issue-857-valve-weight-cold-hydration.test.mjs \
            tests/xml-cii-issue-858-hydrated-weight-match.test.mjs \
            tests/xml-cii-issue-821-rigid-weight-eligibility.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/issue-860-http.log 2>&1 &
      - name: Run exact-head Valve Weight browser lifecycle
        env:
          XML_CII_ISSUE_859_OUTPUT: ValidationRecords/xml-cii-issue-860-valve-weight-final.json
        run: node scripts/run-xml-cii-issue-859-valve-weight-cold-reload-e2e.mjs
      - name: Upload C05.4 final receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-860-c05-4-valve-weight-final
          path: ValidationRecords/xml-cii-issue-860-valve-weight-final.json
          if-no-files-found: warn
