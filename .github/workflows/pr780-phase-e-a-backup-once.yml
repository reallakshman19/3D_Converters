name: PR780 phase E-A native backup

on:
  push:
    branches:
      - agent/xml-cii-master-dataset-worker-20260929

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xml-cii-master-dataset-worker-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save repository-native backups
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq 'native backup: PR780 phase E-A'; then exit 0; fi
          files=(
            'tabs/xml-cii-2019-standalone/workers/master-dataset-store.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-store.js'
            'tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js'
            'docs/tabs/xml-cii-2019-standalone/workers/master-dataset-startup-hydration.js'
          )
          for file in "${files[@]}"; do
            node utils/backup.js save "$file" "PR780 phase E-A metadata-only startup restore before edit"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .backups
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: native backup: PR780 phase E-A'
          git push origin HEAD:agent/xml-cii-master-dataset-worker-20260929
